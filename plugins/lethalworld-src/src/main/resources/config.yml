  # [alineado] pool con los 12 contratos de ESTUDIO 5.9 (corto: true en los 4 cortos); semanal = 1 Llave del Caos.
  # Cada contrato: texto, evento que lo hace avanzar (Contratos.progreso), objetivo, premio (esencias y
  # mobcoins, por la Aduana) y "mecanica": el interruptor que tiene que estar encendido para que salga
  # en el sorteo (vacio = siempre).
  contratos:
    activo: false
    por-dia: 3
    cortos-garantizados: 1
    cambios-gratis: 1
    precio-cambio: 1
