    sin-alba: {estadistica: horas-activas, umbral: 250, nombre: "Sin Alba", anuncio: true, activo: false, comandos: ["ae giverandombook %jugador% FABLED", "lp user %jugador% permission set rip.death.silencio true"]}
    segador-1: {estadistica: parcas, umbral: 1, nombre: "[SEGADOR] I", anuncio: true, comandos: ["lp user %jugador% permission set segador.badge.unlocked true", "lp user %jugador% permission set rip.death.souls true"]}
    segador-2: {estadistica: parcas, umbral: 10, nombre: "[SEGADOR] II", anuncio: true, comandos: ["lp user %jugador% permission set segador2.badge.unlocked true", "lp user %jugador% permission set gkit.grimreaper true"]}
    segador-3: {estadistica: parcas, umbral: 25, nombre: "[SEGADOR] III", anuncio: true, activo: false, comandos: ["lp user %jugador% permission set segador3.badge.unlocked true", "lp user %jugador% permission set rip.death.trompeta true"]}
    cazaecos-1: {estadistica: cazas-validas, umbral: 5, nombre: "[CAZAECOS] I", anuncio: false, comandos: ["lp user %jugador% permission set cazaecos.badge.unlocked true"]}
    cazaecos-2: {estadistica: cazas-validas, umbral: 25, nombre: "[CAZAECOS] II", anuncio: true, comandos: ["lp user %jugador% permission set cazaecos2.badge.unlocked true", "lp user %jugador% permission set rip.kill.chains true"]}
    cazaecos-3: {estadistica: cazas-validas, umbral: 60, nombre: "[CAZAECOS] III", anuncio: true, comandos: ["lp user %jugador% permission set cazaecos3.badge.unlocked true"]}
