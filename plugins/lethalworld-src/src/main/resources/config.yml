      destacados: {texto: "Mata 5 mobs destacados y sal", evento: destacado, objetivo: 5, esencias: 3, mobcoins: 40}
      eco: {texto: "Cierra un Eco ajeno válido y sal", evento: eco-valido, objetivo: 1, esencias: 5, mobcoins: 80, mecanica: eco.activo}
      al-limite: {texto: "Aguanta 15 min con cordura por debajo de 25 y sal", evento: minutos-limite, objetivo: 15, esencias: 5, mobcoins: 80}
      minijefe: {texto: "Mata un minijefe y sal", evento: minijefe, objetivo: 1, esencias: 6, mobcoins: 100}
      sin-frasco: {texto: "Pasa 30 min dentro sin beber y sal", evento: minutos-sin-frasco, objetivo: 30, esencias: 4, mobcoins: 60}
      cofres: {texto: "Abre 3 cofres de estructura y sal", evento: cofre, objetivo: 3, esencias: 3, mobcoins: 40, mecanica: cofres.activo}
      redimir: {texto: "Redime tu Eco y sal", evento: redimir, objetivo: 1, esencias: 4, mobcoins: 60, mecanica: eco.activo}
