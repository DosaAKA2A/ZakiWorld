    h48: {estadistica: horas-activas, umbral: 48, nombre: "Cuarenta y ocho horas", anuncio: true, comandos: ["lp user %jugador% permission set rip.death.specters true", "lw hardcore dar credito:sello-errante %jugador% 1"]}
