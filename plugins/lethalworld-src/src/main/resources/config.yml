  # Cada hito: estadistica (clave de stats, "horas-activas" en horas, o varias en "estadisticas" que
  # tienen que cumplirse todas), umbral, nombre (lo que se anuncia), comandos por consola con %jugador%
  # validado, anuncio (si sale a todo el servidor) y activo.
  # OJO: los nodos de LuckPerms de los tags II-III, [SEGADOR], [CAZAECOS], [CALAMIDAD] y los de RIP y
  # gkits son PROVISIONALES: los fija el paquete de configuracion leyendo produccion (Fase 0 de PLAN 9).
  # "manto-ids" no es un hito: las piezas MMOItems (TIPO.ID) que cuentan para el [5] del Manto.
