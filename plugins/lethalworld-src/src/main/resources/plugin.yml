name: LethalWorld
version: '1.1.1'
main: net.ederus.lethalworld.LethalWorldPlugin
api-version: '1.20'
author: Iris Studio
description: Lethal World - mundos de datapack con el generador de Bracken procesado
# Los esbirros, las MobCoins y la bitacora salen de EDM: sin el, esto no arranca.
depend: [EDM]
# MMOItems y MythicLib solo se leen por reflexion (PuenteMmo); estar aqui asegura que
# cargan antes y que Paper deja ver sus clases.
softdepend: [PlaceholderAPI, AuraSkills, UltimateMobCoins, WorldGuard, MMOItems, MythicLib]

commands:
  lw:
    description: Lethal World - mundos con el generador de EDM
    usage: /lw <list|generators|create|delete|tp|biomes|biome|pregen|level|reload>
    aliases: [lethalworld]
    permission: ederus.mundos
  calamity:
    description: Calamity - tu saldo, tus Ecos, tus contratos
    usage: /calamity [eco|saldo|contratos|kit|tablero|encuesta|camino]
    aliases: [cal]
    permission: lethalworld.calamity

permissions:
  ederus.mundos:
    description: Crea, borra y visita los mundos de Lethal World
    default: op
  lethalworld.calamity:
    description: /calamity para los jugadores
    default: true
  # lethalworld.parca.exento y lethalworld.aduana.exento ya no existen (1.1.1): con el
  # comodin "*" de LuckPerms todo el staff los heredaba. Las exenciones van a mano, una a una:
  # /lw hardcore exento <jugador> <parca|aduana|todo> <on|off> (se guardan en hardcore-datos.yml).
