name: LethalWorld
version: '2.0.0'
main: net.ederus.lethalworld.LethalWorldPlugin
api-version: '1.20'
author: Iris Studio
description: Lethal World - mundos de datapack con el generador de Bracken procesado
# La bitacora y el Estilo de los mensajes salen de EDM: sin el, esto no arranca.
depend: [EDM]
# Sin softdepend desde la 2.0.0: PlaceholderAPI, AuraSkills, MMOItems y demas los usa
# Calamity, que ya es otro plugin (plugins/calamity-src) y los declara en el suyo.

commands:
  lw:
    description: Lethal World - mundos con el generador de EDM
    usage: /lw <list|generators|create|delete|tp|biomes|biome|pregen|reload>
    aliases: [lethalworld]
    permission: ederus.mundos

permissions:
  # Tambien lo pide /calamidad, de Calamity, pero se declara SOLO aqui: Bukkit no admite el
  # mismo nodo de permiso en dos plugin.yml y el segundo plugin falla al registrarlo.
  ederus.mundos:
    description: Crea, borra y visita los mundos de Lethal World
    default: op
