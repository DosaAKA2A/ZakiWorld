# ============================================================
# EderusMain - Libro encantado aleatorio
# ============================================================
# encantamientos: lista 'nombre:nivelmax' (nombres internos de AE).
# Solo calidades bajas: SIMPLE, UNIQUE, ELITE y ULTIMATE.
# rotura: rango del Destroy Rate (exito = 100 - rotura).
# comando: se ejecuta desde consola; variables:
#   %jugador% %encanto% %nivel% %exito% %rotura%
# Tras editar: /ederuslibro reload

rotura:
  minimo: 75
  maximo: 90

comando: 'ae givebook %jugador% %encanto% %nivel% 1 %exito% %rotura%'

# ============================================================
# Aviso de renovacion de las tiendas de MobCoins
# ============================================================
# UltimateMobCoins no avisa cuando rota su tienda. Este bloque vigila el
# sello de tiempo que el propio plugin deja en su carpeta de datos y anuncia
# en cuanto cambia. No hay que configurar ninguna hora: si alguien fuerza un
# refresco a mano, el aviso sale igual.
#
# webhook: opcional. Si pones la URL de un webhook de Discord, tambien avisa
# alli. Dejalo vacio para no usarlo.

tiendas:
  activo: true
  revisar-cada-segundos: 5
  ruta-diaria: 'plugins/UltimateMobCoins/data/rotating_shop-data.yml'
  ruta-boveda: 'plugins/UltimateMobCoins/data/shop_with_timer-data.yml'
  webhook: ''
  webhook-texto: 'Se ha renovado la tienda de MobCoins: %tienda%'

  # El anuncio va SOLO por chat: titulo y subtitulo se dejan vacios a proposito.
  # La linea del chat que lleve %boton% se manda pinchable.
  # Los degradados usan el formato &x&R&R&G&G&B&B de Spigot, caracter a caracter.
  diaria:
    titulo: ''
    subtitulo: ''
    sonido: 'block.note_block.pling'
    boton-texto: '&x&F&F&E&2&5&9&lA&x&F&F&D&D&5&8&lB&x&F&F&D&8&5&7&lR&x&F&F&D&3&5&7&lI&x&F&F&C&E&5&6&lR &x&F&F&C&9&5&5&lL&x&F&F&C&4&5&5&lA &x&F&F&B&F&5&4&lT&x&F&F&B&A&5&3&lI&x&F&F&B&5&5&3&lE&x&F&F&B&0&5&2&lN&x&F&F&A&B&5&1&lD&x&F&F&A&7&5&1&lA'
    boton-comando: '/mobcoins shop'
    boton-hover: '&7Clic para abrir el Mercado del Dia'
    chat:
      - '&8&m                                                  '
      - ''
      - '            &x&F&F&E&2&5&9&lM&x&F&F&D&D&5&8&lE&x&F&F&D&8&5&7&lR&x&F&F&D&3&5&7&lC&x&F&F&C&E&5&6&lA&x&F&F&C&9&5&5&lD&x&F&F&C&4&5&5&lO &x&F&F&B&F&5&4&lD&x&F&F&B&A&5&3&lE&x&F&F&B&5&5&3&lL &x&F&F&B&0&5&2&lD&x&F&F&A&B&5&1&lI&x&F&F&A&7&5&1&lA'
      - '            &7El catalogo se ha renovado'
      - ''
      - '     &6* &fDiez articulos nuevos &7elegidos al azar'
      - '     &6* &fStock limitado &7para todo el servidor'
      - '     &6* &fVuelve a cambiar &7dentro de 24 horas'
      - ''
      - '                &8[ %boton% &8]'
      - '&8&m                                                  '

  boveda:
    titulo: ''
    subtitulo: ''
    sonido: 'ui.toast.challenge_complete'
    boton-texto: '&x&F&F&D&7&0&0&lV&x&F&F&C&F&0&0&lE&x&F&F&C&8&0&0&lR &x&F&F&C&0&0&0&lL&x&F&F&B&9&0&0&lA &x&F&F&B&1&0&0&lB&x&F&F&A&A&0&0&lO&x&F&F&A&2&0&0&lV&x&F&F&9&B&0&0&lE&x&F&F&9&3&0&0&lD&x&F&F&8&C&0&0&lA'
    boton-comando: '/mobcoins shop'
    boton-hover: '&7Clic para abrir La Boveda'
    chat:
      - '&8&m                                                  '
      - ''
      - '                 &x&F&F&D&7&0&0&lL&x&F&F&C&C&0&0&lA &x&F&F&C&1&0&0&lB&x&F&F&B&6&0&0&lO&x&F&F&A&C&0&0&lV&x&F&F&A&1&0&0&lE&x&F&F&9&6&0&0&lD&x&F&F&8&C&0&0&lA'
      - '            &7Stock del mes repuesto'
      - ''
      - '     &e* &fLos doce articulos &7vuelven a estar disponibles'
      - '     &e* &fLlaves top y libros &7de clase Ancestral'
      - '     &e* &fNo se repone &7hasta dentro de 30 dias'
      - ''
      - '                &8[ %boton% &8]'
      - '&8&m                                                  '

