# ============================================================
# EderusMain - Libro encantado aleatorio
# ============================================================
# encantamientos: lista 'nombre:nivelmax' (nombres internos de AE).
# Solo calidades bajas: SIMPLE, UNIQUE, ELITE y ULTIMATE.
# rotura: rango del Destroy Rate (exito = 100 - rotura).
# comando: se ejecuta desde consola; variables:
#   %jugador% %encanto% %nivel% %exito% %rotura%
# Tras editar: /ederuslibro reload

rotura:
  minimo: 75
  maximo: 90

comando: 'ae givebook %jugador% %encanto% %nivel% 1 %exito% %rotura%'

# ============================================================
# Aviso de renovacion de las tiendas de MobCoins
# ============================================================
# UltimateMobCoins no avisa cuando rota su tienda. Este bloque vigila el
# sello de tiempo que el propio plugin deja en su carpeta de datos y anuncia
# en cuanto cambia. No hay que configurar ninguna hora: si alguien fuerza un
# refresco a mano, el aviso sale igual.
#
# webhook: opcional. Si pones la URL de un webhook de Discord, tambien avisa
# alli. Dejalo vacio para no usarlo.
tiendas:
  activo: true
  revisar-cada-segundos: 30
  ruta-diaria: 'plugins/UltimateMobCoins/data/rotating_shop-data.yml'
  ruta-boveda: 'plugins/UltimateMobCoins/data/shop_with_timer-data.yml'
  webhook: ''
  webhook-texto: 'Se ha renovado la tienda de MobCoins: %tienda%'
  mensaje-diaria:
    - '&8&m                                        '
    - '&e&lMERCADO DEL DIA &7se ha renovado'
    - '&7Hay diez articulos nuevos esperando.'
    - '&7Echales un ojo con &b/mobcoins'
    - '&8&m                                        '
  mensaje-boveda:
    - '&8&m                                        '
    - '&6&lLA BOVEDA &7se ha renovado'
    - '&7Vuelve el stock de los doce articulos del mes.'
    - '&7Echale un ojo con &b/mobcoins'
    - '&8&m                                        '

