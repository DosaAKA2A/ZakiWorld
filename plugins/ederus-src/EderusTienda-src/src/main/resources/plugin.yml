name: EderusTienda
version: 0.1.0
main: com.ederus.tienda.EderusTienda
api-version: '1.21'
description: Tienda propia de Ederus - motor de compra y venta con topes y registro
authors: [Ederus]
depend: [Vault]
commands:
  etienda:
    description: Tienda de Ederus
    usage: /etienda <vender|comprar|precio|topes|recargar>
    aliases: [etnd]
permissions:
  ederus.tienda.usar:
    description: Permite comprar y vender
    default: true
  ederus.tienda.admin:
    description: Permite recargar el catalogo
    default: op
