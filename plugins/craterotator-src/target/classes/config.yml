# ============================================================
#  CrateRotator
# ============================================================
#
# Este plugin ya NO rota los hologramas de FancyHolograms directamente
# (ese metodo se veia como saltos/teletransportes, nunca fluido de verdad).
#
# En su lugar: lee la posicion y el item que YA tiene configurado cada
# holograma de la lista de abajo, oculta ese holograma (para no tener dos
# copias superpuestas), y crea en su lugar una entidad nativa de Minecraft
# (ItemDisplay) que el gira usando la funcion de Paper hecha justamente para
# animar rotaciones sin saltos. No hace falta reconfigurar la posicion ni el
# item a mano, se copian automaticamente del holograma.
#
# Los hologramas deben ser de tipo ITEM (creados con
# "/hologram create item <nombre>") y estar en billboard FIXED.
#
# Como ahora es una entidad de Minecraft de verdad, la visibilidad para
# jugadores que se reconectan la maneja el juego solo (ya no hace falta
# ningun arreglo aparte para eso).

# Nombres EXACTOS de los hologramas (tipo ITEM) que van a girar.
holograms:
  - cratelegendaria
  # - crateminions
  # - crateotra

# Grados que avanza en cada actualizacion (junto con interval-ticks define
# la velocidad total del giro: step x veces-por-segundo = grados/segundo).
degrees-per-step: 6

# Cada cuantos ticks se actualiza el angulo objetivo. No hace falta que sea
# cada tick (1) para que se vea fluido: como usamos interpolacion nativa de
# Paper (Display#setTeleportDuration), cada actualizacion anima el giro
# suavemente durante exactamente ese numero de ticks antes de la siguiente,
# asi que el resultado es un giro continuo sin cortes aunque actualicemos
# pocas veces por segundo. 2-4 suele ser un buen balance de suavidad/rendimiento.
interval-ticks: 2

# Ticks a esperar tras iniciar el servidor antes del primer giro (100 = 5 segundos).
# Le da tiempo a FancyHolograms de terminar de cargar los hologramas guardados
# antes de leer su posicion/item.
startup-delay-ticks: 100
