    dragon: 2.5
    totem: 2.2
    chains: 2.8
    eclipse: 3
    lightning: 4.8
    blackhole: 4.6
    laser: 4.2
    swordfall: 9.5
    orbital: 5.6
    blastoff: 4.8
  death:
    smoke: 1
    bones: 1
    bloodpool: 1
    splat: 1
    dust: 1
