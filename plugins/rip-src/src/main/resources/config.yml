# ╦═╗╦╔═╗   Rip v3.1.0 - Iris Studio
# ╠╦╝║╠═╝   Compatible 1.20 - 1.21
# ╩╚═╩╩
#
# 27 efectos de kill y 27 de muerte en 6 calidades (nueva: INMORTAL). Se equipan con /rip gui
# (menu paginado) o /rip kill|death <id|random|none>. Cada efecto tiene su
# propio permiso: rip.kill.<id> / rip.death.<id>; rip.* concede los 52.
#
# El boton "Aleatorio" del menu sortea uno de tus efectos desbloqueados en
# cada kill o muerte.
#
# INMORTAL (calidad 6):
#  - kill "Despegue Estelar" (blastoff): la victima sale disparada al cielo
#    al estilo Equipo Rocket y desaparece con un destello.
#  - muerte "SESENTA Y SIETE" (sixtyseven): un 67 gigante late sobre tu
#    tumba entre fuegos, espirales y fanfarrias.
#
# Efectos legendarios con entidades (Juicio de Espadas, Peces Globo):
#  - En 1.21.9+ el doble de la victima es un Mannequin con su skin completa.
#  - En 1.20 - 1.21.8 se usa un ArmorStand con su cabeza y su armadura.
#  - Los peces globo y las espadas son invulnerables, no hacen dano y se
#    limpian solos.
#
# Las cabezas del menu se configuran en heads.yml.

# Minimo de milisegundos entre dos efectos del mismo jugador.
# Cada efecto ya tiene su propio enfriamiento igual a lo que dura su animacion
# (de 1 s en los instantaneos a 9,5 s en el Juicio de Espadas), asi que un
# jugador nunca tiene dos animaciones a la vez. Esto solo sube ese suelo.
cooldown-ms: 250

# Maximo de animaciones sonando a la vez en todo el servidor, sean de quien
# sean. El enfriamiento de arriba es por jugador, asi que ya frena a uno que
# mate a cinco de golpe (solo suena la primera), pero no frena a cinco victimas
# distintas muriendo en el mismo tick: cada una es un jugador distinto y cada
# una lanza la suya.
#
# Este limite es lo unico que corta eso. Las animaciones que no entran
# sencillamente no suenan. 0 = sin limite.
max-animaciones-simultaneas: 3

# ---- OCULTAR EL CUERPO ----
# Al morir, el cliente reproduce la animacion vanilla: el jugador se pone rojo y
# cae de lado durante un segundo. En los efectos que destruyen el cuerpo
# (explosion, desintegracion, despegue...) eso se ve mal, porque el cadaver
# sigue ahi tumbandose por debajo de la animacion.
#
# Los efectos de esta lista esconden el cadaver del resto de jugadores en el
# mismo tick de la muerte, asi que el cuerpo desaparece al instante y solo se ve
# la animacion. Vuelve a mostrarse al reaparecer.
#
# Formato: kill.<id> o death.<id>. Borra la clave entera para volver a los
# valores de fabrica; dejala vacia para no ocultar el cuerpo nunca.
ocultar-cuerpo:
  - kill.poof
  - kill.explosion
  - kill.frost
  - kill.inferno
  - kill.meteor
  - kill.dragon
  - kill.blackhole
  - kill.laser
  - kill.swordfall
  - kill.orbital
  - kill.blastoff
  - death.bones
  - death.splat
  - death.dust
  - death.shatter
  - death.void
  - death.ender
  - death.statue
  - death.whirlpool
  - death.angel
  - death.souls
  - death.phoenix
  - death.implosion
  - death.supernova
  - death.pufferfish

# ---- SESENTA Y SIETE ----
# El efecto puede reproducir el sonido "doot 67" de la tienda de zakiworld.net.
# Requiere que los clientes tengan el resource pack ZakiWorld-RipSounds
# (idealmente forzado por servidor con resource-pack en server.properties).
# Si no quieres usar el pack, pon custom-sound: false y sonara una corneta
# vanilla equivalente.
sixtyseven:
  custom-sound: true
  custom-sound-key: "zakiworld:doot67"

# ---- CALIDADES ----
# Reasigna la calidad de cualquier efecto sin recompilar. Cambia el color del
# nombre, los rombos de la barra y el orden que se lee en el menu.
#
# Valores validos, de menor a mayor:
#   COMUN  POCO_COMUN  RARO  MITICO  LEGENDARIO  INMORTAL
#
# Un valor invalido se ignora con un aviso en consola y el efecto se queda con
# su calidad de fabrica. Borra la clave "calidades" entera para volver todo a
# los valores de fabrica. Recarga con /rip reload.
calidades:
  kill:
    blood: COMUN
    hearts: COMUN
    spark: COMUN
    coins: COMUN
    poof: COMUN
    firework: POCO_COMUN
    notes: POCO_COMUN
    slash: POCO_COMUN
    confetti: POCO_COMUN
    pierce: POCO_COMUN
    explosion: RARO
    frost: RARO
    inferno: RARO
    shockwave: RARO
    meteor: RARO
    geyser: RARO
    souls: MITICO
    dragon: MITICO
    totem: MITICO
    chains: MITICO
    eclipse: MITICO
    lightning: LEGENDARIO
    blackhole: LEGENDARIO
    laser: LEGENDARIO
    swordfall: LEGENDARIO
    orbital: LEGENDARIO
    blastoff: INMORTAL
  death:
    smoke: COMUN
    bones: COMUN
    bloodpool: COMUN
    splat: COMUN
    dust: COMUN
    firework: POCO_COMUN
    cherry: POCO_COMUN
    rain: POCO_COMUN
    balloons: POCO_COMUN
    spores: POCO_COMUN
    grave: RARO
    shatter: RARO
    void: RARO
    ender: RARO
    statue: RARO
    whirlpool: RARO
    angel: MITICO
    souls: MITICO
    glitch: MITICO
    phoenix: MITICO
    specters: MITICO
    implosion: LEGENDARIO
    supernova: LEGENDARIO
    lightning: LEGENDARIO
    pufferfish: LEGENDARIO
    requiem: LEGENDARIO
    sixtyseven: INMORTAL

# ---- ENFRIAMIENTOS ----
# Segundos que un jugador debe esperar entre dos animaciones suyas. Los valores
# de fabrica son exactamente lo que dura cada animacion, asi que nunca se
# solapan dos. Admite decimales, de 0 a 60.
#
# Si pones a un efecto menos de lo que dura su animacion, el plugin lo acepta
# pero avisa por consola: a partir de ahi ese jugador puede tener dos
# animaciones a la vez.
#
# cooldown-ms de arriba sigue siendo el minimo global y gana si es mayor. Un
# valor no numerico o fuera de rango se ignora con un aviso. Borra la clave
# "enfriamientos" entera para volver a los valores de fabrica.
enfriamientos:
  kill:
    blood: 1
    hearts: 1
    spark: 1
    coins: 1
    poof: 1
    firework: 1
    notes: 1
    slash: 1
