# =============================================================================
#  Valores (calibrados contra la Gema de Calamidad: +2 % PvE, +4 % no-muertos, +1 vida)
#
#  Regla: nada de armadura ni dureza. El Manto ya llega a 28 de 30 de armadura y a 20 de 20
#  de dureza, y la Protección VIII ya pasa del 80 %: ahí una gema no daría nada (o rompería
#  el tope). Lo defensivo va en reducción de daño (%) y en vida.
#  Lo que puede llevar alguien a la vez son 5 gemas (4 piezas de armadura y el arma en la mano).
#
#  Gema                 Stats                         x5 a la vez
#  Gema de Calamidad    +2 % PvE, +4 % no-muertos, +1  +10 % PvE, +20 % no-muertos, +5 vida
#  Gema del Custodio    -3 % daño recibido, +1 vida     -15 % daño (con el set, -18 %), +5 vida
#  Gema de la Matriarca +5 % crítico, +1 vida           +25 % crítico (Hacha: 32 -> 57 %)
#  Gema del Sanador     +3 vida (1,5 corazones)         +15 vida
#  Gema del Centinela   +4 % daño a mobs, +1 vida       +20 % PvE (Hacha: 20 -> 40 %)
#  Gema del Heraldo     +0,004 velocidad (+4 %), +1     +20 % velocidad (como Velocidad I)
#  Ojo del Vigilante    +3 % PvE, -2 % daño, +1 vida    +15 % PvE, -10 % daño, +5 vida
#
#  A la par: medido como "% de daño a mobs + % de vida efectiva", la Gema de Calamidad da ~5,8
#  (2 + la mitad de los 4 de no-muertos + 1 de vida sobre ~57). Las de minijefe quedan entre
#  4,3 y 5,8; el Ojo, ~6,8: un escalón por encima (x1,15, el paso de la escala de estrellas)
#  y la única con tres stats útiles en todo combate. Tier: BRASA las de minijefe, como la de
#  Calamidad; CALAMIDAD el Ojo.
#  Materiales que no hacen nada al usarlos (ni se lanzan, ni se comen, ni encienden fuego).
# =============================================================================
