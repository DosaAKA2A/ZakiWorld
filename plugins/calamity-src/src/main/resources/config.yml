# Calamity - la PARCA, el Eco, la Aduana y las reglas hardcore de los mundos de Lethal World
#
# Hasta LethalWorld 1.1.1 todo esto vivia en plugins/LethalWorld/config.yml, dentro del
# propio LethalWorld. Ahora es su propio plugin con su propia config; las claves son las
# mismas de entonces (mobs: y hardcore:), tal cual estaban.
#
# Los mundos de Calamity son los de la lista hardcore.mundos: el nombre corto de cada
# mundo tal como sale en /lw list (los crea LethalWorld con /lw create). Fuera de ellos no
# se enciende ninguna regla. Los mobs con nivel (mobs:), en cambio, salen en todos los
# mundos de Lethal World.
#
# Se administra con /calamity (solo staff: calamity.admin; todo en ingles) y se relee con
# /calamity reload. Los jugadores no escriben ningun comando: todo les llega desde los NPCs.

# Mobs de Lethal World: tipos de esbirro (se editan en /esb, carpeta "Lethal World · Panacea")
# que aparecen alrededor de cada jugador segun el bioma donde caen. El spawn natural de
# hostiles vanilla se cambia por estos; los de estructuras y spawners se adoptan (nivel y
# cartel sin cambiar la entidad).
mobs:
  activos: true
  # Cada cuanto se intenta hacer aparecer uno por jugador (20 ticks = 1 s).
  cada-ticks: 40
  # Mobs de Lethal World como mucho alrededor de cada jugador, contados en este radio.
  tope-por-jugador: 6
  radio-conteo: 48
  distancia-minima: 20
  distancia-maxima: 40
  # Los que quedan a mas de esto de cualquier jugador se retiran.
  retirar-a: 96
  probabilidad-destacado: 0.05
  # Hostiles sin nivel a esta distancia de un jugador se adoptan.
  radio-adopcion: 40
  # Quien esta en creativo no cuenta: ni salen mobs a su alrededor ni adopta a los de las
  # estructuras. En true cuenta igual que uno en supervivencia, para probar volando.
  contar-creativo: false
  # Ningun mob por encima de esta escala (los gigantes de las estructuras se encogen).
  escala-maxima: 2.0

  # Adoptados (estructuras, spawners): vida = max(la suya, vida-minima) x (1 + vida-por-nivel x (nivel-1)).
  adoptados:
    vida-minima: 20
    vida-por-nivel: 0.08
    dano-por-nivel: 0.04
    # Los mobs de MythicMobs no se adoptan: ya traen puesta su dificultad al crearlos y
    # si ademas se les escala la vida y el dano por nivel salen imposibles de matar.
    # Solo ponlo en false si quieres justamente eso.
    ignorar-mythicmobs: true

  # Adoptados con uno de estos nombres: minijefes, con nivel extra y mucha vida.
  minijefes:
    nombres: ["Creeper Gigatón", "Ventiarbusto Latente"]
    extra-nivel: 10
    vida-base: 400
    vida-por-nivel: 0.10
    dano-base: 1.5
    dano-por-nivel: 0.05

  # Estructuras que venian vacias: al acercarse alguien aparece su tropa, y vuelve estos
  # minutos despues de la ultima baja. Se escribe sola la primera vez.
  guarnicion-radio: 40
  guarnicion-reaparece-minutos: 20
  guarniciones: {}

  # nivel = rango de rankup x por-rango + poder de AuraSkills / poder-por-nivel, +-variacion.
  # Minimo real: rango 1 sin habilidades = 2. Maximo: rango 20 y poder 1100 = 95 (+10% = 100).
  nivel:
    placeholder-rango: "%notranks_rank_number%"
    por-rango: 2.0
    poder-por-nivel: 20.0
    variacion: 0.10
    extra-destacado: 5
    maximo: 100

  # MobCoins = lo que ese mob paga en el Survival (UltimateMobCoins/mobcoins.yml)
  #            x (1 + nivel / nivel-divisor) x multiplicador-mundo (x destacado).
  # Las paga EDM al que lo mata: pon estos mundos en disabled_worlds de UltimateMobCoins.
  # En Calamity las reparte el Grifo por la Aduana (hardcore.aduana), con sus topes.
  mobcoins:
    base-minima: 0.5
    nivel-divisor: 20
    multiplicador-mundo: 1.0      # era 1.5; provisional hasta leer UltimateMobCoins/mobcoins.yml (PLAN 3.3)
    multiplicador-destacado: 3.0
    multiplicador-minijefe: 0     # ya no se usa: el minijefe cobra el fijo de abajo
    minijefe: {min: 80, max: 120} # una sola via de MC (fichas de /esb a 0-0)

  # Experiencia que suelta cada clase de mob en Calamity (la pone el Grifo).
  xp: {comun: 20, destacado: 60, minijefe: 1500}

  # bioma -> tipos. Se escribe sola la primera vez; se puede editar.
  # Cada bioma: comunes (tantos como se quiera, salen al azar) y un destacado aparte.
  biomas: {}

  # Mobs especiales (Calamity 1.9.0): bichos que no salen de la tabla de su bioma porque
  # necesitan un sitio propio: en el aire (ghast), en el agua (guardian anciano) o con mas
  # altura que un zombi (creaking). En cada ciclo, ademas del mob normal, cada especial que
  # toca en el bioma del jugador tira su dado; primero se elige el bicho y luego se le busca
  # sitio. Como mucho sale un especial por jugador y ciclo. Cada uno tiene su propio tope, asi que
  # salen aunque tope-por-jugador este lleno; mientras viven cuentan dentro de el y dejan
  # sitio de menos a los normales.
  # Cobran como destacados (MobCoins y XP de destacado) y sus bolas de fuego no rompen
  # bloques ni prenden fuego. Si el jugador al que persiguen se mete en la zona spawn, se
  # retiran en humo, como los minijefes.
  #
  # Sus fichas estan en /esb, carpeta "Lethal World · Especiales": se crean solas si faltan y
  # se buscan por su nombre visible. La entidad, la vida y el dano los manda esta seccion (se
  # copian a la ficha al arrancar); el color, el aspecto, las habilidades y el botin se tocan
  # en /esb. Esta seccion se lee al arrancar el plugin. Si la copias al config.yml del
  # servidor, manda la tuya entera (las entradas que no copies no salen).
  #
  #   nombre          nombre visible de su ficha en /esb
  #   entidad         tipo de entidad de Minecraft (CREAKING, GHAST, ELDER_GUARDIAN...)
  #   entorno         suelo | aire | agua: donde se le busca sitio
  #   biomas          lista de "panacea/<id>"; "*" = cualquier bioma con mobs de Lethal World
  #   probabilidad    de salir en cada intento (uno por jugador cada cada-ticks)
  #   tope            como mucho estos vivos alrededor de cada jugador...
  #   radio-tope      ...contados en este radio (los ghasts se alejan flotando: radio amplio)
  #   hueco           suelo: bloques libres encima; aire y agua: lado del cubo libre que pide
  #   altura-minima, altura-maxima   (aire) bloques por encima del suelo
  #   profundidad     (agua) bloques de agua que ha de tener la columna como minimo
  #   vida-base, vida-por-nivel      vida = base x (1 + por-nivel x (nivel - 1))
  #   dano-base, dano-por-nivel      su dano vanilla se multiplica por lo mismo con estos
  #   habilidades     las de los esbirros de EDM; se ponen al crear la ficha
  #   bola-devuelta   (ghast) parte de su vida maxima que le quita cada bola de fuego que le
  #                   devuelves de un golpe. En vanilla muere de una sola, sea del nivel que sea
  especiales:
    activos: true
    crujidor:
      nombre: "Crujidor Pálido"
      entidad: CREAKING
      entorno: suelo
      biomas: ["panacea/conure_conclave", "panacea/ravenous_greenwood", "panacea/hungering_jungle"]
      probabilidad: 0.05
      tope: 2
      radio-tope: 48
      hueco: 3                  # mide 2,7 de alto
      vida-base: 90
      vida-por-nivel: 0.10
      dano-base: 1.4
      dano-por-nivel: 0.05
      habilidades: [ESPINAS]    # devuelve parte de los golpes cuerpo a cuerpo
    ghast:
      nombre: "Ghast Carmesí"
      entidad: GHAST
      entorno: aire
      biomas: ["panacea/crimson_organism", "panacea/condemned_taiga"]
      probabilidad: 0.03
      tope: 1
      radio-tope: 96
      hueco: 5
      altura-minima: 8
      altura-maxima: 16
      vida-base: 80
      vida-por-nivel: 0.10
      dano-base: 1.0            # su bola de fuego ya pega mucho: sube menos que un golpe cuerpo a cuerpo
      dano-por-nivel: 0.03
      habilidades: [IGNEO]      # deja ardiendo al que alcanza
      bola-devuelta: 0.15       # el 15 %: siete bolas devueltas para tumbarlo (1 = de una, como en vanilla)
    guardian:
      nombre: "Guardián Anciano"
      entidad: ELDER_GUARDIAN
      entorno: agua
      biomas: ["*"]
      probabilidad: 0.02
      tope: 1
      radio-tope: 64
      hueco: 2
      profundidad: 3
      vida-base: 110
      vida-por-nivel: 0.10
      dano-base: 1.0            # su rayo atraviesa la armadura: se escala menos
      dano-por-nivel: 0.03
      habilidades: [ACORAZADO]
      # En vanilla su Fatiga minera dura 5 minutos y llega a 50 bloques. Aqui dura esto, y el
      # guardian la renueva cada minuto mientras sigas cerca: se pasa al alejarte o al matarlo.
      # 0 = como en vanilla.
      fatiga-minera-segundos: 60

# ---------------------------------------------------------------------------
# CALAMITY Y LOS MUNDOS HARDCORE
#
# Reglas que SOLO existen en los mundos de esta lista. Fuera de ellos no se
# enciende nada: cada regla pregunta primero por el mundo.
# ---------------------------------------------------------------------------
hardcore:
  activo: true
  # Los mundos de Lethal World que se rigen por esto (el nombre corto de /lw list).
  mundos:
    - calamity
  # En true, quien este en creativo tambien pierde cordura y recibe los efectos.
  contar-creativo: false

  # Cada cuantos segundos se renuevan los efectos del bioma.
  biomas-cada-segundos: 3

  cordura:
    # Cuanta cordura se pierde por minuto en condiciones normales. Con 1.0, cien
    # minutos de expedicion desde la entrada hasta el cero.
    por-minuto: 1.0
    # Multiplicadores que se acumulan: de noche, a oscuras y por bioma.
    factor-noche: 2.0
    factor-oscuridad: 2.0
    # Lo que cuesta un susto: un golpe que se lleve un cuarto de tu vida.
    por-golpe: 5
    # Por debajo del 50%: mobs de mas alrededor y niveles de mas.
    mobs-extra: 4
    nivel-extra: 10
    # Por debajo del 25%.
    nivel-extra-critico: 20
    # A cero.
    mobs-extra-vacio: 6
    # Calamity 1.11 · Donde se ve la cordura:
    #   bossbar   arriba de la pantalla, con el contrato al lado ("Cordura 74%   ·   Mobs 6/10"). Verde
    #             de 50 para arriba, amarillo de 25 a 50 y rojo por debajo. La barra de accion queda
    #             solo para los avisos cortos.
    #   actionbar como en la 1.10, en la barra de accion (la tapan los corazones de absorcion). Por si
    #             la BossBar da problemas en algun cliente (Bedrock).
    # Dosa (2026-10-04) prefiere la barra de accion: de serie, actionbar.
    pantalla: actionbar

  # Con la cordura a cero viene el minijefe del bioma donde estás (Calamity 1.10; en un bioma sin
  # dueño, uno de "tipos" al azar), y no más de uno cada tantos minutos.
  minijefes:
    # Descanso entre dos minijefes del mismo jugador. Lo comparten el de la cordura a cero y el
    # del Reclamo (el Eclipse lo acorta), y se guarda: salir y volver, reconectar o morir no lo borran.
    cada-minutos: 10
    distancia: 30
    # Multiplicadores sobre el esbirro normal de ese tipo.
    vida: 15
    dano: 4
    # 15. Te marca: te sigue aunque cambies de bioma, y si te alejas mas de esto
    #     reaparece a tu lado. Solo se acaba cuando cae uno de los dos.
    #     Calamity 1.10: mientras te espera fuera de la zona spawn no cuenta (ver spawn.minijefes).
    distancia-maxima: 60
    # Los ids de /esb de los minijefes que pueden venir. Al arrancar, el plugin crea en /esb los
    # cinco que falten (carpeta "Lethal World · Minijefes") y, si esta lista está vacía o su primer
    # id ya no existe allí, escribe aquí sus ids y guarda el config (MobsLethal); sus fichas se
    # editan en /esb. 1.10: un tipo que no esté aquí no viene, tampoco en su bioma ni con el
    # Reclamo; con la lista vacía valen los de por-bioma. El cartel con el nombre de Calamity se
    # pinta a los de aquí y a los de por-bioma.
    tipos: []
    # Calamity 1.10 · Dónde vive cada minijefe. El de la cordura a cero es el del bioma donde
    # estás, y el Reclamo llama a ese mismo. Las claves son los ids de "tipos"; "biomas", los de
    # Panacea como "panacea/<id>" (vale también con "bracken:" delante); "donde", cómo se le dice
    # al jugador en Tu camino ("Vive en ..."). Si el config no trae esta sección, vale esta misma
    # tabla; "por-bioma: {}" la apaga (todo al azar, como antes, y el Reclamo no llama a nadie).
    por-bioma:
      custodio-de-las-ruinas: {donde: "las llanuras de hongos, el trópico y el valle de bambú", biomas: ["panacea/polypore_plains", "panacea/horsetail_tropics", "panacea/bamboo_valley"]}
      matriarca-tejedora:     {donde: "las junglas y el colmenar", biomas: ["panacea/hungering_jungle", "panacea/ravenous_greenwood", "panacea/honeybee_biome"]}
      sanador-del-fango:      {donde: "los pantanos", biomas: ["panacea/sweltering_swamp", "panacea/wildflower_bog"]}
      centinela-de-toba:      {donde: "la taiga condenada, el dominio creeper y el cónclave", biomas: ["panacea/condemned_taiga", "panacea/creeper_dominion", "panacea/conure_conclave"]}
      heraldo-carmes:         {donde: "el organismo carmesí y los manantiales de arena", biomas: ["panacea/crimson_organism", "panacea/quicksand_springs"]}
    # Calamity 1.10 · El Reclamo (se compra en el Altar): un cuerno que llama al minijefe del
    # bioma donde estás, sin esperar a la cordura. Solo en Calamity y fuera del spawn, sin la
    # Parca ni otro minijefe detrás y con el descanso de cada-minutos cumplido. Llega a los
    # "segundos" de sonar; si en ese rato sales, mueres o entras al spawn, o no encuentra sitio,
    # te devuelve el Reclamo. Solo cuenta para el tope y el descanso el que trae minijefe.
    reclamo:
      activo: true
      # Los que traen minijefe por jugador y día (el día de hardcore.zona). 0 = sin tope.
      tope-dia: 6
      segundos: 3
    # Calamity 1.10 · Botín extra, además de las MobCoins, las Esencias, las Reliquias y el Sello.
    # Si el config no trae esta sección, vale esta misma; si la trae, manda entera (un tipo que no
    # aparece no tiene entradas propias). Se tira con SecureRandom y todo pasa por Entregas.
    botin:
      # Entradas comunes a los cinco, y luego las propias de cada tipo. Cada entrada:
      #   id            nombre corto, único dentro del tipo (para la piedad y los topes)
      #   prob          0..1
      #   para          mejor (el que más daño hizo) | asesino | participantes (cada uno con >= participacion-minima tira por separado)
      #   piedad        opcional: a la N-ésima muerte de ese tipo sin que le caiga, le toca seguro (por jugador, tipo e id)
      #   objeto        opcional: un objeto de Entregas (libro, gema..., lo que acepte Entregas.dar)
      #   comando       opcional: comando de consola con %jugador% (nombre validado); se usa si no hay objeto
      #   nombre        cómo se le dice al jugador ("un libro LEGENDARY")
      #   anuncio       true = se anuncia a todo el servidor
      # participacion-minima es la de esencias.minijefe (0.10). La piedad sube a cada participante
      # al que no le cae y vuelve a 0 al caerle; llena, le cae aunque no le toque tirar (como el
      # Sello). El libro pasa por el tope del mes (caja.libro-tope-mes; pasado, sus Esencias, que
      # paga la Aduana como las del minijefe: dentro de Calamity, en la mano). El
      # libro y los comandos se dan al momento por consola: quien no está conectado ni tira ni
      # pierde su piedad. Sin objeto ni comando, no hace nada.
      # 1.12.3 · Lote de gemas: cada minijefe suelta SU gema (gema-custodio, gema-matriarca,
      # gema-sanador, gema-centinela, gema-heraldo; sus TIPO.ID en entregas.mmo). Si la plantilla
      # de MMOItems no existe en el servidor, esa entrada no sale ni cuenta piedad. Una entrada
      # "id: gema" sin objeto (la de antes del lote) lleva la gema de su minijefe; para quitarla, prob: 0.
      todos:
        - {id: libro, prob: 0.08, para: mejor, objeto: libro, nombre: "un libro LEGENDARY", anuncio: false}
        # Calamity 1.11: las llaves de las bóvedas (EDM, /dl). Dentro de Calamity llegan a la mano, sin ligar.
        - {id: llave-umbral, prob: 0.25, para: mejor, objeto: llave-umbral, nombre: "una Llave del Umbral", anuncio: false}
        - {id: llave-ominosa, prob: 0.03, para: mejor, objeto: llave-ominosa, nombre: "una Llave Ominosa", anuncio: false}
      custodio-de-las-ruinas:
        - {id: mascota, prob: 0.03, piedad: 30, para: mejor, comando: "pets egg unique iron_golem %jugador%", nombre: "el huevo del Gólem de hierro", anuncio: true}
        - {id: gema, prob: 0.25, para: mejor, objeto: gema-custodio, nombre: "la Gema del Custodio", anuncio: false}
      matriarca-tejedora:
        - {id: mascota, prob: 0.03, piedad: 30, para: mejor, comando: "pets egg unique cave_spider %jugador%", nombre: "el huevo de la Araña de cueva", anuncio: true}
        - {id: gema, prob: 0.25, para: mejor, objeto: gema-matriarca, nombre: "la Gema de la Matriarca", anuncio: false}
      sanador-del-fango:
        - {id: mascota, prob: 0.03, piedad: 30, para: mejor, comando: "pets egg unique evoker %jugador%", nombre: "el huevo del Invocador", anuncio: true}
        - {id: gema, prob: 0.25, para: mejor, objeto: gema-sanador, nombre: "la Gema del Sanador", anuncio: false}
      centinela-de-toba:
        - {id: mascota, prob: 0.03, piedad: 30, para: mejor, comando: "pets egg unique wither_skeleton %jugador%", nombre: "el huevo del Esqueleto wither", anuncio: true}
        - {id: gema, prob: 0.25, para: mejor, objeto: gema-centinela, nombre: "la Gema del Centinela", anuncio: false}
      heraldo-carmes:
        - {id: mascota, prob: 0.03, piedad: 30, para: mejor, comando: "pets egg unique ravager %jugador%", nombre: "el huevo del Devastador", anuncio: true}
        - {id: gema, prob: 0.25, para: mejor, objeto: gema-heraldo, nombre: "la Gema del Heraldo", anuncio: false}

  muerte:
    # Al morir se pierde TODO lo que llevabas encima y la experiencia.
    lo-pierde-todo: true
    # 13. Minutos de espera para volver a entrar tras morir dentro.
    #     APAGADA por Dosa el 2026-09-18.
    cuarentena-minutos: 0

  # El tag de las 24 horas. La etiqueta en si vive en plugins/Tags/tags.yml (el plugin Tags,
  # que sustituyo a AlonsoTags), que decide quien puede ponersela por un PERMISO: entregarla
  # es dar ese permiso.
  # Las horas son ACUMULADAS y no se reinician nunca. Se guardan en hardcore-datos.yml,
  # junto a este fichero, y NO aqui: asi el plugin no reescribe este config cada
  # minuto y lo que se edite a mano o se suba por el panel no se pierde.
  tag:
    activo: true
    horas: 24
    nombre: "[INSOMNE]"
    comando: "lp user %jugador% permission set insomne.badge.unlocked true"

  # El Frasco de Calma: lo unico que devuelve cordura sin salir.
  frasco:
    usos: 3
    cordura: 40
    # Esencias de Calamidad que cuesta rellenar un trago en el altar.
    esencias-por-trago: 1

  # El Cristal de Regreso: segundos que hay que aguantar quieto.
  cristal:
    segundos: 5

  # A donde se sale (muerte, cristal y portal de salida). Sin esto, al spawn del
  # mundo principal. Se pone con /calamity define return estando en el sitio.
  salida: {}

  # Las dos PUERTAS. Ya no son puntos con radio: son CAJAS, porque una esfera no
  # encaja en un marco construido. Se marcan con la vara (/calamity wand: golpe
  # = esquina 1, clic derecho = esquina 2) y se guardan con
  # /calamity define entry|exit. Las escribe el plugin, no hace falta tocarlo.
  # 1.1.0: aqui va tambien la zona SPAWN (/calamity define spawn), la caja donde el
  # AFK dura 5 minutos y acaba en la Grieta (ver parca.spawn). 1.2: solo se usa en un
  # mundo sin la region de WorldGuard de spawn.region (ver spawn, abajo).
  puertas: {}

  # Donde aparece el que entra. Se pone con /calamity define arrival dentro de Calamity.
  llegada: {}

  # 1.2 · La ZONA SPAWN: donde Calamity no hace nada salvo la Grieta (ver parca.spawn). Dentro
  # no nace ningun mob de Calamity, la cordura no baja, y no hay alucinaciones, latido, vineta,
  # niebla, efectos de bioma, minijefe de cordura, Frenesi, testigos, Eco ni PARCA (la que te
  # persigue se va y te espera fuera, como en la puerta). La puerta de salida, el altar, el
  # Cristal y Oren (que compra aqui) siguen igual. Quien muere dentro deja el Eco fuera, en el borde.
  # Es la region de WorldGuard con este nombre en cada mundo hardcore (la del spawn de
  # calamity2 se llama "calamity"); si WorldGuard no esta o ese mundo no la tiene, la caja de
  # la vara (/calamity define spawn). "" = solo la vara. Se relee cada 5 s: un /rg redefine
  # o un /calamity define spawn se notan sin reiniciar. /calamity status dice cual se esta usando.
  spawn:
    region: calamity
    # Los mobs de Calamity que se cuelen (persiguiendo a alguien) se retiran en humo, y
    # ninguno apunta a quien este dentro. En false se quedan (pero dentro sigue sin nacer ninguno).
    retirar-mobs: true
    # Calamity 1.10 · Los minijefes de Calamity ya no se borran por la zona spawn. Hasta la 1.9,
    # meterse en la plaza con uno detras (o arrastrarlo hasta ella) lo deshacia en humo: era la
    # forma de quitarselo de encima sin pelear. Ahora, en true:
    #  - el que se cuela (con retirar-mobs en true) se saca al borde, a 3 bloques de la zona y con
    #    un poco de humo: por el lado de su objetivo o de su presa si persigue a alguien de fuera
    #    (asi no rebota al cruzar la plaza) y, si no, por el mas cercano; los demas mobs se siguen
    #    retirando como siempre;
    #  - el de cordura cero cuya presa entra deja de perseguirla y la espera fuera, cerca del sitio
    #    por donde ella saldria. Mientras espera no la busca, pero si alguien de fuera le pega se
    #    defiende. Cuando ella sale, vuelve por ella. Si ella se va de Calamity o se desconecta
    #    mientras tanto, se va.
    # En false, como hasta la 1.9: se retiran en humo.
    minijefes:
      esperan: true
      # Segundos seguidos que espera. Pasados, se va sin dejar nada y se le avisa a ella por el
      # chat. Si sale antes, la cuenta vuelve a empezar la proxima vez que entre. 0 = no se cansa.
      espera-segundos: 300
      # Si el que espera se aleja mas de esto (en horizontal) del sitio por donde saldria su
      # presa, porque se fue tras alguien de fuera o porque ella ha cruzado la plaza, se le trae
      # de vuelta al borde. 0 = se queda donde este.
      correa: 32
    # Calamity 1.10 · Desde dentro de la zona no se hace dano a los mobs de Calamity ni a las
    # amenazas (Parca, Eco, Ambush), esten donde esten: ni a mano, ni con arco o tridente, ni con
    # pociones arrojadizas o persistentes. Ellos no pueden apuntar a quien esta dentro, asi que
    # pegarles desde ahi era una pelea en la que solo pegaba uno (y con un minijefe esperando en
    # el borde, matarlo sin riesgo). Cuenta donde esta quien ataca. El PvP no cambia: lo decide
    # WorldGuard. Con retirar-mobs en false los mobs de Calamity si pueden apuntar a quien esta
    # dentro, y entonces a ellos si se les puede pegar desde dentro (a las amenazas, no). En
    # false, como hasta la 1.9.
    sin-dano-desde-dentro: true

  # Calamity 1.7: cuanto mas lejos del spawn, mas fuertes los mobs.
  # Se mide en horizontal desde el BORDE de la zona spawn de ese mundo (dentro, nada); si el
  # mundo no tiene zona, desde su spawn. Cuenta donde esta el jugador: le afecta a todo lo que
  # sale para el (esbirros, adoptados, guarniciones y minijefes), no a la PARCA ni al Eco.
  distancia:
    activa: true
    # +1 nivel por cada tantos bloques del borde...
    bloques-por-nivel: 100
    # ...hasta este tope (con 100 y 40, a 4.000 bloques ya no sube mas).
    tope-niveles: 40
    # Cada nivel de distancia con el que nacio un mob sube sus MobCoins esto (0.01 = 1 %,
    # +40 % en el tope). Va aparte de lo que ya paga por tener mas nivel.
    mobcoins-por-nivel: 0.01
    # Aviso en la barra de accion al cruzar cada tantos niveles ("Te alejas del spawn ·
    # mobs +10 niveles"). 0 lo apaga. Dentro de la zona spawn no se avisa.
    aviso-cada-niveles: 5
    # Segundos que se queda ese aviso en la barra de accion (1.8.2; antes, 3).
    aviso-segundos: 5
    # 1.12.3 · El susto del Guardian Anciano (la cara que salta a la pantalla con su chillido,
    # como al acercarse a un monumento marino) al cruzar esta distancia del borde de la zona
    # spawn hacia fuera. No sale al entrar ya pasado ni dentro de la zona spawn; vuelve a
    # poder salir tras volver "rearme" bloques por dentro de la raya (o pisar la zona spawn) y
    # pasados "pausa-segundos" desde el ultimo.
    grito:
      activo: true
      bloques: 1000
      rearme: 100
      pausa-segundos: 300

  # Las quince reglas, cada una con su propio interruptor. Poner una en false (o en 0
  # las que son numero) la apaga sin tocar el resto.
  dificultad:
    # 1. No se duerme: ni se salta la noche ni se pone punto de reaparicion.
    sin-camas: true
    # 2. No se regenera vida sola: pociones y comida encantada.
    sin-regeneracion: true
    # 3. Lo que se pierde de hambre se multiplica por esto; comer sigue dando igual.
    hambre: 2.0
    #    Segundos de veneno y hambre que deja la comida cruda. 0 lo apaga.
    veneno-comida-cruda: 8
    # 4. Caidas y ahogos.
    dano-caida: 2.0
    dano-ahogo: 2.0
    # 5. Cuanta armadura ignoran los mobs de alli. 0.30 = pegan un 30% mas.
    penetracion-armadura: 0.30
    # 6. Lo que se gasta el equipo por uso.
    durabilidad: 2.0
    # 7. El totem se consume y NO salva.
    sin-totem: true
    # 8. Los mobs recogen lo que se cae al suelo y se lo quedan.
    mobs-recogen: true
    # 9. Mobs que te reciben al entrar. APAGADA por Dosa el 2026-09-18.
    oleada-de-entrada: 0
    # 10. Los mobs suben un nivel por cada tantos minutos que lleves dentro. 0 lo apaga.
    #     Cuenta la sesion: al salir de Calamity vuelve a cero. (Hasta la 1.6.1 era 5.)
    nivel-cada-minutos: 3
    #     Y un mob mas alrededor por cada tantos minutos dentro (mismo contador), hasta el
    #     tope. Se suma a los de la cordura baja. 0 lo apaga.
    mobs-extra-cada-minutos: 15
    mobs-extra-tope: 4
    # 11. De noche se cierra el aire con ceniza. OJO: es un efecto por jugador, NO un
    #     bioma repintado: Lethal Biomes pinta zonas y Calamity es infinito.
    niebla-de-noche: true
    #     La OSCURIDAD va a rachas, no continua: el efecto de vanilla es el apagon del
    #     warden y puesto todo el rato deja la pantalla negra. Cada cuantos segundos
    #     llega una racha y cuanto dura. En 0 la noche queda solo con la ceniza.
    niebla-oscuridad-cada-segundos: 45
    niebla-oscuridad-segundos: 3
    # 12. Los cofres de las estructuras salen vacios. APAGADA por Dosa el 2026-09-18.
    cofres-vacios: false
    # 14. Os podeis matar entre vosotros.
    fuego-amigo: true

  # Comandos que no funcionan dentro (el staff con calamity.admin se los salta).
  comandos-prohibidos:
    - spawn
    - home
    - homes
    - sethome
    - tpa
    - tpahere
    - tpaccept
    - back
    - warp
    - rtp
    - wild
    - ec
    - enderchest
    - echest
    # Bancos y grifos a mitad de expedicion (DIS M4): se guardaria lo de dentro sin salir.
    # Comprobar los alias reales en el panel antes de subirlo. El cofre ender y los vaults, con
    # todos sus alias, los bloquea tambien hardcore.sellos.comandos-almacen (con el permiso
    # calamity.bypass.storage el staff si puede).
    - pv
    - playervault
    - playervaults
    - vault
    - ah
    - auction
    - subasta
    - trade
    - kit
    - kits
    - gkit
    - sell
    - pay
    - shop
    - auctionhouse
    - pa
    - playerauction
    - pauction

  # ===========================================================================
  # CALAMITY 1.1.0: PARCA, Eco, Aduana, Esencias, Reliquias y lo demas.
  # 1.1.1 (tras la primera prueba): la PARCA con cuerpo de NPC (parca.cuerpo), mini withers
  # en el Cortejo (parca.planideras), avisos mas largos y legibles, la Huella cuenta las
  # interacciones variadas y el vuelo (parca.interacciones...), y las exenciones van a mano
  # con /calamity exempt (ya no por permiso). Los colores de los mensajes, en Paleta.java.
  # Bloque de DISENO-CALAMITY, seccion 4. Las mecanicas P1 van apagadas de serie
  # (activo: false) hasta probarlas; las P2 estan escritas pero no programadas.
  # Lo que el plugin escribe solo va a hardcore-datos.yml, nunca aqui.
  # ===========================================================================

  # Zona horaria de los "dias" y "semanas" de Calamity (Aduana, contratos, encuesta, eclipse,
  # ranking). Vacio = la del sistema del servidor. Ejemplo: "Europe/Madrid".
  zona: ""

  # ------------------------------------------------------------------ 1. LA PARCA
  parca:
    activa: true
    # huella = celdas distintas pisadas moviendote tu (caza circuitos y vaivenes).
    # bloque = la regla literal: se reinicia al alejarse "radio" bloques. Solo para pruebas.
    modo: huella
    minutos: 5                    # tiempo quieto que la llama (antes, 10)
    muestra-segundos: 5           # cada cuanto se apunta una celda
    celda-horizontal: 2           # lado X/Z de una celda, en bloques
    celda-vertical: 3             # alto de una celda
    max-celdas: 24                # mas celdas distintas que esto = ya no estas quieto
                                  # (nunca mas de 1 por cada 5 muestras de la ventana: con minutos
                                  # por debajo de 10 baja solo; con 5 min = 12 celdas, 1 min = 2)
    radio: 1                      # solo modo bloque
    vehiculo-porcentaje: 0.80     # senal de vehiculo: fraccion de muestras montado...
    vehiculo-lado: 128            # ...y caja maxima del recorrido, en bloques
    vehiculo-muestras-minimas: 60 # muestras necesarias antes de mirar el vehiculo (5 min)
    congelar-segundos: 10         # pausa tras un golpe de amenaza o de un rival valido
    congelar-dano-minimo: 4       # dano final minimo para que un golpe pause
    pausa-maxima-segundos: 180    # presupuesto de pausa...
    pausa-ventana-minutos: 10     # ...por esta ventana (cierra a los alts que se pegan)
    reconexion-minutos: 30        # la huella se guarda en memoria tras desconectarse
    gracia-minutos: 5             # sin contar tras acabar una Parca
    # 1.14.1: tras VENCERLA (no si cosecha a su presa ni si se va), sus marcados y quien le hizo al
    # menos botin.participacion-minima de su vida no la ven en este rato: ni por quedarse quietos,
    # ni por la Grieta, ni en el grupo de otra presa. Sobrevive a salir, morir y reiniciar. 0 = sin tregua.
    tregua-minutos: 60
    # 1.1.1: tambien es moverse interactuar de forma VARIADA: romper, poner o picar bloques,
    # golpear y abrir contenedores en sitios distintos, con la camara girando sin patron. Un
    # autoclicker repite objetivo y angulo, y eso sigue sin contar. Y volando (creativo, /fly,
    # elitros) cuenta desplazarse aunque no lleguen las teclas.
    interacciones: true           # false = solo teclas, como en 1.1.0
    interacciones-minimas: 2      # interacciones variadas en una muestra para que cuente
    giro-minimo: 1.5              # grados que tiene que girar la camara entre dos de ellas
    vuelo-minimo: 1.0             # bloques desplazados volando entre muestras
    # Exentos de la Huella y la PARCA: ya no por permiso (el comodin de LuckPerms se lo daba
    # a todo el staff), sino a mano con /calamity exempt <player> reaper on.
    avisos: [150, 210, 255, 270, 285]   # segundos de quietud de cada aviso, todos antes de minutos x 60
                                        # (con 10 minutos eran 300, 420, 510, 540 y 570)
    radio-campana-ajena: 48       # a cuanto oyen los demas la campana del cuarto aviso
    radio-marca-grupo: 24         # quien este a esto...
    quieto-marca-grupo: 210       # ...y lleve esto quieto, queda marcado tambien (menos que minutos x 60)
    maximo-simultaneas: 3         # Parcas vivas a la vez en todo el servidor
    extra-nivel: 10               # N = nivelCalamity + esto (el de los minijefes)
    vida-base: 400                # vida logica = base x (1 + por-nivel x (N-1)) x ...
    vida-por-nivel: 0.10
    vida-por-repeticion: 0.25     # +25 % por cada Parca de ese jugador en 24 h
    vida-por-marcado: 0.5         # +50 % por marcado extra
    golpe-base: 11                # attack_damage = base x (1 + por-nivel x (N-1)) x R, y encima dificultad-amenazas
    golpe-por-nivel: 0.04
    dano-por-repeticion: 0.5      # R = 1 + esto x repeticiones: +50 % cada una
    tope-repeticion: 3.0          # R maximo
    repeticiones-maximo: 4        # repeticiones que se cuentan como mucho
    ventana-repeticion-horas: 24
    tope-golpe-fraccion: 0.08     # ningun golpe le quita mas que esto de su vida logica
    escala: 1.35                  # escala del esqueleto wither cuando NO lleva cuerpo de NPC
    velocidad: 0.28
    # Cuerpo de NPC (1.1.1): un Mannequin con la skin de una cuenta real encima del esqueleto,
    # que se vuelve invisible y sigue peleando debajo (como Rabby en EDM). La skin se pide a
    # Mojang al invocarla (fuera del hilo principal) y se guarda en memoria: la primera PARCA
    # tras el arranque sale un instante con la skin de serie. Nunca se guarda en el mundo.
    cuerpo:
      activo: true                # false = el esqueleto wither vestido de siempre
      skin: Leonsaurusrex         # cuenta de Minecraft cuya skin lleva (3-16 letras, numeros o _)
      escala: 1.68                # tamano del cuerpo; 1 = un jugador. El esqueleto (su caja) se ajusta solo
    # aviso-ticks: lo que dura el aviso de cada habilidad antes del golpe (20 ticks = 1 s).
    # 1.1.1 los alarga (Siega 24 -> 30, Paso Umbral y Tiron 20 -> 24): se ven mejor y dan el
    # mismo tiempo de reaccion o mas; bajarlos hace la pelea mas injusta, no mas dificil.
    siega: {espera: 6, espera-fase3: 5, angulo: 100, radio: 5, aviso-ticks: 30, vida: 0.20, tope: 0.60, cordura: 8}
    umbral: {espera: 8, distancia: 12, sin-vision-segundos: 4, sin-golpear-segundos: 5, aviso-ticks: 24}
    tiron: {espera: 12, distancia-minima: 6, distancia-maxima: 18, aviso-ticks: 24, rompe: 0.03, fuerza: 1.6}
    # Cortejo (fase II). Desde 1.1.1 las planideras son mini withers que orbitan a la PARCA:
    # sin IA ni barra de jefe, no pegan ni disparan; lloran (lamento: -cordura). Mientras
    # quede una, la PARCA recibe x reduccion; si caen todas antes de 40 s, queda aturdida.
    planideras:
      base: 3                     # planideras = base + marcados extra...
      tope: 6                     # ...con este tope
      vida: 12                    # vida = vida x (1 + vida-por-nivel x (N-1))
      vida-por-nivel: 0.05
      escala: 0.35                # tamano del mini wither (1 = un wither normal)
      radio: 3.0                  # radio de la orbita alrededor de la PARCA, en bloques
      altura: 1.8                 # altura de la orbita sobre sus pies
      lamento-segundos: 4         # cada cuanto llora cada una hacia su objetivo...
      lamento-radio: 12           # ...si esta a esta distancia...
      cordura: 3                  # ...y le quita esta cordura (nunca vida)
      vida-ticks: 800             # se deshacen solas a los 40 s
      reduccion: 0.5              # dano que recibe la PARCA mientras quede alguna
      espera: 30                  # segundos entre cortejos
      aturdir-segundos: 3         # aturdida si caen todas antes de vida-ticks...
      aturdida-extra: 0.25        # ...y recibe +25 % mientras
    # La Ultima campanada (fase III): cinco toques y, en el ultimo, la Sentencia (dano
    # verdadero, -cordura y Oscuridad 1,5 s a quien siga dentro del anillo).
    campanada: {espera: 30, toques: 5, cada-ticks: 24, radio: 10, vida: 0.50, tope: 0.90, cordura: 25, dano-extra-recibido: 0.25}
    furia-minutos: 5              # a partir de aqui esperas x0.7 y velocidad x1.2
    duracion-maxima-minutos: 12   # se va sin botin
    atasco-segundos: 20           # sin golpear ni saltar: aparece encima de la presa
    presencia-radio: 16           # la cordura baja mas rapido cerca de ella...
    presencia-factor: 2.0         # ...por esto
    radio-cosecha: 48             # los mobs que mueren aqui no sueltan nada
    radio-cosecha-bloques: 16     # los bloques que rompe un marcado aqui no sueltan nada
    tierra-segada-minutos: 30     # si mata a su presa, ese sitio no suelta nada...
    tierra-segada-radio: 24       # ...en este radio
    marca-fuera-minutos: 30       # tras salir por la puerta, te espera si vuelves antes
    pendiente-horas: 24           # tras desconectarse sin combate, vuelve al volver
    espera-desconexion-segundos: 60
    reaparece-segundos: 5
    cristal-segundos-marcado: 10  # el Cristal tarda esto con ella cerca...
    cristal-radio-marcado: 24     # ...a esta distancia
    cabeza-textura: ""            # base64 o hash de una cabeza; vacio = la calavera
    botin:
      horas-entre-cobros: 24
      participacion-minima: 0.10  # fraccion de su vida logica para cobrar
      participacion-presa: 0.25   # la presa necesita esto (y ser su primera del dia)
      esencias-base: 4            # presa: base + floor(N / cada-niveles)
      esencias-cada-niveles: 10
      ayudante-esencias-base: 2   # ayudante: base + floor(N / cada-niveles)
      ayudante-esencias-cada-niveles: 20
      reliquia-grados: [25, 50]   # N por debajo de cada umbral -> grado II, III; si no, IV
      mobcoins: 0                 # una sola via de MobCoins (lectura-jefes 4)
      raro: {probabilidad: 0.0, comandos: []}   # hueco del plan de recompensas
    # [alineado] PLAN 3.2: Campana solo al top-3 de dano; +25 % por participante desde el 2.o
    campana: {solo-top: 3}
    grupo: {extra-por-participante: 0.25, maximo-extra: 4}
    # 1.1.0 · La PARCA es tambien una anomalia DIOS de EDM (/anomaly: menu, start parca, here
    # parca, test pa_...). Cuando la Huella la llama y EDM esta libre, viene esa: cuatro fases,
    # quince tecnicas, cambios de fase con escena. Si EDM ya tiene otra anomalia abierta (o no
    # esta su modulo, o se apaga aqui o en su menu) viene la de reserva, la de 1.1.1.
    # Vida y golpe salen de las formulas de arriba (N, r, M), no del ajuste de vida de EDM.
    # El botin es el de arriba, por la Aduana: la experiencia y las MobCoins que EDM daria
    # por 'parca' se dejan a 0 solas (su tabla de botin tiene que quedarse vacia).
    anomalia:
      activa: true                # false = siempre la de reserva
      nivel-sin-presa: 50         # N de la que se abre a mano sin nadie cerca (con gente: la de ellos + extra-nivel)
      ambiente: true              # lluvia en la fase III y noche en la IV, solo para quien este a 48
      anuncio-global: false       # true = la de un AFK se anuncia a todo el servidor como las demas anomalias
                                  # (titulo y coordenadas a todos); false = solo la campana a 128 bloques
      dano: 1.0                   # multiplica el dano de sus tecnicas (se suma al "dano" de /anomaly menu)
      apagadas: []                # tecnicas que no usa: pa_siega, pa_tajos, pa_acecho, pa_acometida, pa_umbral,
                                  # pa_tiron, pa_cortejo, pa_guadanas, pa_salto, pa_embestida, pa_umbrales,
                                  # pa_lluvia, pa_muros, pa_anillo, pa_sentencia
      esperas: {}                 # segundos entre usos por tecnica, p. ej. {pa_lluvia: 20, pa_muros: 30}
    # 1.1.0 · La GRIETA: quieto en la zona spawn (hardcore.spawn) no viene la PARCA: a los
    # "minutos" de aqui abajo se abre una grieta, se lo traga y lo escupe en un sitio
    # seguro al azar a distancia-min..distancia-max del spawn, y alli le aparece la PARCA.
    # Los avisos previos salen igual, a la misma proporcion, con su propio texto.
    spawn:
      activa: true
      minutos: 5                  # quieto en el spawn (1.8.2: aunque la Parca de fuera tenga otros "minutos").
                                  # Cuentan desde que entra si ha estado fuera al menos los "minutos" de la
                                  # Parca; si vuelve antes, sigue con lo que llevaba. Al salir, la Parca
                                  # cuenta desde que sale
      distancia-min: 600
      distancia-max: 1500
      intentos: 12                # puntos al azar que prueba antes de rendirse (1.2: entonces vuelve a abrirse al minuto;
                                  # la PARCA no viene nunca a la zona spawn)
      # 1.6.1 · Pescar en la zona spawn no abre la Grieta. Cada pez (o cosa) que sacas con la
      # caña pone a cero el reloj de la Grieta y lo tiene parado "pesca-gracia-segundos". Lanzar
      # la caña, que pique o recogerla también lo alargan, pero solo si has sacado algo en los
      # últimos "pesca-captura-minutos": quien lanza y recoge sin parar sin pescar nada (un
      # autoclicker) acaba igual en la Grieta.
      # Solo vale en la zona spawn: fuera, pescar sin moverse sigue llamando a la PARCA, porque
      # una granja de pesca AFK sigue siendo estar AFK.
      pesca-cuenta: true          # false = pescar en el spawn no frena la Grieta
      pesca-gracia-segundos: 90
      pesca-captura-minutos: 3

  # ------------------------------------------------------------------ 1b. AMBUSH (1.8.0)
  # El samurai de los contratos. El NPC de la Sentencia (lo pone el staff con Citizens, como los
  # demas: /npc command add -l -r calamity open <p> bounty) lista a quien este ahora en
  # Calamity fuera del spawn. Pagar su contrato le da 1 minuto para irse (puerta o Cristal de
  # Regreso); si se queda, Ambush aparece a 12 bloques. Un contrato por presa cada 24 h y como
  # mucho 2 al dia por pagador, los dos con las horas minimas de la Aduana y sin compartir
  # conexion. Quien paga no cobra nada. Al caer Ambush, la presa (con el 25 % del dano o mas) se
  # lleva un Fragmento de Masamune en fisico (al inventario o, si no cabe, a sus pies; si muere
  # dentro, lo pierde) y Esencias; quien la ayude (10 % o mas), Esencias. Si en 8 minutos no cae,
  # se retira. En la Forja: la Masamune (5 Fragmentos) y la Crimson Masamune (la Masamune y 5 mas).
  # Si esta seccion no esta en el config.yml del servidor, valen estos mismos valores.
  ambush:
    contrato:
      esencias: 24                # lo que cuesta un contrato, del saldo del que paga
    vida-base: 300                # vida logica = base x (1 + por-nivel x (N-1)); N = el de la presa + 10
    vida-por-nivel: 0.10
    golpe-base: 10                # attack_damage = base x (1 + por-nivel x (N-1)), y encima dificultad-amenazas
    golpe-por-nivel: 0.04
    tope-golpe-fraccion: 0.08     # ningun golpe le quita mas que esto de su vida logica
    esencias-presa: 6             # presa: esto + 1 cada 10 niveles
    esencias-ayuda: 2             # quien ayuda: esto + 1 cada 20 niveles
    # Cuerpo de NPC como la Parca: la skin de una cuenta de Minecraft (3-16 letras, numeros o _).
    # Al bajar de fase-2-vida de su vida se transforma (fase 2) y pasa a la segunda skin.
    skin-fase-1: itGuts
    skin-fase-2: Nagazaki_Yakuza
    fase-2-vida: 0.5

  # ------------------------------------------------------------------ 1b2. EL VIGILANTE
  # Anomalia Monarca de tierra, un escalon bajo la Parca: un JINETE sin cabeza (calabaza tallada apagada
  # y una maza) montado en un zoglin gigante, que salen juntos escarbando de la tierra detras de quien,
  # pasados llegada.bloques del borde de la zona spawn, abre llegada.cofres cofres o mata
  # llegada.minijefes minijefes ahi (cofres de estructura y de ruinas). Antes, dos avisos; con el
  # segundo el suelo retumba bajo la presa y algo se acerca escarbando. Una vez al dia por jugador y como
  # mucho llegada.maximo-vivos a la vez (los que vienen escarbando cuentan). No viene si ya tiene encima
  # la Parca, un contrato de Ambush u otro Vigilante (una amenaza grande a la vez).
  # Como Alba en su caballo: el jinete es la anomalia (nombre, barra, vida y botin); la bestia es su
  # montura, sin nombre ni barra y sin dano propio, pero lo que un jugador le pega pasa al jinete.
  # Cuatro fases por vida: Acecho y Bajo tierra (montado), A pie (bajo jinete.desmonte: desmonta y la
  # bestia embiste suelta desde el borde) y Furia (bajo jinete.remonte: vuelve a montar).
  # Sin brillo, sin luces y sin nada flotando; los bloques que saltan del suelo son efimeros (no se
  # colocan ni sueltan nada) y las cabezas negras no arden ni rompen nada. Sonidos de vanilla y graves;
  # nunca campanas (son de la Parca y las muertes).
  # Los golpes fuertes quitan una parte de TU vida maxima (entre golpes.minimo y golpes.maximo),
  # sin que la armadura los pare, y siempre se avisan en el suelo al menos 20 ticks antes (un
  # aviso-ticks menor se sube solo). Con la vida llena nunca te matan, ni dos juntos. La caida de quien
  # sale volando por un golpe suyo SI hace su dano (el de Calamity, doble), aunque mate.
  # Staff: /calamity vigilant spawn [player] | test | info [player] | health <0-1>
  #        | ability <name> | remove | reset <player>. Tambien sale en /anomaly (prueba sin botin).
  #        info dice si va montado; ability acepta slam, toss, charge, burrow, roar (montado), smash,
  #        sweep, skull (a pie; sweep montado es el barrido desde arriba), stampede (la bestia suelta),
  #        dismount y remount.
  # Las claves del golem de la 1.13.0 que ya no se usan (escala-cuerpo, velocidad, atasco-segundos,
  # llegada.caida-ticks, golpes.marcado-extra, mirada y las habilidades viejas) se ignoran.
  # Si esta seccion no esta en el config.yml del servidor, valen estos mismos valores.
  vigilante:
    activo: true
    llegada:
      bloques: 1000               # desde el borde de la zona spawn (la medida de hardcore.distancia)
      cofres: 3                   # cofres abiertos pasada la raya, en el dia (0 = no cuentan)
      minijefes: 1                # o minijefes muertos pasada la raya (0 = no cuentan)
      maximo-vivos: 2             # Vigilantes vivos o viniendo a la vez en todo el servidor
      aviso-segundos: 5           # del aviso 1 al 2; con el 2 empieza a escarbar hacia la presa
      temblor-ticks: 80           # lo que tarda en llegar escarbando bajo tierra (20 a 200)
      emerger-aviso-ticks: 24     # el suelo se agrieta donde sale antes de reventar (nunca menos de 20)
      distancia: 10               # a cuantos bloques por detras de la presa sale
      impacto-radio: 4            # al reventar el suelo: golpe fuerte a quien este encima
      impacto-fraccion: 0.25
    vida-base: 360                # vida logica = base x (1 + por-nivel x (N-1)) x jugadores x Poder x dificultad
    vida-por-nivel: 0.10
    extra-nivel: 8                # N = el nivel de Calamity mas alto del grupo + esto (la Parca, +10)
    golpe-base: 9                 # el mordisco de la bestia (attack_damage) y la base de la maza del jinete, mismo escalado
    golpe-por-nivel: 0.04
    tope-golpe-fraccion: 0.08     # ningun golpe le quita mas que esto de su vida logica
    cuerpo:
      escala: 2.6                 # tamano del zoglin (1 a 4); su caja mide 1,4 x esto de ancho y de alto
      velocidad: 0.34             # movement_speed de su IA (0,1 a 0,6)
      paso: 1.6                   # step_height: sube un bloque de desnivel sin saltar (1,1 a 2,5)
      furia-velocidad: 1.3        # bajo el 25 %, velocidad x esto
      furia-espera: 0.65          # bajo el 25 %, las esperas de sus habilidades x esto (los hundimientos, aun menos)
      atasco-segundos: 4          # sin alejarse del sitio ni llegar a su objetivo tanto rato: se hunde y sale debajo
    # El jinete: lo que se ve es un maniqui con la skin de una cuenta de Minecraft (solo letras, numeros y _;
    # si no vale o Mojang no contesta, se ve el esqueleto con la calabaza y la maza). Lleva la vida y el nombre.
    jinete:
      skin: RocketOniPad          # la cuenta cuya skin lleva el jinete
      escala: 1.6                 # tamano del jinete (1 a 2,5)
      velocidad: 0.30             # a pie (fase III), movement_speed de su IA (0,15 a 0,5)
      desmonte: 0.50              # bajo esta vida desmonta y pelea a pie (fase III; 0,3 a 0,7)
      remonte: 0.25               # bajo esta vida vuelve a montar en furia (fase IV; al menos 0,1 menos que desmonte)
      retirada: 16                # a pie, la bestia espera en el borde a esta distancia del jinete (10 a 28)
      # Golpes basicos de la maza (dano normal, con armadura: golpe-base escalado x dano): a pie, a quien
      # tenga a alcance bloques; montado, a quien se arrime a la bestia, mas espaciados.
      basico: {alcance: 3.5, espera-ticks: 20, espera-montado-ticks: 36, dano: 0.8}
    duracion-minutos: 10          # sin caer en esto, se hunde en la tierra sin botin
    abandono-segundos: 30         # sin nadie a radio-pelea tanto tiempo, se va
    radio-pelea: 48
    radio-grupo: 24               # quien este a esto al salir cuenta para su escala
    escala:
      por-jugador: 0.35           # vida x(1 + esto) por cada jugador de mas, contando los que se suman
      jugadores-tope: 5
      poder-cada: 2000            # cada tanto de Poder (/flex) es un tramo
      poder-vida: 0.06            # vida +6 % por tramo
      poder-dano: 0.04            # mordisco +4 % por tramo
      poder-tope-tramos: 6
      poder-placeholder: "%edm_poder%"   # solo si la API de EDM no responde
    golpes:
      minimo: 0.25                # fraccion de tu vida maxima; los golpes fuertes suben con dificultad-amenazas
      maximo: 0.90                # nunca 1: con la vida llena no te mata
      ventana-ticks: 10           # dos golpes fuertes en esta ventana no pasan de maximo entre los dos
    efimeros:
      por-golpe: 12               # bloques del suelo que saltan en cada golpe (como mucho 24)
      maximo: 40                  # en el aire a la vez por Vigilante (como mucho 64)
      vida-ticks: 60              # se retiran a los 3 s aunque no hayan caido
    ambiente-segundos: 6          # cada cuanto suena algo de Halloween alrededor (lamentos, susurros, la cueva)
    habilidades:
      # espera-ticks: hasta que la repite; aviso-ticks: lo que se ve en el suelo antes; fraccion: de tu vida maxima.
      # Martillazo: salta (salto = su velocidad hacia arriba) hacia su objetivo y cae aplastando el suelo.
      # Hasta radio-cerca sales lanzado hacia arriba altura-lanzado bloques (como mucho 24); hasta
      # radio-medio, empujado muy lejos (empuje-medio) con fraccion-medio; hasta radio-lejos, un empujon.
      martillazo: {espera-ticks: 140, aviso-ticks: 20, fraccion: 0.30, alcance: 22, salto: 1.3, radio-cerca: 4.5, radio-medio: 10, radio-lejos: 16, altura-lanzado: 18, fraccion-medio: 0.25, empuje-medio: 3.6, empuje-lejos: 1.0}
      # Cabezazo: embiste a uno (velocidad en bloques por tick) y lo manda altura bloques hacia arriba.
      lanzamiento: {espera-ticks: 100, aviso-ticks: 20, fraccion: 0.30, alcance: 10, velocidad: 1.1, altura: 10}
      # Embestida en linea recta de largo bloques; contra una pared queda aturdido y recibe mas dano.
      embestida: {espera-ticks: 160, aviso-ticks: 20, fraccion: 0.35, largo: 24, velocidad: 1.0, empuje: 1.6, aturdido-segundos: 2, aturdido-dano-extra: 0.30}
      # Se hunde, va bajo tierra (velocidad) hasta uno al azar y sale debajo: a radio, lanzado altura bloques.
      hundimiento: {espera-ticks: 320, aviso-ticks: 20, fraccion: 0.30, radio: 3, altura: 14, velocidad: 0.9}
      # Sin dano: Oscuridad (1 a 3 s, nunca continua: no se repite antes de 300 ticks) y cordura menos.
      rugido: {espera-ticks: 400, aviso-ticks: 20, radio: 16, oscuridad-segundos: 2.5, cordura: 4}
      # Lo del jinete a pie (fase III, o si se queda sin montura).
      # Mazazo: salta alto sobre uno (salto) y cae con la maza. Como el martillazo pero mas corto y mas
      # frecuente: hasta radio-cerca, lanzado altura-lanzado bloques (como mucho 14); hasta radio-medio,
      # empujado lejos (empuje-medio); hasta radio-lejos, un empujon.
      mazazo: {espera-ticks: 70, aviso-ticks: 20, fraccion: 0.25, alcance: 14, salto: 1.1, radio-cerca: 3, radio-medio: 6.5, radio-lejos: 9, altura-lanzado: 10, empuje-medio: 2.4, empuje-lejos: 0.8}
      # Barrido de maza en arco delante de el (radio bloques, angulo grados). En furia, montado, barre
      # tambien desde lo alto de la bestia a quien se le arrime: aviso de arriba-aviso-ticks (10 a 20),
      # cada arriba-espera-ticks, dano normal golpe-base escalado x arriba-dano.
      barrido: {espera-ticks: 60, aviso-ticks: 20, fraccion: 0.25, radio: 5.5, angulo: 150, empuje: 1.5, arriba-espera-ticks: 40, arriba-aviso-ticks: 12, arriba-dano: 1.0}
      # Cabeza negra: a quien se aleje mas de distancia-minima (y hasta alcance), una cabeza de wither negra
      # a velocidad bloques por tick. Estalla sin fuego ni bloques: golpe fuerte a radio y unos segundos de
      # marchitamiento (como mucho 5).
      cabeza-negra: {espera-ticks: 90, aviso-ticks: 20, fraccion: 0.25, distancia-minima: 12, alcance: 32, velocidad: 0.8, radio: 2, marchitez-segundos: 3}
      # La bestia sin jinete (fase III): se retira al borde y cada espera-ticks cruza la pelea en estampida
      # (largo bloques como mucho; antes si alguien se le arrima). Usa la velocidad y el empuje de embestida.
      estampida: {espera-ticks: 180, aviso-ticks: 20, fraccion: 0.30, largo: 34}
      # Desmonte (al entrar en la III): salta de la bestia (salto) y la maza golpea el suelo al caer: golpe
      # fuerte a radio y una onda que aparta (empuje) hasta onda bloques.
      desmonte: {aviso-ticks: 20, fraccion: 0.25, radio: 3.5, onda: 8, empuje: 1.3, salto: 1.0}
      # Remonte (en la IV, o si algo lo baja fuera de la III: lo mira el guardian cada 2 s): la bestia viene
      # a por el y a distancia bloques salta a su lomo.
      remonte: {aviso-ticks: 10, distancia: 6}
    botin:
      horas-entre-cobros: 24
      participacion-minima: 0.10  # de su vida logica, para cobrar
      esencias-base: 5            # cada uno que cobra: esto + 1 cada esencias-cada-niveles niveles
      esencias-cada-niveles: 10
      reliquia-grado-iv: 50       # una Reliquia alta: IV desde este N, III por debajo
      # Lo de mas, como minijefes.botin (para: mejor | asesino | participantes; piedad: a la N-esima
      # sin que caiga, cae). La gema y las placas son de MMOItems: CALAMITY_GEMAS.GEMA_OJO_DEL_VIGILANTE
      # y CALAMITY_MATERIALES.PLACA_DEL_VIGILANTE (se pueden cambiar en entregas.mmo.gema-vigilante y
      # entregas.mmo.placa-del-vigilante; no se ponen ahi de serie porque el selftest mmo crea todo lo
      # de esa lista). Mientras MMOItems no los tenga, no salen ni cuentan piedad.
      extra:
        - {id: gema, prob: 0.20, para: mejor, piedad: 8, objeto: gema-vigilante, nombre: "la gema Ojo del Vigilante", anuncio: true}
        - {id: placa, prob: 0.60, para: participantes, piedad: 3, objeto: placa-del-vigilante, nombre: "una Placa del Vigilante"}
        - {id: libro, prob: 0.06, para: mejor, objeto: libro, nombre: "un libro LEGENDARY"}

  # ------------------------------------------------------------------ 1c. LO QUE ENDURECE A LA PARCA Y A AMBUSH
  # La Parca y Ambush salen más fuertes cuanto peor lo tiene su presa en el momento en que
  # aparecen: lejos del spawn, con poca cordura y con mucho rato dentro. Cada una de las tres
  # cosas da un multiplicador de daño y otro de vida, y los tres se multiplican entre sí. Van
  # después de la fórmula por nivel (y de las repeticiones de la Parca); el tope por golpe que
  # reciben no cambia. Sin nada de esto, x1. Se miran al aparecer y no cambian en la pelea: la
  # Parca que vuelve tras una desconexión, la puerta o un reinicio trae los que tenía.
  # Ejemplo: a 2.000 bloques, con 18 de cordura y 2 horas dentro, daño x1,6 x1,4 x1,6 = x3,58
  # y vida x1,4 x1,2 x1,4 = x2,35.
  # La Siega y la Sentencia de la Parca, que quitan una parte de tu vida, suben con el mismo
  # multiplicador de daño hasta su tope (parca.siega.tope y parca.campanada.tope).
  # /calamity reaper info <player> y /calamity ambush info enseñan lo que lleva cada una.
  # Si esta sección no está en el config.yml del servidor, valen estos mismos valores.
  dificultad-amenazas:
    # Distancia al borde de la zona spawn (la misma medida que hardcore.distancia): cada
    # cada-bloques suma dano y vida, hasta tope-tramos tramos (8 x 500 = 4.000 bloques).
    # cada-bloques: 0 lo apaga.
    distancia: {cada-bloques: 500, dano: 0.15, vida: 0.10, tope-tramos: 8}
    # Cordura: cuenta solo el tramo más bajo que cumpla (cordura por debajo de por-debajo).
    # por-debajo: 1 es la cordura vacía. Con cordura: [] no cuenta.
    cordura:
      - {por-debajo: 50, dano: 0.20, vida: 0.10}
      - {por-debajo: 25, dano: 0.40, vida: 0.20}
      - {por-debajo: 1, dano: 0.60, vida: 0.30}
    # Tiempo dentro de Calamity en esta visita (el mismo contador que sube el nivel de los mobs:
    # vuelve a cero al salir, al morir y al desconectarse). Cada cada-minutos suma dano y vida,
    # hasta tope-tramos tramos (6 x 30 = 3 horas). cada-minutos: 0 lo apaga.
    tiempo: {cada-minutos: 30, dano: 0.15, vida: 0.10, tope-tramos: 6}

  # ------------------------------------------------------------------ 2. EL ECO
  eco:
    activo: true
    minimo-piezas: 1              # armadura o arma para dejar Eco (o una reliquia o esencia)
    segundos-para-alzarse: 8
    radio-despertar: 32
    radio-dormir: 64
    segundos-para-dormir: 30
    horas: 12                     # vida del Eco desde que nace, en horas reales
    maximo-global: 40
    errantes-por-jugador: 2       # Ecos viejos con botin que se conservan
    desmoronar-minutos: 30        # aviso antes de deshacer un errante por el tope
    extra-nivel: 5
    extra-nivel-si-parca: 5
    vida-multiplicador: 3.0       # vida = max(minima, H x mult x (1 + por-nivel x (N-1)))
    vida-por-nivel: 0.04
    vida-minima: 60
    dano-multiplicador: 0.8       # dano = clamp(D x mult x (1 + por-nivel x (N-1)), minimo, maximo)
    dano-por-nivel: 0.02
    dano-minimo: 3
    dano-maximo: 30
    tope-golpe-fraccion: 0.20
    velocidad: 0.26
    busca-a: 64                   # busca a su dueno o a su asesino a esta distancia del anclaje
    cercano-radio: 24
    correa: 32
    correa-presa: 64
    correa-maxima: 48
    distancia-puertas: 24         # nunca nace mas cerca que esto de las puertas o la llegada
    paso: {sin-golpear-segundos: 6, espera: 10}
    desesperacion: {umbral: 0.30, segundos: 8, extra: 0.20}
    escudo: {probabilidad: 0.25, espera-segundos: 3}
    recompone: {tras-segundos: 15, por-segundo: 0.02}
    esencias-heredadas: 0.5       # fraccion de las esencias del muerto que lleva
    preferencia-segundos: 10      # el botin solo lo recoge quien lo mato durante esto
    esencias-base: 1              # esencias nuevas = base + floor(N / cada-niveles)
    esencias-cada-niveles: 20
    # [alineado] PLAN 3.2: caza valida y Lagrima por el escalon del equipo del muerto (censo)
    caza-valida: {escalon-medio-minimo: 4, o-pieza-mmoitems: true, minutos-minimos: 15, o-reliquias: 1, par-dias: 7}
    lagrima-por-escalon: {4: 2, 6: 3, 12: 4}   # escalon medio >= clave -> grado
    marcas: {dia: 2, semana: 8, propio: {semanal: 1, nivel-minimo: 40}}
    cobros-dia: 5
    cordura-dueno: 30
    trofeo-probabilidad: 0.25
    reconocer-cordura: 5
    senal-radio: 48
    aviso-dueno-radio: 150
    voces: {activo: false, radio: 24, minutos: 10, cada-min-segundos: 20, cada-max-segundos: 40}   # P1
    cuerpo-jugador: false         # P1: Mannequin con su cara
    # El Eco es siempre un esqueleto, y la variante depende del bioma donde murió su dueño. Cada
    # regla da su variante si la clave del bioma (bracken:panacea/condemned_taiga, minecraft:swamp...)
    # contiene alguno de sus trozos. Se miran en orden y manda la primera que encaje; si no encaja
    # ninguna, SKELETON. Variantes: SKELETON, STRAY, BOGGED y WITHER_SKELETON.
    cuerpo:
      por-bioma:
        - {variante: STRAY, trozos: [taiga, snow, frozen, ice, cold, grove, peaks]}
        - {variante: BOGGED, trozos: [swamp, bog, mangrove, polypore, fango]}
        - {variante: WITHER_SKELETON, trozos: [crimson, nether, soul, warped, basalt]}

  # ------------------------------------------------------------------ M1. ADUANA
  aduana:
    activo: true
    horas-minimas: 10             # horas jugadas para pagos entre dos jugadores
    huella-ip: auto               # auto | si | no
    huella-dias: 30
    tramos-mc:                    # [alineado] PLAN 3.3: tope duro de 1.500 MC al dia
      - {hasta: 1500, factor: 1.0}
      - {hasta: 999999, factor: 0.0}
    topes-diarios: {parca: 1, eco: 5, sangre: 12, contratos: 3, cazas: 3, encuesta: 2, ambush: 1, vigilante: 1}   # [alineado] encuesta + voto; 1.8.0 ambush; 1.13.0 vigilante
    fusible:
      mc-jugador-hora: 500        # [alineado] era 600. Por encima, el resto de la hora paga x recorte
      recorte: 0.25
      mc-global-hora: 6000        # por encima, aviso al staff (no corta)

  # ------------------------------------------------------------------ M2. ESENCIAS Y ALTAR
  esencias:
    activo: true
    material: GHAST_TEAR          # material de las esencias NUEVAS (se reconocen por la marca)
    cuota-jugador: 0.5            # fraccion de la vida del mob que tiene que venir de jugadores
    decae-por-hora: 30            # f = max(minimo, 1 - esencias de mobs en la ultima hora / esto)
    decae-minimo: 0.2
    comun: {prob: 0.03, min: 1, max: 1}
    destacado: {prob: 0.25, min: 1, max: 2}
    # [alineado] PLAN 3.2: 1 + floor(N/25) a cada participante con >= 10 % del dano
    minijefe: {base: 1, cada-niveles: 25, participacion-minima: 0.10}
    saldo: true                   # [alineado] fuera de Calamity las Esencias son saldo (M31)
    # Rama venta-oren: las fisicas ya no pasan solas al saldo al salir; las ingresa Oren (o el boton del
    # saldo del Altar, fuera). true: como antes, fuera se ingresan solas al cambiar de mundo o abrir algo.
    deposito-automatico: false
    # La primera salida con vida de cada dia por el portal: base, y si-tasa mas si sales con alguna
    # Reliquia que vale o si en esa entrada ya le vendiste alguna a Oren.
    primera-extraccion-dia: {base: 2, si-tasa: 1}
  altar:
    activo: true
    # 1.3.0: lo que llegue a estas Esencias pide confirmar en una segunda pantalla (la Forja entera,
    # y lo que pida MobCoins o un credito, siempre). 0 = en el Umbral nada lo pide.
    confirmar-desde: 50
    # [alineado] PLAN 4. pagina: umbral|forja. da: frasco|cristal|dar:<objeto>|credito|forja:<pieza>|ofrenda|contrato|depositar|camino
    # entregar: lo que hay que llevar encima y se entrega al forjar, con su cantidad: [{objeto: fragmento-masamune, cantidad: 5}].
    #   objeto: fragmento-masamune o una pieza de forja.piezas (masamune...). Vale tambien lo de antes, entregar: masamune (una pieza).
    # limite-dia / limite-semana por jugador; stock-semana global (0 = sin tope); mobcoins por Monedero (M35).
    trueques:
      - {id: recargar, pagina: umbral, icono: POTION, nombre: "Recargar Frasco", da: recargar}   # precio: hardcore.frasco.esencias-por-trago (ya existe)
      - {id: frasco, pagina: umbral, icono: POTION, nombre: "Frasco de Calma", esencias: 10, da: frasco, limite-semana: 3}
      - {id: cristal, pagina: umbral, icono: AMETHYST_SHARD, nombre: "Cristal de Regreso", esencias: 16, da: cristal, limite-semana: 5}
      - {id: tintura, pagina: umbral, icono: POTION, nombre: "Tintura de Ceniza x2", esencias: 3, da: "dar:tintura", cantidad: 2, limite-dia: 5}
      - {id: reclamo, pagina: umbral, icono: GOAT_HORN, nombre: "Reclamo", esencias: 6, da: "dar:reclamo", limite-dia: 3}   # 1.10: llama al minijefe del bioma (minijefes.reclamo)
      # Calamity 1.12.2: el Barómetro (hardcore.barometro). No se gasta: uno al día basta para reponer el que se pierda.
      - {id: barometro, pagina: umbral, icono: COMPASS, nombre: "Barómetro", esencias: 15, da: "dar:barometer", limite-dia: 1}
      # Calamity 1.11: las llaves de las bóvedas. La del Umbral cuesta lo que vale de media una Bóveda de Ruinas
      # (unas 8-10 Esencias): comprarla es comodidad, no negocio. La Ominosa pide entregar 5 del Umbral.
      - {id: llave-umbral, pagina: umbral, icono: TRIAL_KEY, nombre: "Llave del Umbral", esencias: 10, da: "dar:llave-umbral", limite-dia: 2}
      - {id: llave-ominosa, pagina: umbral, icono: OMINOUS_TRIAL_KEY, nombre: "Llave Ominosa", esencias: 40, entregar: [{objeto: llave-umbral, cantidad: 5}], da: "dar:llave-ominosa", limite-semana: 1}
      - {id: llave, pagina: umbral, icono: TRIAL_KEY, nombre: "Llave del Caos", esencias: 40, da: "dar:llave", limite-semana: 1, requisito: "tope-llaves"}   # no cobra si el tope de 4 esta lleno
      - {id: salvoconducto, pagina: umbral, icono: PAPER, nombre: "Salvoconducto del Insomne", esencias: 64, da: "dar:salvoconducto", limite-semana: 1, requisito: "permiso:insomne.badge.unlocked"}
      - {id: ofrenda, pagina: umbral, icono: BLAZE_POWDER, nombre: "Ofrenda", esencias: 100, da: ofrenda}
      - {id: depositar, pagina: umbral, icono: GHAST_TEAR, nombre: "Depositar Esencias", da: depositar}
      - {id: camino, pagina: umbral, icono: COMPASS, nombre: "Tu camino", da: camino}
      - {id: talisman, pagina: forja, icono: CLOCK, nombre: "Talisman de Vigilia", esencias: 40, mobcoins: 2000, da: "dar:talisman", limite-semana: 1}
      - {id: gema, pagina: forja, icono: EMERALD, nombre: "Gema de Calamidad", esencias: 30, mobcoins: 1500, da: "dar:gema", limite-semana: 2}
      - {id: grabado, pagina: forja, icono: FLINT, nombre: "Grabado de Calamidad", esencias: 32, mobcoins: 2500, da: "dar:grabado", limite-semana: 1}
      - {id: ascua, pagina: forja, icono: BLAZE_POWDER, nombre: "Ascua de Calamidad", esencias: 24, esencias-incremento: 8, mobcoins: 2000, da: "dar:ascua"}
      - {id: yelmo-manto, pagina: forja, icono: NETHERITE_HELMET, esencias: 48, mobcoins: 3000, credito: "sello:custodio-de-las-ruinas", da: "forja:yelmo", reposicion: {esencias: 24, mobcoins: 3000}}
      - {id: coraza-manto, pagina: forja, icono: NETHERITE_CHESTPLATE, esencias: 48, mobcoins: 3000, credito: "sello:centinela-de-toba", da: "forja:coraza", reposicion: {esencias: 24, mobcoins: 3000}}
      - {id: grebas-manto, pagina: forja, icono: NETHERITE_LEGGINGS, esencias: 48, mobcoins: 3000, credito: "sello:matriarca-tejedora", da: "forja:grebas", reposicion: {esencias: 24, mobcoins: 3000}}
      - {id: soleretas-manto, pagina: forja, icono: NETHERITE_BOOTS, esencias: 48, mobcoins: 3000, credito: "sello:sanador-del-fango", da: "forja:soleretas", reposicion: {esencias: 24, mobcoins: 3000}}
      - {id: hacha-heraldo, pagina: forja, icono: NETHERITE_AXE, esencias: 64, mobcoins: 5000, credito: "sello:heraldo-carmes", da: "forja:hacha", reposicion: {esencias: 32, mobcoins: 5000}}
      - {id: mascara-eco, pagina: forja, icono: NETHERITE_HELMET, esencias: 40, mobcoins: 2500, credito: "marca", creditos: 5, da: "forja:mascara"}
      - {id: filo-eco, pagina: forja, icono: NETHERITE_SWORD, esencias: 48, mobcoins: 3000, credito: "marca", creditos: 10, da: "forja:filo"}
      - {id: guadana, pagina: forja, icono: NETHERITE_HOE, esencias: 64, mobcoins: 5000, credito: "fragmento", creditos: 7, da: "forja:guadana", espera-dias: 30}
      - {id: masamune, pagina: forja, icono: NETHERITE_SWORD, esencias: 64, mobcoins: 5000, entregar: [{objeto: fragmento-masamune, cantidad: 5}], da: "forja:masamune"}
      - {id: crimson-masamune, pagina: forja, icono: COPPER_SWORD, esencias: 96, mobcoins: 8000, entregar: [{objeto: masamune, cantidad: 1}, {objeto: fragmento-masamune, cantidad: 5}], da: "forja:crimson"}
  # [alineado] M32: que objeto MMOItems es cada pieza (TIPO.ID). Manto y Hacha: ids de Ederus/set-calamidad.yml;
  # Mascara y Filo: ESTUDIO 4.4 f. Tipos propios de Calamity (Dosa, 2026-09-27): armaduras en CALAMITY, armas en
  # CALAMITY_ARMAS, gemas en CALAMITY_GEMAS y consumibles en CALAMITY_CONSUMIBLES; nada en los tipos genericos.
  forja:
    reposicion-dias: 14
    piezas:
      yelmo: "CALAMITY.YELMO_DE_CALAMIDAD"
      coraza: "CALAMITY.CORAZA_DE_CALAMIDAD"
      grebas: "CALAMITY.GREBAS_DE_CALAMIDAD"
      soleretas: "CALAMITY.SOLERETAS_DE_CALAMIDAD"
      hacha: "CALAMITY_ARMAS.HACHA_DEL_HERALDO"
      mascara: "CALAMITY.MASCARA_DEL_ECO"
      filo: "CALAMITY_ARMAS.FILO_DEL_ECO"
      guadana: "CALAMITY_ARMAS.GUADANA_DE_LA_PARCA"
      masamune: "CALAMITY_ARMAS.MASAMUNE"               # 1.8.0: las katanas de Ambush
      crimson: "CALAMITY_ARMAS.CRIMSON_MASAMUNE"
  entregas:   # TINTURA_DE_CENIZA: PLAN 9 paso 2.2. GEMA/ASCUA: ids que crea el paquete MMOItems (WP10)
    mmo:
      tintura: "CALAMITY_CONSUMIBLES.TINTURA_DE_CENIZA"
      gema: "CALAMITY_GEMAS.GEMA_DE_CALAMIDAD"
      ascua: "CALAMITY_CONSUMIBLES.ASCUA_DE_CALAMIDAD"
      # 1.12.3 · Lote de gemas: la de cada minijefe (su botín) y el Ojo del Vigilante (el botín del
      # Vigilante usa este id exacto). Las plantillas, en docs/lote-gemas/01-calamity_gemas.yml.
      # Si falta una línea aquí, vale la misma de serie.
      gema-custodio: "CALAMITY_GEMAS.GEMA_DEL_CUSTODIO"
      gema-matriarca: "CALAMITY_GEMAS.GEMA_DE_LA_MATRIARCA"
      gema-sanador: "CALAMITY_GEMAS.GEMA_DEL_SANADOR"
      gema-centinela: "CALAMITY_GEMAS.GEMA_DEL_CENTINELA"
      gema-heraldo: "CALAMITY_GEMAS.GEMA_DEL_HERALDO"
      gema-vigilante: "CALAMITY_GEMAS.GEMA_OJO_DEL_VIGILANTE"
  # 1.12.3 · El Engarzador (Lior). Si falta la sección, valen estos mismos valores.
  engarzador:
    # Para que las piezas que ya tienen los jugadores reciban su hueco de gema, se sube el
    # revision-id de su plantilla y MMOItems las rehace (al entrar, al recogerlas o al tocarlas).
    # Ese rehacer pierde las marcas de otros plugins, entre ellas el ligado a su dueño. Con true,
    # Calamity se las devuelve en el momento (solo en los tipos de Calamity: piezas y gemas).
    conservar-marcas-al-actualizar: true
  llave-caos: {tope-semana: 4, sobrante-esencias: 10, comando: "crates key give %jugador% caos %n%"}
  caja: {libro-tope-mes: 2, libro-sustituto-esencias: 20, libro-comando: "ae giverandombook %jugador% LEGENDARY"}
  creditos: {horas-para-errantes: 48}
  ligado:
    activo: true
    comandos-mercado: [ah, auctionhouse, pa, playerauction, pauction, trade, sell, shop]
  horas: {solo-activas: true}
  monedero: {modo: real, saldo-placeholder: "", cobrar: ""}   # vacio = trueques con MC en gris (M35)
  salvoconducto: {activo: false, sustituto-esencias: 10}       # visto bueno de Dosa (0.3)
  talisman: {vida: 3, drenaje: 0.80}
  # Calamity 1.12.2 · El Barómetro: con clic derecho dice el clima del bioma donde estás y cuánto falta para
  # el próximo cambio ("Barómetro · Despejado. Lluvia ácida en 4 min."). Solo LEE el reloj de clima.ciclo y
  # la tabla clima.por-bioma: no cambia nada. No se gasta y se puede sacar de Calamity. Se compra en el
  # Altar (trueque barometro) o con /calamity give barometer <player>.
  barometro:
    # Segundos entre una consulta y la siguiente (los clics de en medio no hacen nada). 0 = sin espera.
    enfriamiento-segundos: 3
    # Donde sale la lectura: en el chat y/o como aviso en la barra de acción.
    chat: true
    barra: true
    # {ahora}: el clima de ahora; {proximo}: el que viene; {tiempo}: "4 min", "45 s".
    textos:
      despejado: "Despejado"
      lluvia: "Lluvia"
      tormenta: "Tormenta"
      lluvia-acida: "Lluvia ácida"
      cielo-rojo: "Cielo rojo"
      esporas: "Esporas"
      polinizacion: "Polinización"
      ceniza: "Ceniza"
      llega: "{ahora}. {proximo} en {tiempo}."
      escampa: "{ahora}. Escampa en {tiempo}."
      sin-clima: "{ahora}. En este bioma no cambia el tiempo."
      fuera: "Aquí no marca nada."
  grabado:
    por-semana: 1
    encantamientos: [SHARPNESS, PROTECTION, EFFICIENCY, POWER, UNBREAKING, LOOTING, FORTUNE]
    # Nivel final al que puede subir cada uno (PLAN 5.3); uno que no este aqui llega a su maximo vanilla + 1.
    topes: {SHARPNESS: 7, PROTECTION: 5, EFFICIENCY: 6, POWER: 6, UNBREAKING: 4, LOOTING: 4, FORTUNE: 4}

  # ------------------------------------------------------------------ LORES DE LOS OBJETOS
  # Rama lore-items: cada familia de objeto tiene su color. Calamity 1.12.2: tres pesos, sin negrita. El
  # nombre lleva el degradado del primero (claro) al segundo (fuerte, encendido): es lo unico con el color
  # pleno. El tono medio (entre el nombre y el texto) va en la categoria, los titulos, las cifras y lo
  # destacado; el texto es el fuerte aclarado hacia blanco y algo apagado, y las notas un paso mas apagadas.
  # Si falta una, vale la de serie.
  lores:
    tonos:
      contrato: "#FFE27A #FF8A2B"        # pergaminos de contrato de Oren
      grado-1: "#B8FFF4 #2FD3C8"         # Astilla del Umbral
      grado-2: "#BFD9FF #4A8DFF"         # Fragmento de Nana
      grado-3: "#E3C8FF #9B5CFF"         # Ambar Coagulado
      grado-4: "#FFE3A8 #FFAA2B"         # Ambar Mayor
      campana: "#FF9DB4 #FF3D6E"         # Campana de la Parca
      lagrima: "#D6F6FF #5CC8FF"         # Lagrima de Eco
      sello: "#FF7A7A #E63946"           # Sello de minijefe (el degradado de los minijefes)
      eclipsada: "#FFC2F0 #E03CC4"       # Reliquia Eclipsada
      esencia: "#E7C8FF #B266FF"
      frasco: "#CFFFE0 #3DDC84"
      cristal: "#DCDFFF #7C83FF"
      reclamo: "#FFD3C4 #FF6B47"
      talisman: "#F0FFC4 #A8DC3A"
      grabado: "#FFF0C2 #E0B23A"
      salvoconducto: "#FFD6E2 #F06A93"
      masamune: "#EEF3F8 #8FA6BA"        # Fragmento de Masamune
      kit: "#FFEBC7 #E6A955"             # lo prestado del Kit de Expedicion
      trofeo: "#E3EBFA #8EA6D6"          # cabeza de un Eco derrotado
      llave-umbral: "#E2F4FA #7FB8CC"    # el color de la Boveda de Ruinas
      llave-ominosa: "#EEDFFF #A97FDD"   # el color de la Boveda Caida
      barometro: "#D4E1F2 #4E7DB8"       # azul tormenta (1.12.2)

  # ------------------------------------------------------------------ M3. RELIQUIAS
  reliquias:
    activas: true
    caduca-dias: 14               # solo las que llevan UUID (III, IV y especiales)
    # [alineado] PLAN 3.1: lo que paga Oren por cada una. esencias 0.2 = 1 por cada 5 (floor del total).
    # Rama venta-oren: salir de Calamity ya no vende nada; las Reliquias se le venden a Oren, en su menu
    # (el NPC "mercader"), con estos valores, el tope del dia y la caducidad de siempre.
    grados:
      # Rama lore-items: materiales nuevos (los de antes, PRISMARINE_SHARD, DISC_FRAGMENT_5, RESIN_CLUMP y
      # ECHO_SHARD, se leen como estos). Lo que el material hace en vanilla (pociones, plantarse, crafteos,
      # herreria, tocadiscos, colocarse) esta cortado para cualquier Reliquia.
      1: {nombre: "Astilla del Umbral", material: GLISTERING_MELON_SLICE, esencias: 0.2, mobcoins: 5}
      2: {nombre: "Fragmento de Nana", material: MANGROVE_PROPAGULE, esencias: 1, mobcoins: 15}
      3: {nombre: "Ambar Coagulado", material: RESIN_BRICK, esencias: 3, mobcoins: 40}
      # 1.12.1: el Ambar Mayor es PAPER con el modelo de la plantilla del adorno Rayo (modelo: es el
      # componente minecraft:item_model; vale en cualquier grado o especial). La plantilla de la 1.12.0 se
      # lee como esto y las que circulan se renuevan solas.
      4: {nombre: "Ambar Mayor", material: PAPER, modelo: "minecraft:bolt_armor_trim_smithing_template", esencias: 6, mobcoins: 100}
    apilables: [1, 2]
    tope-dia: {1: 60, 2: 30}
    especiales:
      campana-parca: {nombre: "Campana de la Parca", material: BELL, fragmento-nivel-minimo: 40, llave-caos-iv: 0.25}
      lagrima-eco: {nombre: "Lagrima de Eco", material: OXIDIZED_COPPER_LANTERN, llave-caos-iv: 0.20}
      sello-minijefe: {nombre: "Sello de %minijefe%", material: FIRE_CHARGE}
      eclipsada: {nombre: "Reliquia Eclipsada", material: MUSIC_DISC_LAVA_CHICKEN}
    drop:
      comun: {1: 0.02}
      destacado: {1: 0.20, 2: 0.05}
      minijefe: {3: 1.0, 2: 0.30}
    sello-minijefe: {prob: 0.10, piedad: 8}                  # al mejor danador; piedad para los >= 10 %
    subir-grado:
      - {nivel: 50, de: 1, a: 2, prob: 0.20}
      - {nivel: 75, de: 2, a: 3, prob: 0.20}
      - {nivel: 75, de: 3, a: 4, prob: 0.05}

  # ------------------------------------------------------------------ M4-M6
  # M4 · Sellos. Dentro: portales, cofre ender, contenedores que no son del mundo y comandos.
  # Rama venta-oren · fuera: las Reliquias y las Esencias (lo que compra Oren) solo pueden ir en el
  # inventario del jugador: ni cofres, barriles, shulkers, bolsas, cofre ender (/ec), /pv, /ah, /trade,
  # mesas, aldeanos, tolvas, marcos, soportes ni menus de otros plugins. Bolsas y shulkers, tampoco
  # dentro. Se pueden tirar al suelo, pero solo las recoge quien las tiro; al morir fuera no se sueltan.
  # El staff con calamity.admin no esta sellado; calamity.bypass.storage solo se salta los de almacen.
  sellos:
    activo: true
    portales: true
    cofre-ender: true
    contenedores: true
    fuera: true                   # false: fuera de Calamity se pueden guardar donde sea (como antes)
    # El cofre ender y los vaults: no funcionan en Calamity (mundos de hardcore.mundos). Essentials:
    # enderchest y sus alias; AxVaults: axvaults y los alias de su config.yml (command-aliases).
    comandos-almacen: [ec, eec, echest, eechest, enderchest, eenderchest, endersee, eendersee, pv, pvs, vault, vaults,
                       playervault, playervaults, axvaults, axvault, axv, pvault, bovedas, boveda]
    # Fuera de Calamity: no se usan con una Reliquia o Esencia en la mano (/ah sell pone en venta lo de la mano)...
    comandos-mercado-mano: [ah, auction, auctionhouse, auctions, pa, playerauction, playerauctions, pauction,
                            subasta, subastas, trade, tradear, intercambio, sellhand]
    # ...y estos, que venden el inventario entero, no se usan si llevas alguna.
    comandos-mercado-inventario: [sell, sellall, vender]
    # Los avisos (en el chat). Vacio = el de serie.
    mensajes:
      no-se-guarda: "Las Reliquias y las Esencias no se pueden guardar ahí."
      no-se-guarda-fuera: "Fuera de Calamity, las Reliquias y las Esencias solo pueden ir en tu inventario. Véndeselas a Oren."
      bolsa: "Las Reliquias y las Esencias no se pueden meter en una bolsa."
      cofre-ender: "En Calamity no puedes usar el cofre de ender."
      comando-almacen: "En Calamity no puedes usar el cofre de ender ni los vaults."
      comando-mercado: "Las Reliquias y las Esencias no se venden ahí: véndeselas a Oren, en el spawn de Calamity."
      ajena: "Esa Reliquia no es tuya: solo la puede recoger quien la tiró."

  # Rama venta-oren · La venta a Oren (MenuTasador). Salir de Calamity ya no vende nada: el jugador se
  # lleva lo que lleva y Oren, en su menu, le compra las Reliquias (reliquias.grados) y le ingresa las
  # Esencias en el saldo. Solo compra en el spawn de Calamity o fuera de Calamity, nunca en plena
  # expedicion. Los avisos del chat (vacio = el de serie):
  venta:
    mensajes:
      salir-con-objetos: "Te llevas Reliquias o Esencias sin vender. Oren te las compra en el spawn de Calamity; fuera no se pueden guardar."
      solo-en-el-spawn: "Oren solo compra en el spawn de Calamity o fuera de Calamity."
      nada-que-vender: "No llevas nada que Oren te compre."
      # 1.12: Oren solo se lleva lo que paga; las I-II que pasan del tope de hoy se quedan contigo. {n} = cuantas.
      tope-se-quedan: "Hoy Oren ya no compra más Reliquias de grado I y II: te quedas {n}. Mañana te las compra."
  combate: {activo: true, etiqueta-segundos: 15, combat-log: true, contar-timeout: true, llegada-segundos: 20}
  # [alineado] PLAN 3.2: la clave "ruinas" pasa a llamarse "cofres" (la usa ESTUDIO Anexo A)
  cofres:
    activo: true
    solo-con-jugador: true
    pagados-dia: 10
    filtrar-vanilla: [NETHERITE_INGOT, NETHERITE_UPGRADE_SMITHING_TEMPLATE, ENCHANTED_GOLDEN_APPLE]
    anadir:
      - {objeto: esencia, prob: 0.40, min: 1, max: 2}
      - {objeto: reliquia-1, prob: 0.50, min: 1, max: 2}
      - {objeto: reliquia-2, prob: 0.20, min: 1, max: 1}
      - {objeto: reliquia-3, prob: 0.04, min: 1, max: 1}
      - {objeto: cristal, prob: 0.05, min: 1, max: 1}
      - {objeto: tintura, prob: 0.10, min: 1, max: 2}
      - {objeto: frasco-1, prob: 0.03, min: 1, max: 1}

  # ------------------------------------------------------------------ Calamity 1.11: ruinas, bóvedas y clanes
  # Cofres y Bóvedas de Ruinas en las ruinas de Lethal World (Ruinas.java). Se ponen al pasar: alrededor de
  # cada jugador fuera del spawn se miran los chunks cargados (nunca se carga ninguno) y, por cada ruina, se
  # decide UNA vez con la semilla y la posición de la ruina (da igual quién llegue primero). Lo puesto se
  # apunta en plugins/Calamity/ruinas-datos.yml. Nada en la zona spawn ni en excluir-regiones.
  ruinas:
    estructuras: ["lethal_world:ruinas_"]   # prefijos de los ids de estructura que cuentan como ruina
    semilla: 6660
    radio-chunks: 5                          # cuántos chunks alrededor del jugador se miran (sus vecinos a 2 tienen que estar cargados)
    chunks-por-segundo: 4                    # como mucho, por jugador
    excluir-regiones: [calamity_exterior]    # regiones de WorldGuard donde no se pone nada
    cofres:
      activo: true
      probabilidad: 0.35
      # Vacío, se vuelve a sellar (botín nuevo al abrirlo) pasados estos minutos, con alguien a reponer-radio.
      reponer-minutos: 90
      reponer-radio: 32
      # Cada tantos bloques del borde del spawn es un escalón (hasta extra.tope): cada escalón multiplica la
      # probabilidad de cada fila por (1 + extra.prob) y sube su máximo en extra.cantidad.
      distancia-cada: 500
      extra: {prob: 0.15, cantidad: 0.5, tope: 6}
      biomas: {}                             # factor por bioma sobre la probabilidad: {crimson_organism: 1.25}
      # Pasa por el tope de cofres.pagados-dia (el mismo contador) y por cofres.solo-con-jugador.
      # Esencias y Reliquias van a quien abre por la Aduana; lo demás, al cofre. "material:X" es vanilla.
      botin:
        - {objeto: esencia, prob: 0.45, min: 1, max: 2}
        - {objeto: reliquia-1, prob: 0.55, min: 1, max: 3}
        - {objeto: reliquia-2, prob: 0.25, min: 1, max: 1}
        - {objeto: reliquia-3, prob: 0.05, min: 1, max: 1}
        - {objeto: tintura, prob: 0.15, min: 1, max: 2}
        - {objeto: cristal, prob: 0.04, min: 1, max: 1}
        - {objeto: frasco-1, prob: 0.04, min: 1, max: 1}
        - {objeto: llave-umbral, prob: 0.05, min: 1, max: 1}
        - {objeto: "material:BREAD", prob: 0.40, min: 1, max: 3}
        - {objeto: "material:ARROW", prob: 0.30, min: 4, max: 10}
    # La Bóveda de Ruinas: la caja calamity_ruinas de EDM (se crea sola), común, una apertura por jugador,
    # con la Llave del Umbral.
    bovedas:
      activo: true
      probabilidad: 0.12
      distancia-cada: 500
      extra: {prob: 0.10, cantidad: 0.5, tope: 6}
      biomas: {}
      botin:
        - {objeto: esencia, prob: 1.0, min: 2, max: 4}
        - {objeto: reliquia-2, prob: 0.60, min: 1, max: 2}
        - {objeto: reliquia-3, prob: 0.20, min: 1, max: 1}
        - {objeto: reliquia-4, prob: 0.03, min: 1, max: 1}
        - {objeto: tintura, prob: 0.30, min: 1, max: 2}
        - {objeto: cristal, prob: 0.15, min: 1, max: 1}
        - {objeto: frasco-1, prob: 0.15, min: 1, max: 1}
        - {objeto: llave-ominosa, prob: 0.02, min: 1, max: 1}

  # La Bóveda Caída (BovedaCaida.java): cada cada-minutos (+-variacion) con minimo-jugadores fuera del spawn,
  # cae una bóveda ominosa (caja calamity_caida de EDM, Llave Ominosa) entre distancia-min y distancia-max del
  # centro del spawn. Solo la abre el primero; abierta, o a los vida-minutos, desaparece. Se anuncia el bioma,
  # la distancia redondeada a 100 y el rumbo (nunca las coordenadas) y se ve un haz durante haz-minutos.
  # /calamity vault drop [random] la fuerza (cerca de ti, o en el anillo), vault info y vault clear.
  boveda-caida:
    activo: true
    cada-minutos: 150
    variacion: 0.20
    minimo-jugadores: 3
    distancia-min: 600
    distancia-max: 1500
    intentos: 8
    haz-minutos: 5
    vida-minutos: 30
    excluir-regiones: [calamity_exterior]
    # Al llegar el primero a radio bloques: mobs del bioma alrededor y, con esa probabilidad, el minijefe del bioma.
    guardia: {activo: true, radio: 40, mobs: 6, distancia: 10, minijefe: 0.25}
    nombres-biomas: {}                       # cómo se dice cada bioma en el aviso: {bamboo_valley: "el valle de bambú"}
    botin:
      - {objeto: esencia, prob: 1.0, min: 8, max: 14}
      - {objeto: reliquia-3, prob: 0.80, min: 1, max: 2}
      - {objeto: reliquia-4, prob: 0.25, min: 1, max: 1}
      - {objeto: cristal, prob: 0.50, min: 1, max: 1}
      - {objeto: frasco-1, prob: 0.50, min: 1, max: 2}
      - {objeto: tintura, prob: 0.60, min: 2, max: 3}
      - {objeto: llave-umbral, prob: 0.50, min: 1, max: 2}

  # Las llaves de las bóvedas que sueltan los mobs (las de los minijefes van en minijefes.botin, las del
  # Altar en altar.trueques, la del contrato semanal en contratos.semana-premio y la del ranking en
  # ranking.premios). Destacado: al suelo con lo demás. Parca: a cada uno que cobra, por Entregas.
  llaves-boveda:
    activo: true
    destacado: {llave-umbral: 0.03}
    parca: {llave-ominosa: 0.25}

  # El ranking semanal de clanes (ClanesCalamity.java). El clan sale de PlaceholderAPI (UltimateClans) sin
  # colores; el líder, de placeholder-lider sobre un miembro conectado (si no se puede leer, el miembro que
  # más puntos dio). Cierra el lunes 00:00 en hardcore.zona: el clan con más puntos (empate: el que llegó
  # antes) recibe trofeo.comando; si repite y su trofeo sigue existiendo, se renueva (EDM 1.78.1).
  # /calamity clans (top), clans close (cierra ya), clans holo here|off (el holograma, uno solo).
  clanes:
    activo: true
    placeholder: "%uclans_tag_color%"
    placeholder-lider: "%uclans_leader%"
    sin-clan: ["", "Sin clan", "N/A", "-"]
    tope-dia-miembro: 300                    # puntos por miembro y día (0 = sin tope)
    minimo-puntos: 1
    # esencia y reliquia: por cada Esencia que ingresa con Oren y por cada Esencia que valen las Reliquias que le vende.
    # minijefe: por la parte del daño (30 x 0,5 = 15). parca: por cada uno que cobra. boveda-caida: quien la abre.
    pesos: {esencia: 1, reliquia: 1, minijefe: 30, parca: 40, boveda-caida: 60}
    trofeo: {tipo: trofeo, dias: 7, renovar: true, comando: "superbeacon give %lider% %tipo% %dias% %tag%"}
    menu: true                               # la categoría Clanes en el menú de Rhen
    holograma: {activo: false, top: 5}

  # ------------------------------------------------------------------ M7-M10, M20-M21
  parte-defuncion: {activo: true, golpes: 8, segundos: 15}
  testigos: {activo: true, radio: 24, cordura: 5, cordura-eco: 5, cada-segundos: 60, campana: true}
  sentidos: {latido: true, latido-parca-radio: 32, vinheta: false, vinheta-intensidad: [0.85, 0.6, 0.35, 0, 0], radio-borde: 10000, recentrar-segundos: 30}
  telemetria: {activa: true, dias-a-conservar: 180}
  censo:
    escalones: {TRASH: 1, COMMON: 2, UNCOMMON: 3, RARE: 4, VERY_RARE: 5, MAGICAL: 6, EPIC: 6, LEGENDARY: 7,
                MYTHICAL: 8, UNIQUE: 9, ASCUA: 10, CELESTIAL: 11, UMBRAL: 12, VIGILIA: 13,   # [alineado] MED 5
                PRIVILEGIO: 14, BRASA: 14, ECO: 15, CALAMIDAD: 16, PARCA: 17,
                BUNNY: 18, CAZADOR: 18, CORO_ABISAL: 18, ARAGON: 18, BRUJA: 18, DARKNESS: 18, HERBOLA: 18,
                KEEPER: 18, CONEJO_ASESINO: 18, MIMIC: 18, QUIMERA: 18, LEVIATAN: 18, CABRA_GRITONA: 18,
                CABALLERO_SEPULCRAL: 18, STORM_RIDER: 18, PRIVILEGIO_FILO: 18, AUREOLA_DEL_ALBA: 19,
                CORTEZA_DE_ROTTEN: 19, FUNDICION_DE_KEM_Y_KAM: 19, HACHA_DE_ROTTEN: 21, SANGRE: 23, FIRMAMENTO: 40}
    vanilla: {LEATHER: 0, GOLDEN: 1, CHAINMAIL: 1, IRON: 2, DIAMOND: 4, NETHERITE: 6}   # por prefijo de material
  # tipos.susurro: false apaga solo el susurro ("☠ Oyes la voz de <muerto>, que murió en Calamity hace 2 h: «vuelve…»").
  alucinaciones: {activo: false, por-minuto: [3.0, 2.0, 1.0, 0.5, 0], coste-pegar: 2, tipos: {pasos: true, puerta: true, figura: true, siseo: true, golpe: true, susurro: true, carrera: true}}

  # Locura: los sustos que oye quien tiene la cordura baja (Locura.java). Todo es solo para él y suena
  # a su alrededor; nada en la zona spawn, nada a quien está exento de la Parca y nada con la Parca o
  # un Vigilante encima o en combate (salvo el latido). Ni efectos ni partículas: sonido y chat. Si falta esta
  # sección (el config del servidor no se reemplaza), valen estos mismos valores, que están en el código.
  # Probar sin bajar la cordura: /calamity madness <player> <steps|breath|scream|heartbeat|wail|whisper|all>.
  # Sonidos: sonido, volumen y tono (de 0.5 a 2; por debajo de 0.5 Java no baja más). Sin campanas: la
  # campana siempre es real (la Parca y las muertes), así que en lugar de campana suena el lamento.
  locura:
    activo: true
    # Por debajo de este porcentaje de cordura: pasos pesados que se acercan por detrás y respiración en la nuca.
    umbral-pasos: 40
    # Por debajo de este, además: gritos, el latido que se acelera, el lamento a lo lejos y su nombre en el chat.
    umbral-gritos: 20
    # Por debajo de este (cerca de 0): todo más seguido. Las esperas y la pausa se dividen por mas-seguido.
    umbral-limite: 5
    mas-seguido: 2.5
    # Para que asuste y no canse (el latido no cuenta): segundos mínimos entre dos sustos y sustos por
    # minuto como mucho; cerca de 0, tope-por-minuto-limite.
    pausa-minima: 12
    tope-por-minuto: 2
    tope-por-minuto-limite: 5
    # cada: [de, a] segundos al azar hasta que puede volver ese susto (el equipo con cordura-alucinaciones
    # los alarga). La primera vez que se entra en su umbral llega antes: entre un cuarto y tres cuartos.
    pasos:
      activo: true
      cada: [80, 160]
      cantidad: [6, 9]          # pasos de cada racha
      distancia: [12, 1.5]      # bloques detrás: de dónde empiezan a dónde llegan
      ticks: [13, 7]            # entre paso y paso, al empezar y al llegar (se apuran)
      mirar-grados: 60          # si se gira a menos de esto de donde vienen, paran en seco
      final-grito: 0.4          # bajo umbral-gritos, probabilidad de que acaben en un grito al oído (si no, respiración)
      # Suenan juntos en cada paso, del 35 % de este volumen en el primero al 100 % en el último.
      sonidos:
        - {sonido: "minecraft:entity.warden.step", volumen: 1.0, tono: 0.6}
        - {sonido: "minecraft:block.deepslate.step", volumen: 0.8, tono: 0.5}
    respiracion:
      activo: true
      cada: [70, 150]
      veces: [2, 3]             # respiraciones seguidas, con los sonidos por turno
      sonidos:
        - {sonido: "minecraft:entity.horse.breathe", volumen: 0.8, tono: 0.5}
        - {sonido: "minecraft:entity.warden.sniff", volumen: 0.5, tono: 0.6}
    gritos:
      activo: true
      cada: [70, 160]
      pegado: 0.35              # probabilidad de que suene pegado al oído; si no, lejos
      lejos: [18, 30]           # bloques
      volumen-lejos: 3.0        # el volumen de lejos se multiplica por esto para que llegue
      sonidos:
        - {sonido: "minecraft:entity.fox.screech", volumen: 1.0, tono: 0.6}
        - {sonido: "minecraft:entity.enderman.scream", volumen: 1.0, tono: 0.55}
        - {sonido: "minecraft:entity.goat.screaming.ambient", volumen: 1.0, tono: 0.6}
        - {sonido: "minecraft:entity.goat.screaming.hurt", volumen: 1.0, tono: 0.55}
        - {sonido: "minecraft:entity.ghast.scream", volumen: 0.9, tono: 0.5}
    # El latido de sentidos.latido: por debajo de umbral-gritos lo lleva Locura y se acelera.
    latido:
      activo: true
      ticks: [36, 12]           # entre latido y latido: en umbral-gritos y en 0 (20 ticks = 1 s)
      volumen: [0.75, 1.0]
      tono: [1.0, 1.2]
    lamento:
      activo: true
      cada: [150, 300]
      lejos: [28, 40]           # bloques
      sonidos:
        - {sonido: "minecraft:ambient.cave", volumen: 3.5, tono: 0.7}
        - {sonido: "minecraft:entity.ghast.ambient", volumen: 3.5, tono: 0.5}
        - {sonido: "minecraft:entity.elder_guardian.ambient", volumen: 3.5, tono: 0.5}
    # Su nombre como un susurro en su chat (gris oscuro, en cursiva). {nombre} es su nombre.
    nombre:
      activo: true
      cada: [240, 480]
      frases:
        - "…{nombre}…"
        - "{nombre}, detrás de ti."
        - "No mires atrás, {nombre}."
        - "{nombre}… ¿por qué corres?"
        - "Te estoy viendo, {nombre}."
        - "Quédate, {nombre}."

