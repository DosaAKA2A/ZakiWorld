  racha: {activa: false, maximo: 5, maximo-con-equipo: 7, equipo-piezas: 3, equipo-escalon: 12, por-punto: 0.10, niveles-por-punto: 2}   # [alineado]
  frenesi: {activo: false, umbral: 25, dano-hecho: 0.15, dano-recibido: 0.15}
  sangre-fresca: {activo: false, pvp: 20, eco: 10, minijefe: 15, parca: 40, ambush: 25, minutos-misma-victima: 30, piezas-minimas: 2, minutos-dentro-victima: 5}
  eclipse: {activo: false, horario: ["18:00", "22:00"], minutos: 20, avisos-minutos: [10, 5, 1], cordura: 2.0, niveles: 10, botin: 2.0, pvp: 1.25, minijefe-cada-minutos: 5, ecos-despertar: 2.0, vinheta-extra: 0.2, minutos-minimos: 10, ventana-despues: 10}

  # ------------------------------------------------------------------ M24 · Hogueras de calma (1.12.3)
  # Clic derecho (en Bedrock, tocar) con una Esencia en la mano principal sobre una fogata de almas
  # (SOUL_CAMPFIRE) encendida la consagra. Si no se puede, no se gasta la Esencia y se dice por que en la
  # barra de accion. Mientras arde: a radio-calma la cordura no baja y se regenera vida despacio, y a
  # radio-apariciones no nace ningun mob (lo que traen la PARCA o un Eco si). Al acabar la fogata se apaga
  # de verdad y su zona queda quemada. Nunca es un santuario: la Huella cuenta x factor-huella a
  # radio-calma, y a quien ya persigue la PARCA la hoguera no le ampara.
  # Staff: /calamity campfire info | clear | reset <player>. Sin esta seccion valen estos mismos valores.
  hogueras:
    activa: true
    # Esencias que cuesta consagrar una (en creativo no se gastan).
    coste-esencias: 1
    # Bloques minimos hasta otra hoguera activa o quemada, y hasta las puertas (entrada, salida y llegada).
    distancia-otra: 48
    distancia-puertas: 48
    # Cada jugador puede consagrar una cada tantos minutos.
    pausa-minutos: 20
    # Lo que arde (minutos; admite decimales) y lo que su zona queda quemada despues.
    duracion-minutos: 4
    quemada-minutos: 30
    # A esta distancia la cordura no baja y hay regeneracion; a la otra no nace nada.
    radio-calma: 6
    radio-apariciones: 16
    # Lo que multiplica la quietud de la Huella a radio-calma (1 = nada).
    factor-huella: 1.5
    # Regeneracion a radio-calma (nivel 1 = Regeneracion I). No se suma a otra regeneracion que ya lleves.
    regeneracion: true
    regeneracion-nivel: 1
    # Las llamas de alma, el anillo del radio y la ceniza de la zona quemada; y el cartel con la cuenta atras.
    particulas: true
    cartel: true

  # ------------------------------------------------------------------ La corrupción
  # En Calamity nada de lo que construye un jugador dura: sin granjas AFK ni bases que aguanten. Todo bloque que
  # pone un jugador fuera de la zona spawn (también el agua, la lava o la nieve polvo de un cubo) se anota, y en
  # el barrido que llega cuando ya lleva edad-minutos puesto se corrompe según su forma y el color del bioma:
  #   bloque entero -> uno de los enteros de la paleta, al azar;
  #   losa / escalera / muro -> la losa / escalera / muro de la paleta, con la misma forma (arriba o abajo,
  #   orientación, con agua...). Un muro sin muro en la paleta pasa a bloque entero;
  #   lo funcional y lo que no es sólido -> se pudre: desaparece sin soltar nada (su inventario se vacía antes).
  # Lo corrompido no se vuelve a anotar y al romperlo no suelta nada. Lo exento no se toca nunca. Lo que pone
  # alguien en creativo (sin contar-creativo) o el propio plugin no se anota. Si un bloque anotado se rompe o
  # lo cambia otra cosa antes del barrido, se olvida; lo que el jugador le hace (descortezar, arar, encerar)
  # no lo salva. Lo de un chunk descargado espera a que se cargue: nunca se fuerza una carga.
  # Staff: /calamity corruption info | now | clear <radius>. Sin esta sección valen estos mismos valores.
  corrupcion:
    activa: true
    # Cada cuánto se hace un barrido, y lo que tiene que llevar puesto un bloque para corromperse (minutos;
    # admiten decimales). Lo anotado sobrevive a los reinicios y el tiempo apagado también cuenta.
    cada-minutos: 5
    edad-minutos: 5
    # Bloques como mucho por tick en un barrido (el resto, en los ticks siguientes).
    por-tick: 50
    # Unas pocas partículas del bloque nuevo y un crujido grave (una vez por chunk y barrido) que solo se oye
    # a radio-sonido bloques. sonido vacío = sin sonido.
    particulas: true
    sonido: "block.sculk.spread"
    radio-sonido: 12
    # La primera vez que alguien pone un bloque en cada entrada a Calamity se le dice en el chat.
    aviso: true
    texto-aviso: "En Calamity nada de lo que construyes dura. La corrupción lo reclama."
    # Bloques: su nombre de Minecraft, "#etiqueta" (una etiqueta de bloques de Minecraft) o "*final" (todo
    # bloque cuyo nombre acaba así). Lo que no existe en el servidor se avisa en la consola y se ignora.
    # Lo exento no se toca nunca: las antorchas y las fogatas (las hogueras de calma son fogatas de almas).
    exentos: [torch, wall_torch, soul_torch, soul_wall_torch, copper_torch, copper_wall_torch, "#campfires"]
    # Lo que se pudre en vez de corromperse.
    funcionales:
      # Contenedores
      - hopper
      - chest
      - trapped_chest
      - "#copper_chests"
      - barrel
      - "#shulker_boxes"
      - ender_chest
      - furnace
      - blast_furnace
      - smoker
      - dispenser
      - dropper
      - crafter
      # Redstone
      - piston
      - sticky_piston
      - observer
      - redstone_wire
      - redstone_torch
      - redstone_wall_torch
      - repeater
      - comparator
      - redstone_block
      - redstone_lamp
      - "*copper_bulb"
      - daylight_detector
      - target
      - note_block
      - jukebox
      - tnt
      - "#lightning_rods"
      - sculk_sensor
      - calibrated_sculk_sensor
      - sculk_shrieker
      - sculk_catalyst
      - "#rails"
      - lever
      - "#buttons"
      - "#pressure_plates"
      - tripwire_hook
      - tripwire
      # Puertas, trampillas, vallas, camas y lo que se trepa (escaleras de mano, andamios, enredaderas)
      - "#trapdoors"
      - "#doors"
      - "#fences"
      - "#fence_gates"
      - "#beds"
      - "#climbable"
      # Mesas de crafteo y de trabajo
      - crafting_table
      - cartography_table
      - fletching_table
      - smithing_table
      - loom
      - stonecutter
      - grindstone
      - brewing_stand
      - lectern
      - composter
      - "#cauldrons"
      - enchanting_table
      - "#anvil"
      - bell
      - beacon
      - conduit
      - respawn_anchor
      - lodestone
      - "#beehives"
      - "#wooden_shelves"
      - chiseled_bookshelf
      - decorated_pot
      # Camas elásticas, carteles y alfombras
      - slime_block
      - honey_block
      - "#all_signs"
      - "#banners"
      - "#wool_carpets"
      - moss_carpet
      - pale_moss_carpet
      # Flores y cultivos
      - "#flowers"
      - "#crops"
      - attached_pumpkin_stem
      - attached_melon_stem
      - "#saplings"
      - sugar_cane
      - cactus
      - bamboo
      - bamboo_sapling
      - sweet_berry_bush
      - nether_wart
      - cocoa
      - kelp
      - kelp_plant
      - "#cave_vines"
      - "#candles"
      - "#candle_cakes"
      - cake
      - powder_snow
      # Generadores de mobs (si alguien llegara a ponerlos)
      - spawner
      - trial_spawner
      - vault
    # El color de cada bioma, como "panacea/<id>" (el "bracken:" de delante es opcional). "*" = cualquier
    # otro bioma. Gana el más concreto. Para quitar un color, déjalo con [].
    biomas:
      rojo: ["panacea/crimson_organism"]
      verde: ["panacea/creeper_dominion", "panacea/horsetail_tropics", "panacea/polypore_plains", "panacea/wildflower_bog", "panacea/hungering_jungle", "panacea/conure_conclave", "panacea/ravenous_greenwood"]
      amarillo: ["panacea/bamboo_valley", "panacea/honeybee_biome", "panacea/sweltering_swamp", "panacea/quicksand_springs"]
      negro: ["panacea/condemned_taiga", "*"]
    # Los bloques de cada color. "a|b" = a, y si a no existe en este servidor, b (el cinabrio llega con
    # Minecraft 26.2; en 26.1.2 se usa lo más parecido). Solo valen bloques sin luz y que no sean funcionales;
    # cada lista tiene que ser de su forma (las losas, losas...). Un muro: [] = sin muro (pasa a bloque entero).
    paletas:
      rojo:
        enteros: [netherrack, "cinnabar|red_terracotta", nether_wart_block]
        losa: ["cinnabar_slab|red_nether_brick_slab", "polished_cinnabar_slab|red_nether_brick_slab"]
        escalera: ["cinnabar_stairs|red_nether_brick_stairs", "polished_cinnabar_stairs|red_nether_brick_stairs"]
        muro: ["cinnabar_wall|red_nether_brick_wall", "polished_cinnabar_wall|red_nether_brick_wall"]
      verde:
        enteros: [moss_block, green_wool, mossy_cobblestone, warped_planks, azalea_leaves]
        losa: [warped_slab]
        escalera: [warped_stairs, mossy_cobblestone_stairs]
        muro: [mossy_cobblestone_wall]
      amarillo:
        enteros: [yellow_terracotta, stripped_bamboo_block, honeycomb_block]
        losa: [bamboo_mosaic_slab]
        escalera: [bamboo_mosaic_stairs]
        muro: []
      negro:
        enteros: [deepslate, cobbled_deepslate, tuff, polished_tuff]
        losa: [tuff_slab]
        escalera: [tuff_stairs]
        muro: [tuff_wall, cobbled_deepslate_wall]

  # ------------------------------------------------------------------ Clima (1.9.0)
  # El tiempo de Calamity segun el bioma. Solo actua mientras llueve de verdad en el mundo
  # y nunca en la zona spawn. Todo pasa en la pantalla de cada jugador: el mundo no se toca.
  # Los biomas se escriben como "panacea/<id>" (el "bracken:" de delante es opcional).
  clima:
    activo: true
    # Calamity 1.11 · Cuando llueve lo decide Calamity, no el ciclo al azar de Minecraft: en sus mundos
    # se apaga la regla del ciclo de clima y se alterna despejado y lluvia con estas duraciones (en
    # tiempo real; un reinicio no lo reinicia). /calamity weather [rain|storm|clear] [minutes] lo fuerza
    # y, sin nada, dice como va. Placeholders: %lethalworld_clima% (despejado|lluvia|tormenta),
    # %lethalworld_clima_restante% ("12 min", "45 s") y %lethalworld_clima_proximo% (la fase que viene).
    ciclo:
      # false: vuelve el ciclo de clima de Minecraft (se reactiva la regla).
      activo: true
      despejado-minutos: 20
      lluvia-minutos: 5
      # Cada fase dura eso +- este tanto (0.2 = +-20 %).
      variacion: 0.2
      # Una de cada tantas lluvias es tormenta electrica (0 = nunca).
      tormenta-cada: 4
      # Segundos antes de cada lluvia en los que se avisa a quien este dentro ("Se acerca la lluvia",
      # "Se acerca una tormenta" o, segun el bioma, "Se acerca lluvia ácida"). 0 = sin aviso.
      aviso-segundos: 60
    # Calamity 1.12 · En los mundos de Calamity la lluvia de Minecraft no existe: el mundo se queda siempre
    # despejado (se cancela cualquier cambio a lluvia: el ciclo vanilla, /weather, otros plugins) y la lluvia
    # o tormenta del ciclo de arriba es solo un estado de Calamity. Lo que se ve lo pinta el plugin segun el
    # bioma: particulas y sonidos solo para cada jugador, a su alrededor. Con ciclo.activo en false vuelve
    # el clima de Minecraft, con su lluvia.
    #
    # El clima de cada bioma mientras dura la lluvia o la tormenta del ciclo. Tipos: lluvia-acida, esporas,
    # polinizacion, ceniza, cielo-rojo, generico (el temporal: lluvia oscura, viento y truenos, sin dano) y
    # ninguno. El bioma va con o sin namespace; "panacea/*" vale para todos los de Panacea y "*" para
    # cualquier otro (los de Minecraft y las zonas de /lbiomes, que tienen su propio clima). Gana el mas
    # concreto. Si la quitas, vale esta.
    por-bioma:
      panacea/sweltering_swamp: lluvia-acida
      panacea/wildflower_bog: lluvia-acida
      panacea/creeper_dominion: lluvia-acida
      panacea/horsetail_tropics: lluvia-acida
      panacea/hungering_jungle: lluvia-acida
      panacea/polypore_plains: esporas
      panacea/ravenous_greenwood: esporas
      panacea/honeybee_biome: polinizacion
      panacea/condemned_taiga: ceniza
      panacea/crimson_organism: cielo-rojo
      "panacea/*": generico
      "*": ninguno
    # Al empezar a ver un clima, una linea corta en el centro ("Comienza la lluvia ácida"; en Bedrock va en
    # la barra), no mas de una vez cada tantos segundos por clima.
    aviso-inicio: true
    aviso-inicio-espera: 90
    efectos:
      # Cada cuantos ticks se pintan las particulas (las 'cantidad' de abajo son por pulso). Pide reinicio.
      cada-ticks: 4
      # Multiplica todas las cantidades (0.5 = la mitad; 0 = sin particulas).
      densidad: 1.0
      # Mas de tantos bloques por debajo de la superficie no se ve ni se oye nada (cuevas).
      profundidad: 12
      # Bajo techo los sonidos suenan a este tanto.
      volumen-a-cubierto: 0.5
      # Tope de particulas por pulso y jugador, sumando sus capas (con la tormenta incluida). Si un clima
      # pide mas, todas sus capas se rebajan en proporcion. 0 = sin tope.
      tope-por-pulso: 60
    # La tormenta del ciclo: el mismo clima de cada bioma, mas denso y con truenos a lo lejos.
    tormenta:
      densidad: 1.5
      sonidos:
        - {sonido: "minecraft:entity.lightning_bolt.thunder", cada: 17, volumen: 0.45, tono: 0.8, distancia: 10}
      # Rayos en el horizonte, solo a cielo abierto y solo para el: uno cada 'cada' segundos (+-40 %), a
      # 'distancia' bloques y bajando desde 'altura' sobre el, con su trueno. Valen para cualquier clima en
      # la tormenta (si el clima no trae los suyos). cada 0 = sin rayos.
      rayos: {cada: 13, color: "#E6E1F5", tam: 1.6, distancia: 20, altura: 18, sonido: "minecraft:entity.lightning_bolt.thunder", volumen: 0.6, tono: 1.0}
    #
    # Cada clima: nombre y aviso (la linea de la barra al exponerse: "Nombre: aviso"; vacio = sin linea),
    # inicio (lo de aviso-inicio), hojas-protegen (si las hojas cuentan como techo), particulas y sonidos.
    # particulas, por pulso: particula (nombre de Paper), cantidad, radio (horizontal), altura (sobre los
    # pies), espesor (vertical), color "#RRGGBB" y tam (DUST), bloque (FALLING_DUST) y techo (true: tambien
    # bajo techo; son las que caen y chocan con el tejado. Sin techo, solo a cielo abierto). viento: true =
    # cada particula sale empujada en la direccion del viento a 'velocidad' (una por paquete: pocas).
    # racha-cada / racha-dura: la capa solo sale 'dura' segundos de cada 'cada' (las rachas de viento).
    # sonidos: sonido, cada (segundos), volumen, tono y distancia (bloques).
    #
    # Lluvia acida: a cielo abierto quema y bajo techo no pasa nada. Primero sale un aviso en la barra y
    # hay un margen antes del primer golpe.
    lluvia-acida:
      activa: true
      nombre: "Lluvia ácida"
      inicio: "Comienza la lluvia ácida"
      aviso: "busca un techo, que quema."
      hojas-protegen: true
      # Vida que quita cada golpe (1 = medio corazon). Recuerda que en Calamity no hay
      # regeneracion natural.
      dano: 1.0
      # Cada cuantos segundos quema mientras sigue bajo la lluvia.
      cada-segundos: 2
      # Segundos entre el aviso y el primer golpe.
      margen-segundos: 2
      # Si pasa este tiempo seguido a cubierto, al volver a la lluvia hay aviso y margen otra
      # vez. Con menos, la cuenta sigue donde estaba (esconderse un segundo no la reinicia).
      olvido-segundos: 15
      particulas:
        - {particula: FALLING_DUST, bloque: LIME_CONCRETE_POWDER, cantidad: 14, radio: 8, altura: 7, espesor: 2, techo: true}
        - {particula: DUST, color: "#8FD14F", tam: 0.9, cantidad: 6, radio: 6, altura: 2, espesor: 1.5}
        - {particula: ITEM_SLIME, cantidad: 3, radio: 5, altura: 0.2, espesor: 0.1}
      sonidos:
        - {sonido: "minecraft:block.pointed_dripstone.drip_water", cada: 1, volumen: 0.6, tono: 1.1, distancia: 5}
        - {sonido: "minecraft:block.fire.extinguish", cada: 5, volumen: 0.12, tono: 1.8, distancia: 4}
    # Esporas: a cielo abierto (bajo la copa de los arboles tambien) quitan cordura poco a poco.
    esporas:
      activa: true
      nombre: "Esporas"
      inicio: "Se levantan las esporas"
      aviso: "te nublan la mente; busca un techo."
      hojas-protegen: false
      cordura-por-segundo: 0.1
      efecto: {tipo: "", nivel: 1}
      olvido-segundos: 15
      particulas:
        - {particula: SPORE_BLOSSOM_AIR, cantidad: 3, radio: 10, altura: 3, espesor: 3}
        - {particula: MYCELIUM, cantidad: 6, radio: 7, altura: 1, espesor: 1.5}
        - {particula: DUST, color: "#9DB58A", tam: 1.3, cantidad: 4, radio: 8, altura: 2.5, espesor: 2}
      sonidos:
        - {sonido: "minecraft:ambient.warped_forest.additions", cada: 6, volumen: 0.5, tono: 1.0, distancia: 6}
        - {sonido: "minecraft:entity.puffer_fish.blow_out", cada: 4, volumen: 0.25, tono: 0.6, distancia: 5}
    # Polinizacion: polen amarillo en el aire; a cielo abierto ralentiza (efecto, renovado cada segundo).
    polinizacion:
      activa: true
      nombre: "Polinización"
      inicio: "Llega la polinización"
      aviso: "te pesa en el paso; busca un techo."
      hojas-protegen: false
      cordura-por-segundo: 0
      # Nivel 1 = Lentitud I. tipo vacio = sin efecto.
      efecto: {tipo: slowness, nivel: 1}
      olvido-segundos: 15
      particulas:
        - {particula: DUST, color: "#F2D36B", tam: 1.0, cantidad: 8, radio: 9, altura: 2.5, espesor: 2.5}
        - {particula: FALLING_NECTAR, cantidad: 4, radio: 8, altura: 6, espesor: 2, techo: true}
        - {particula: WAX_ON, cantidad: 2, radio: 6, altura: 2, espesor: 2}
      sonidos:
        - {sonido: "minecraft:entity.bee.loop", cada: 3, volumen: 0.35, tono: 1.0, distancia: 5}
        - {sonido: "minecraft:block.beehive.work", cada: 7, volumen: 0.4, tono: 1.0, distancia: 6}
    # Ceniza: de serie solo se ve y se oye. Para un sofoco leve, pon un efecto (p. ej. {tipo: weakness,
    # nivel: 1}) o cordura-por-segundo.
    ceniza:
      activa: true
      nombre: "Ceniza"
      inicio: "Empieza a caer ceniza"
      aviso: ""
      hojas-protegen: true
      cordura-por-segundo: 0
      efecto: {tipo: "", nivel: 1}
      olvido-segundos: 15
      particulas:
        - {particula: WHITE_ASH, cantidad: 18, radio: 10, altura: 4, espesor: 4}
        - {particula: ASH, cantidad: 8, radio: 9, altura: 3, espesor: 3}
        - {particula: FALLING_DUST, bloque: LIGHT_GRAY_CONCRETE_POWDER, cantidad: 6, radio: 8, altura: 7, espesor: 2, techo: true}
        - {particula: DUST, color: "#BDB5A8", tam: 1.1, cantidad: 3, radio: 8, altura: 2, espesor: 2}
      sonidos:
        - {sonido: "minecraft:ambient.basalt_deltas.additions", cada: 6, volumen: 0.5, tono: 1.0, distancia: 6}
        - {sonido: "minecraft:block.fire.ambient", cada: 4, volumen: 0.3, tono: 0.8, distancia: 4}
    # Temporal: el clima de los biomas de Panacea sin clima propio. Solo se ve y se oye: lluvia oscura,
    # rachas de viento y truenos lejanos; en la tormenta, ademas, rayos (tormenta.rayos). Sin dano. Con
    # activo en false, esos biomas se quedan sin nada (y sin aviso).
    generico:
      activo: true
      nombre: "Temporal"
      inicio: "Empieza a llover"
      # El anuncio si se lo encuentra ya en la fase de tormenta.
      inicio-tormenta: "Estalla la tormenta"
      aviso: ""
      hojas-protegen: true
      particulas:
        - {particula: FALLING_DUST, bloque: GRAY_CONCRETE_POWDER, cantidad: 16, radio: 8, altura: 7, espesor: 2, techo: true}
        - {particula: FALLING_DUST, bloque: CYAN_TERRACOTTA, cantidad: 6, radio: 7, altura: 6, espesor: 2, techo: true}
        - {particula: DUST, color: "#5B6672", tam: 0.8, cantidad: 6, radio: 6, altura: 2, espesor: 2}
        - {particula: CLOUD, viento: true, velocidad: 0.35, cantidad: 3, radio: 7, altura: 1.5, espesor: 1.2, racha-cada: 7, racha-dura: 2}
      sonidos:
        - {sonido: "minecraft:block.pointed_dripstone.drip_water", cada: 1, volumen: 0.45, tono: 0.8, distancia: 5}
        - {sonido: "minecraft:entity.breeze.idle_air", cada: 7, volumen: 0.35, tono: 0.6, distancia: 4}
        - {sonido: "minecraft:entity.lightning_bolt.thunder", cada: 23, volumen: 0.3, tono: 0.6, distancia: 10}
    # La tormenta de la Parca: la que ve quien esta a 48 bloques de ella desde la fase III, en cualquier
    # bioma y aunque el ciclo este despejado. Oscura y carmesi, con viento, truenos y rayos rojizos. Mientras
    # dura, el clima de su bioma ni se pinta ni hace nada (ni dano, ni cordura, ni efectos). Solo se ve y se
    # oye (el dano es el de la Parca). Con hardcore.clima.activo en false tampoco sale.
    tormenta-parca:
      activa: true
      hojas-protegen: true
      particulas:
        - {particula: FALLING_DUST, bloque: NETHER_WART_BLOCK, cantidad: 14, radio: 9, altura: 8, espesor: 2, techo: true}
        - {particula: FALLING_DUST, bloque: BLACK_CONCRETE_POWDER, cantidad: 8, radio: 9, altura: 8, espesor: 2, techo: true}
        - {particula: DUST, color: "#5A121C", tam: 1.5, cantidad: 7, radio: 7, altura: 2.5, espesor: 2.5}
        - {particula: LARGE_SMOKE, viento: true, velocidad: 0.3, cantidad: 2, radio: 7, altura: 1.5, espesor: 1.2, racha-cada: 6, racha-dura: 2}
      sonidos:
        - {sonido: "minecraft:block.pointed_dripstone.drip_water", cada: 1, volumen: 0.4, tono: 0.6, distancia: 5}
        - {sonido: "minecraft:entity.breeze.idle_air", cada: 6, volumen: 0.4, tono: 0.5, distancia: 4}
        - {sonido: "minecraft:entity.lightning_bolt.thunder", cada: 9, volumen: 0.5, tono: 0.6, distancia: 10}
      rayos: {cada: 8, color: "#FF9C9C", tam: 1.8, distancia: 18, altura: 18, sonido: "minecraft:entity.lightning_bolt.thunder", volumen: 0.7, tono: 0.8}
    # Cielo rojo: el cielo se oscurece en rojo y cada cierto tiempo arde. La resistencia al fuego protege
    # de la quemadura.
    cielo-rojo:
      activo: true
      nombre: "El cielo arde"
      inicio: "El cielo se tiñe de sangre"
      aviso: "te vas a quemar."
      hojas-protegen: true
      # Hora que se le pone al jugador mientras esta alli: la del cielo de sangre del ciclo de
      # Panacea (el dia dura 72000 ticks y el cielo rojo va de 53250 a 54750, el mediodia del
      # tercer dia vanilla). 0 = no se toca. Durante un Eclipse, o si la Parca le ha cambiado el
      # cielo, manda el de ellos. Hasta la 1.15.1 era 64250, que con las noches de LethalWorld 2.1.1
      # cae de noche y se ve negro: si un config.yml aun la tiene, se lee como 54000.
      hora: 54000
      # Lo que dura el dia de Panacea en ticks (el periodo de su timeline). El servidor solo
      # deja fijar la hora dentro de bloques de 24000, asi que con este valor se calcula cada
      # segundo la que hay que mandar para que caiga en la 'hora' de arriba. Solo cambiarlo si
      # cambia el timeline del datapack.
      periodo-dia: 72000
      # Ticks que tarda su cielo en pasar al rojo al entrar, y del rojo al suyo al salir (andando, volando o
      # porque escampa): la hora avanza por el camino corto del dia vanilla (medio dia como mucho) en
      # vez de saltar. Morir, cambiar de mundo, desconectarse o teletransportarse lejos lo devuelven en
      # el acto. 0 = salto.
      transicion-ticks: 40
      # En la zona spawn, si es de este bioma, el mismo cielo y las mismas particulas (sin fuego ni dano).
      # Es el unico clima que entra en la zona spawn.
      en-spawn: true
      # Vineta roja en los bordes de la pantalla (0 a 0.95), aunque sentidos.vinheta este
      # apagada. Se suma a la de la cordura si esta encendida. 0 = sin vineta.
      vinheta: 0.4
      # Cada cuantos segundos arde, cuantos segundos dura y con cuantos segundos de aviso.
      arde-cada-segundos: 20
      arde-segundos: 4
      aviso-segundos: 2
      # Vida que quita cada segundo ardiendo (dano de fuego: la resistencia al fuego lo para).
      dano-por-segundo: 1.0
      # true: bajo techo no arde. De serie arde igual, techo o no.
      techo-protege: false
      # Como en la lluvia acida: tras este tiempo fuera, la cuenta hasta la proxima quemadura
      # empieza de cero.
      olvido-segundos: 30
      particulas:
        - {particula: FALLING_DUST, bloque: RED_CONCRETE_POWDER, cantidad: 8, radio: 8, altura: 6, espesor: 2, techo: true}
        - {particula: DUST, color: "#DA5955", tam: 1.2, cantidad: 3, radio: 6, altura: 1.6, espesor: 2}
        - {particula: CRIMSON_SPORE, cantidad: 6, radio: 8, altura: 2, espesor: 2}
      sonidos:
        - {sonido: "minecraft:ambient.crimson_forest.additions", cada: 6, volumen: 0.5, tono: 0.9, distancia: 6}
        - {sonido: "minecraft:block.fire.ambient", cada: 5, volumen: 0.25, tono: 0.7, distancia: 4}
  # [alineado] pool con los 12 contratos de ESTUDIO 5.9 (corto: true en los 4 cortos); semanal = 1 Llave del Caos.
  # Cada contrato: texto, evento que lo hace avanzar (Contratos.progreso), objetivo, premio (esencias y
  # mobcoins, por la Aduana), "mecanica": el interruptor que tiene que estar encendido para que salga
  # en el sorteo (vacio = siempre) y "etiqueta" (Calamity 1.10): el nombre corto con el que sale en la
  # barra de accion. Sin etiqueta vale la de serie del mismo id o, si no hay, las dos primeras palabras
  # del texto.
  #
  # Calamity 1.10 · Pergaminos: cada contrato es un pergamino (papel con su objetivo, su progreso y su
  # premio). 1.12.1: al entrar no se da nada; los de hoy son ofertas que se aceptan una a una con un clic
  # en el menu de Oren, en el spawn de Calamity, y solo entonces llega el pergamino. Una oferta aceptada
  # no se vuelve a aceptar, ocupa sitio (activos-max) aunque se pierda el papel y nada la repone sola: si
  # se pierde, Oren da otra copia si se le pide en el spawn (recuperar-perdido). Cambiar un contrato lo
  # deja otra vez como oferta. Sin su pergamino el contrato no avanza. Lo que se cumple dentro se cobra
  # al momento: el pergamino se rompe y la Aduana paga con las Esencias en la mano, como las de un mob
  # (si no caben, a tus pies; si mueres antes de salir, las pierdes), y las MobCoins como siempre. Los de
  # Reliquias se cumplen y se cobran al vendérselas a Oren en su tienda, al saldo. Los pergaminos no salen de
  # Calamity ni se guardan, se dan o se tiran (se rompen). Lo cobrado no vuelve a empezar
  # aunque mueras; lo que no, si.
  contratos:
    activo: false
    por-dia: 3
    cordura-limite: 25            # el contrato "al-limite" cuenta los minutos por debajo de esta cordura
    cortos-garantizados: 1
    cambios-gratis: 1
    precio-cambio: 1
    semana-objetivo: 12
    # Calamity 1.11: y una Llave del Umbral (ligada, por Entregas).
    semana-premio: ["calamity give llave %jugador% 1", "calamity give llave-umbral %jugador% 1 contratos"]
    pergamino:
      activo: true                # false: como antes de la 1.10 (sin papel; todo se cobra al salir vivo)
      # entregar-al-entrar ya no existe (1.12.1): Oren no deja nada al entrar, se aceptan en su menu.
      activos-max: 3              # contratos aceptados y sin cobrar a la vez (un perdido tambien cuenta)
      recuperar-perdido: true     # false: un pergamino aceptado que se pierde no se repone; queda cambiarlo
    # El contrato que va a la derecha de la cordura ("Mobs 6/10"; en la BossBar desde la 1.11): el ultimo que
    # avanzo o, si ninguno, el primero cuyo pergamino llevas. Nunca mas de uno.
    #   modo: siempre | avance (solo "segundos" despues de avanzar) | nunca (la barra como antes, con el
    #         aviso de cada avance)
    barra: {modo: siempre, segundos: 6}
    pool:
      corto-mobs: {texto: "Mata 10 mobs", etiqueta: "Mobs", evento: mob, objetivo: 10, esencias: 2, mobcoins: 20, corto: true}
      corto-cofre: {texto: "Abre un cofre de estructura", etiqueta: "Cofre", evento: cofre, objetivo: 1, esencias: 2, mobcoins: 20, corto: true, mecanica: cofres.activo}
      corto-reliquia: {texto: "Véndele a Oren en el spawn una Reliquia de grado II o más", etiqueta: "Reliquia", evento: reliquia-ii, objetivo: 1, esencias: 2, mobcoins: 20, corto: true, mecanica: reliquias.activas}
      corto-15: {texto: "Pasa 15 min en Calamity", etiqueta: "Minutos", evento: minutos, objetivo: 15, esencias: 2, mobcoins: 20, corto: true}
      extraer-ii: {texto: "Véndele a Oren en el spawn 3 Reliquias de grado II o más", etiqueta: "Reliquias", evento: reliquia-ii, objetivo: 3, esencias: 4, mobcoins: 60, mecanica: reliquias.activas}
      destacados: {texto: "Mata 5 mobs destacados", etiqueta: "Destacados", evento: destacado, objetivo: 5, esencias: 3, mobcoins: 40}
      eco: {texto: "Derrota un Eco ajeno válido", etiqueta: "Eco", evento: eco-valido, objetivo: 1, esencias: 5, mobcoins: 80, mecanica: eco.activo}
      al-limite: {texto: "Aguanta 15 min con la cordura por debajo de 25", etiqueta: "Al límite", evento: minutos-limite, objetivo: 15, esencias: 5, mobcoins: 80}
      minijefe: {texto: "Mata un minijefe", etiqueta: "Minijefe", evento: minijefe, objetivo: 1, esencias: 6, mobcoins: 100}
      sin-frasco: {texto: "Pasa 30 min en Calamity sin beber de un Frasco", etiqueta: "Sin frasco", evento: minutos-sin-frasco, objetivo: 30, esencias: 4, mobcoins: 60}
      cofres: {texto: "Abre 3 cofres de estructura", etiqueta: "Cofres", evento: cofre, objetivo: 3, esencias: 3, mobcoins: 40, mecanica: cofres.activo}
      redimir: {texto: "Derrota a tu propio Eco", etiqueta: "Tu Eco", evento: redimir, objetivo: 1, esencias: 4, mobcoins: 60, mecanica: eco.activo}
  kit: {activo: false, cada-horas: 20, frasco-tragos: 1, solo-sin-armadura: true}
  # [alineado] Hitos de PLAN 6 / DIS M16. [INSOMNE] de 24 h sigue tambien en "tag" (el de hoy).
  # Cada hito: estadistica (clave de stats, "horas-activas" en horas, o varias en "estadisticas" que
  # tienen que cumplirse todas), umbral, nombre (lo que se anuncia), comandos por consola con %jugador%
  # validado, anuncio (si sale a todo el servidor) y activo.
  # OJO: los nodos de LuckPerms de los tags II-III, [SEGADOR], [CAZAECOS], [CALAMIDAD] y los de RIP y
  # gkits son PROVISIONALES: los fija el paquete de configuracion leyendo produccion (Fase 0 de PLAN 9).
  # "manto-ids" no es un hito: las piezas MMOItems (TIPO.ID) que cuentan para el [5] del Manto.
  hitos:
    # Interruptor de todos los hitos. PROVISIONAL: los nodos de LuckPerms, RIP y gkit de arriba no
    # estan confirmados en produccion; Dosa decide si lo enciende alli (en el Test va encendido).
    activo: true
    manto-ids: ["CALAMITY.YELMO_DE_CALAMIDAD", "CALAMITY.CORAZA_DE_CALAMIDAD", "CALAMITY.GREBAS_DE_CALAMIDAD", "CALAMITY.SOLERETAS_DE_CALAMIDAD", "CALAMITY_ARMAS.HACHA_DEL_HERALDO"]
    umbral: {estadistica: extracciones-con-reliquia, umbral: 1, nombre: "Umbral", anuncio: false, comandos: ["calamity give llave-hito %jugador% 1"]}
    desvelado: {estadistica: horas-activas, umbral: 6, nombre: "Desvelado", anuncio: false, comandos: ["calamity give llave-hito %jugador% 1"]}
    h12: {estadistica: horas-activas, umbral: 12, nombre: "Doce horas", anuncio: false, comandos: ["calamity give llave-hito %jugador% 2", "calamity give esencia %jugador% 10"]}
    insomne-1: {estadistica: horas-activas, umbral: 24, nombre: "[INSOMNE] I", anuncio: true, comandos: ["lp user %jugador% permission set insomne.badge.unlocked true", "calamity give salvoconducto %jugador% 1"]}
    h48: {estadistica: horas-activas, umbral: 48, nombre: "Cuarenta y ocho horas", anuncio: true, comandos: ["lp user %jugador% permission set rip.death.specters true", "calamity give credito:sello-errante %jugador% 1"]}
    insomne-2: {estadistica: horas-activas, umbral: 72, nombre: "[INSOMNE] II", anuncio: true, comandos: ["lp user %jugador% permission set insomne2.badge.unlocked true", "calamity give credito:sello-errante %jugador% 1"]}
    vigia: {estadistica: horas-activas, umbral: 100, nombre: "Vigía", anuncio: true, activo: false, comandos: ["ae giverandombook %jugador% LEGENDARY", "lp user %jugador% permission set rip.kill.souls true", "lp user %jugador% permission set gkit.voidwalker true"]}
    insomne-3: {estadistica: horas-activas, umbral: 150, nombre: "[INSOMNE] III", anuncio: true, comandos: ["lp user %jugador% permission set insomne3.badge.unlocked true", "calamity give llave-hito %jugador% 2"]}
    sin-alba: {estadistica: horas-activas, umbral: 250, nombre: "Sin Alba", anuncio: true, activo: false, comandos: ["ae giverandombook %jugador% FABLED", "lp user %jugador% permission set rip.death.silencio true"]}
    segador-1: {estadistica: parcas, umbral: 1, nombre: "[SEGADOR] I", anuncio: true, comandos: ["lp user %jugador% permission set segador.badge.unlocked true", "lp user %jugador% permission set rip.death.souls true"]}
    segador-2: {estadistica: parcas, umbral: 10, nombre: "[SEGADOR] II", anuncio: true, comandos: ["lp user %jugador% permission set segador2.badge.unlocked true", "lp user %jugador% permission set gkit.grimreaper true"]}
    segador-3: {estadistica: parcas, umbral: 25, nombre: "[SEGADOR] III", anuncio: true, activo: false, comandos: ["lp user %jugador% permission set segador3.badge.unlocked true", "lp user %jugador% permission set rip.death.trompeta true"]}
    cazaecos-1: {estadistica: cazas-validas, umbral: 5, nombre: "[CAZAECOS] I", anuncio: false, comandos: ["lp user %jugador% permission set cazaecos.badge.unlocked true"]}
    cazaecos-2: {estadistica: cazas-validas, umbral: 25, nombre: "[CAZAECOS] II", anuncio: true, comandos: ["lp user %jugador% permission set cazaecos2.badge.unlocked true", "lp user %jugador% permission set rip.kill.chains true"]}
    cazaecos-3: {estadistica: cazas-validas, umbral: 60, nombre: "[CAZAECOS] III", anuncio: true, comandos: ["lp user %jugador% permission set cazaecos3.badge.unlocked true"]}
    calamidad: {estadistica: manto, umbral: 1, nombre: "[CALAMIDAD]", anuncio: true, comandos: ["lp user %jugador% permission set calamidad.badge.unlocked true", "lp user %jugador% permission set rip.kill.totem true"]}
    redimido: {estadistica: ecos-redimidos, umbral: 1, nombre: "Redimido", anuncio: false, comandos: ["lp user %jugador% permission set rip.death.phoenix true"]}
    vestigio: {estadisticas: [forja-mascara, forja-filo], umbral: 1, nombre: "Vestigio", anuncio: false, comandos: ["lp user %jugador% permission set rip.death.glitch true"]}
