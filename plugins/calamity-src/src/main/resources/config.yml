    extra-nivel: 5
    extra-nivel-si-parca: 5
    vida-multiplicador: 3.0       # vida = max(minima, H x mult x (1 + por-nivel x (N-1)))
    vida-por-nivel: 0.04
    vida-minima: 60
    dano-multiplicador: 0.8       # dano = clamp(D x mult x (1 + por-nivel x (N-1)), minimo, maximo)
    dano-por-nivel: 0.02
    dano-minimo: 3
    dano-maximo: 30
