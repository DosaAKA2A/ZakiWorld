  # [alineado] PLAN 7.3: cuatro tablas; llaves por Entregas (tope de 4); con < 8 elegibles solo el 1.o
  ranking:
    activo: false
    recalcular-segundos: 60
    minimo-extracciones: 3
    minimo-elegibles: 8
    maximo-tablas: 2
    tablas: [extraido, cazador, segador, superviviente]
    # objetos (Calamity 1.11): objetos de Entregas que se dan ademas, uno de cada (la Llave Ominosa al 1.o).
    premios:
      - {esencias: 30, llaves: 2, comandos: ["lp user %jugador% permission settemp anima.badge.unlocked true 7d"], objetos: [llave-ominosa]}
      - {esencias: 20, llaves: 1}
      - {esencias: 10, llaves: 1}
    # El menu de Rhen (1.7.4): arriba el libro de la categoria que miras, en medio su top 10 con
    # las cabezas de los jugadores y abajo una cabeza por categoria para elegir cual ver.
    # Si el config.yml del servidor no tiene "menu:", se usa este del jar entero. Si lo tiene, manda
    # el del servidor, y lo que le falte a una categoria con el mismo id se coge de aqui.
    menu:
      # El titulo de la ventana dice la categoria ("CALAMITY | Top · MobCoins"). Para cambiar un
      # titulo, Minecraft vuelve a mandar la ventana y en Bedrock se nota un parpadeo. Con false el
      # titulo es "Ranking semanal" o "Ranking historico" y cambiar de categoria solo repinta.
      titulo-por-categoria: true
      # Las cabezas que no son categorias: "Mas ->" (con mas de 9 categorias en una vista), la de
      # volver a la primera pagina y la de un puesto del top sin nadie. Texturas de Minecraft-Heads.
      cabezas:
        mas: "fcfe8845a8d5e635fb87728ccc93895d42b4fc2e6a53f1ba78c845225822"         # Red Arrow Right
        anterior: "f84f597131bbe25dc058af888cb29831f79599bc67c95c802925ce4afba332fc"  # Red Arrow Left
        libre: "89a995928090d842d4afdb2296ffe24f2e944272205ceba848ee4046e01f3168"     # Gray Question Mark
      # Las categorias, en el orden del selector. Cada una:
      #   clave: la estadistica (las de stats, como tasado-mc o parcas; horas-activas y esencias,
      #     que es el saldo guardado, no tienen semana y solo salen en el historico).
      #   nombre: el de su cabeza, corto. titulo: opcional, lo que dice el titulo si no es el nombre.
      #   mide: una frase con lo que cuenta. vistas: [semana, historico], o solo una de las dos.
      #   textura: el hash de textures.minecraft.net; vale tambien la URL entera o el "Value" en
      #     base64 que da Minecraft-Heads. material: lo que sale si la textura no vale.
      # Da premio el lunes la que cuente la estadistica de una de ranking.tablas.
      categorias:
        mobcoins:
          clave: tasado-mc
          nombre: "MobCoins"
          mide: "MobCoins que te pagan al vender lo que sacas."
          vistas: [semana, historico]
          textura: "b856ccab6f72b6f37332840a2779bb42758bbb2c015f54ce53740cb0f1cb4ca1"     # Red Dollar
          material: GOLD_INGOT
        ecos:
          clave: cazas-validas
