# Calamity - la PARCA, el Eco, la Aduana y las reglas hardcore de los mundos de Lethal World
#
# Hasta LethalWorld 1.1.1 todo esto vivia en plugins/LethalWorld/config.yml, dentro del
# propio LethalWorld. Ahora es su propio plugin con su propia config; las claves son las
# mismas de entonces (mobs: y hardcore:), tal cual estaban.
#
# Los mundos de Calamity son los de la lista hardcore.mundos: el nombre corto de cada
# mundo tal como sale en /lw list (los crea LethalWorld con /lw create). Fuera de ellos no
# se enciende ninguna regla. Los mobs con nivel (mobs:), en cambio, salen en todos los
# mundos de Lethal World.
#
# Se administra con /calamidad (antes /lw hardcore y /lw level) y se relee con
# /calamidad reload.

# Mobs de Lethal World: tipos de esbirro (se editan en /esb, carpeta "Lethal World · Panacea")
# que aparecen alrededor de cada jugador segun el bioma donde caen. El spawn natural de
# hostiles vanilla se cambia por estos; los de estructuras y spawners se adoptan (nivel y
# cartel sin cambiar la entidad).
mobs:
  activos: true
  # Cada cuanto se intenta hacer aparecer uno por jugador (20 ticks = 1 s).
  cada-ticks: 40
  # Mobs de Lethal World como mucho alrededor de cada jugador, contados en este radio.
  tope-por-jugador: 6
  radio-conteo: 48
  distancia-minima: 20
  distancia-maxima: 40
  # Los que quedan a mas de esto de cualquier jugador se retiran.
  retirar-a: 96
  probabilidad-destacado: 0.05
  # Hostiles sin nivel a esta distancia de un jugador se adoptan.
  radio-adopcion: 40
  # Quien esta en creativo no cuenta: ni salen mobs a su alrededor ni adopta a los de las
  # estructuras. En true cuenta igual que uno en supervivencia, para probar volando.
  contar-creativo: false
  # Ningun mob por encima de esta escala (los gigantes de las estructuras se encogen).
  escala-maxima: 2.0

  # Adoptados (estructuras, spawners): vida = max(la suya, vida-minima) x (1 + vida-por-nivel x (nivel-1)).
  adoptados:
    vida-minima: 20
    vida-por-nivel: 0.08
    dano-por-nivel: 0.04
    # Los mobs de MythicMobs no se adoptan: ya traen puesta su dificultad al crearlos y
    # si ademas se les escala la vida y el dano por nivel salen imposibles de matar.
    # Solo ponlo en false si quieres justamente eso.
    ignorar-mythicmobs: true

  # Adoptados con uno de estos nombres: minijefes, con nivel extra y mucha vida.
  minijefes:
    nombres: ["Creeper Gigatón", "Ventiarbusto Latente"]
    extra-nivel: 10
    vida-base: 400
    vida-por-nivel: 0.10
    dano-base: 1.5
    dano-por-nivel: 0.05

  # Estructuras que venian vacias: al acercarse alguien aparece su tropa, y vuelve estos
  # minutos despues de la ultima baja. Se escribe sola la primera vez.
  guarnicion-radio: 40
  guarnicion-reaparece-minutos: 20
  guarniciones: {}

  # nivel = rango de rankup x por-rango + poder de AuraSkills / poder-por-nivel, +-variacion.
  # Minimo real: rango 1 sin habilidades = 2. Maximo: rango 20 y poder 1100 = 95 (+10% = 100).
  nivel:
    placeholder-rango: "%notranks_rank_number%"
    por-rango: 2.0
    poder-por-nivel: 20.0
    variacion: 0.10
    extra-destacado: 5
    maximo: 100

  # MobCoins = lo que ese mob paga en el Survival (UltimateMobCoins/mobcoins.yml)
  #            x (1 + nivel / nivel-divisor) x multiplicador-mundo (x destacado).
  # Las paga EDM al que lo mata: pon estos mundos en disabled_worlds de UltimateMobCoins.
  # En Calamity las reparte el Grifo por la Aduana (hardcore.aduana), con sus topes.
  mobcoins:
    base-minima: 0.5
    nivel-divisor: 20
    multiplicador-mundo: 1.0      # era 1.5; provisional hasta leer UltimateMobCoins/mobcoins.yml (PLAN 3.3)
    multiplicador-destacado: 3.0
    multiplicador-minijefe: 0     # ya no se usa: el minijefe cobra el fijo de abajo
    minijefe: {min: 80, max: 120} # una sola via de MC (fichas de /esb a 0-0)

  # Experiencia que suelta cada clase de mob en Calamity (la pone el Grifo).
  xp: {comun: 20, destacado: 60, minijefe: 1500}

  # bioma -> tipos. Se escribe sola la primera vez; se puede editar.
  biomas: {}

# ---------------------------------------------------------------------------
# CALAMITY Y LOS MUNDOS HARDCORE
#
# Reglas que SOLO existen en los mundos de esta lista. Fuera de ellos no se
# enciende nada: cada regla pregunta primero por el mundo.
# ---------------------------------------------------------------------------
hardcore:
  activo: true
  # Los mundos de Lethal World que se rigen por esto (el nombre corto de /lw list).
  mundos:
    - calamity
  # En true, quien este en creativo tambien pierde cordura y recibe los efectos.
  contar-creativo: false

  # Cada cuantos segundos se renuevan los efectos del bioma.
  biomas-cada-segundos: 3

  cordura:
    # Cuanta cordura se pierde por minuto en condiciones normales. Con 1.0, cien
    # minutos de expedicion desde la entrada hasta el cero.
    por-minuto: 1.0
    # Multiplicadores que se acumulan: de noche, a oscuras y por bioma.
    factor-noche: 2.0
    factor-oscuridad: 2.0
    # Lo que cuesta un susto: un golpe que se lleve un cuarto de tu vida.
    por-golpe: 5
    # Por debajo del 50%: mobs de mas alrededor y niveles de mas.
    mobs-extra: 4
    nivel-extra: 10
    # Por debajo del 25%.
    nivel-extra-critico: 20
    # A cero.
    mobs-extra-vacio: 6

  # Con la cordura a cero viene uno de estos, y no mas de uno cada tantos minutos.
  minijefes:
    cada-minutos: 10
    distancia: 30
    # Multiplicadores sobre el esbirro normal de ese tipo.
    vida: 15
    dano: 4
    # 15. Te marca: te sigue aunque cambies de bioma, y si te alejas mas de esto
    #     reaparece a tu lado. Solo se acaba cuando cae uno de los dos.
    distancia-maxima: 60
    # Los rellena el plugin la primera vez con los cinco de la carpeta
    # "Lethal World · Minijefes" de /esb. A partir de ahi se editan alli.
    tipos: []

  muerte:
    # Al morir se pierde TODO lo que llevabas encima y la experiencia.
    lo-pierde-todo: true
    # 13. Minutos de espera para volver a entrar tras morir dentro.
    #     APAGADA por Dosa el 2026-09-18.
    cuarentena-minutos: 0

  # El tag de las 24 horas. La etiqueta en si vive en plugins/Tags/tags.yml (el plugin Tags,
  # que sustituyo a AlonsoTags), que decide quien puede ponersela por un PERMISO: entregarla
  # es dar ese permiso.
  # Las horas son ACUMULADAS y no se reinician nunca. Se guardan en hardcore-datos.yml,
  # junto a este fichero, y NO aqui: asi el plugin no reescribe este config cada
  # minuto y lo que se edite a mano o se suba por el panel no se pierde.
  tag:
    activo: true
    horas: 24
    nombre: "[INSOMNE]"
    comando: "lp user %jugador% permission set insomne.badge.unlocked true"

  # El Frasco de Calma: lo unico que devuelve cordura sin salir.
  frasco:
    usos: 3
    cordura: 40
    # Esencias de Calamidad que cuesta rellenar un trago en el altar.
    esencias-por-trago: 1

  # El Cristal de Regreso: segundos que hay que aguantar quieto.
  cristal:
    segundos: 5

  # A donde se sale (muerte, cristal y portal de salida). Sin esto, al spawn del
  # mundo principal. Se pone con /lw hardcore salida estando en el sitio.
  salida: {}

  # Las dos PUERTAS. Ya no son puntos con radio: son CAJAS, porque una esfera no
  # encaja en un marco construido. Se marcan con la vara (/lw hardcore wand: golpe
  # = esquina 1, clic derecho = esquina 2) y se guardan con
  # /calamidad define entrada|salida. Las escribe el plugin, no hace falta tocarlo.
  # 1.1.0: aqui va tambien la zona SPAWN (/calamidad define spawn), la caja donde el
  # AFK dura 5 minutos y acaba en la Grieta (ver parca.spawn). 1.2: solo se usa en un
  # mundo sin la region de WorldGuard de spawn.region (ver spawn, abajo).
  puertas: {}

  # Donde aparece el que entra. Se pone con /lw hardcore llegada dentro de Calamity.
  llegada: {}

  # 1.2 · La ZONA SPAWN: donde Calamity no hace nada salvo la Grieta (ver parca.spawn). Dentro
  # no nace ningun mob de Calamity, la cordura no baja, y no hay alucinaciones, latido, vineta,
  # niebla, efectos de bioma, minijefe de cordura, Frenesi, testigos, Eco ni PARCA (la que te
  # persigue se va y te espera fuera, como en la puerta). La puerta de salida, el altar, el
  # Cristal y la Tasacion siguen igual. Quien muere dentro deja el Eco fuera, en el borde.
  # Es la region de WorldGuard con este nombre en cada mundo hardcore (la del spawn de
  # calamity2 se llama "calamity"); si WorldGuard no esta o ese mundo no la tiene, la caja de
  # la vara (/calamidad define spawn). "" = solo la vara. Se relee cada 5 s: un /rg redefine
  # o un /calamidad define spawn se notan sin reiniciar. /calamidad dice cual se esta usando.
  spawn:
    region: calamity
    # Los mobs de Calamity que se cuelen (persiguiendo a alguien) se retiran en humo, y
    # ninguno apunta a quien este dentro. En false se quedan (pero dentro sigue sin nacer ninguno).
    retirar-mobs: true

  # Calamity 1.7: cuanto mas lejos del spawn, mas fuertes los mobs.
  # Se mide en horizontal desde el BORDE de la zona spawn de ese mundo (dentro, nada); si el
  # mundo no tiene zona, desde su spawn. Cuenta donde esta el jugador: le afecta a todo lo que
  # sale para el (esbirros, adoptados, guarniciones y minijefes), no a la PARCA ni al Eco.
  distancia:
    activa: true
    # +1 nivel por cada tantos bloques del borde...
    bloques-por-nivel: 100
    # ...hasta este tope (con 100 y 40, a 4.000 bloques ya no sube mas).
    tope-niveles: 40
    # Cada nivel de distancia con el que nacio un mob sube sus MobCoins esto (0.01 = 1 %,
    # +40 % en el tope). Va aparte de lo que ya paga por tener mas nivel.
    mobcoins-por-nivel: 0.01
    # Aviso en la barra de accion al cruzar cada tantos niveles ("Te adentras más en la
    # Calamidad · mobs +10 niveles"). 0 lo apaga. Dentro de la zona spawn no se avisa.
    aviso-cada-niveles: 5

  # Las quince reglas, cada una con su propio interruptor. Poner una en false (o en 0
  # las que son numero) la apaga sin tocar el resto.
  dificultad:
    # 1. No se duerme: ni se salta la noche ni se pone punto de reaparicion.
    sin-camas: true
    # 2. No se regenera vida sola: pociones y comida encantada.
    sin-regeneracion: true
    # 3. Lo que se pierde de hambre se multiplica por esto; comer sigue dando igual.
    hambre: 2.0
    #    Segundos de veneno y hambre que deja la comida cruda. 0 lo apaga.
    veneno-comida-cruda: 8
    # 4. Caidas y ahogos.
    dano-caida: 2.0
    dano-ahogo: 2.0
    # 5. Cuanta armadura ignoran los mobs de alli. 0.30 = pegan un 30% mas.
    penetracion-armadura: 0.30
    # 6. Lo que se gasta el equipo por uso.
    durabilidad: 2.0
    # 7. El totem se consume y NO salva.
    sin-totem: true
    # 8. Los mobs recogen lo que se cae al suelo y se lo quedan.
    mobs-recogen: true
    # 9. Mobs que te reciben al entrar. APAGADA por Dosa el 2026-09-18.
    oleada-de-entrada: 0
    # 10. Los mobs suben un nivel por cada tantos minutos que lleves dentro. 0 lo apaga.
    #     Cuenta la sesion: al salir de Calamity vuelve a cero. (Hasta la 1.6.1 era 5.)
    nivel-cada-minutos: 3
    #     Y un mob mas alrededor por cada tantos minutos dentro (mismo contador), hasta el
    #     tope. Se suma a los de la cordura baja. 0 lo apaga.
    mobs-extra-cada-minutos: 15
    mobs-extra-tope: 4
    # 11. De noche se cierra el aire con ceniza. OJO: es un efecto por jugador, NO un
    #     bioma repintado: Lethal Biomes pinta zonas y Calamity es infinito.
    niebla-de-noche: true
    #     La OSCURIDAD va a rachas, no continua: el efecto de vanilla es el apagon del
    #     warden y puesto todo el rato deja la pantalla negra. Cada cuantos segundos
    #     llega una racha y cuanto dura. En 0 la noche queda solo con la ceniza.
    niebla-oscuridad-cada-segundos: 45
    niebla-oscuridad-segundos: 3
    # 12. Los cofres de las estructuras salen vacios. APAGADA por Dosa el 2026-09-18.
    cofres-vacios: false
    # 14. Os podeis matar entre vosotros.
    fuego-amigo: true

  # Comandos que no funcionan dentro (quien tenga ederus.mundos se los salta).
  comandos-prohibidos:
    - spawn
    - home
    - homes
    - sethome
    - tpa
    - tpahere
    - tpaccept
    - back
    - warp
    - rtp
    - wild
    - ec
    - enderchest
    - echest
    # Bancos y grifos a mitad de expedicion (DIS M4): se sacaria lo de dentro sin Tasacion.
    # Comprobar los alias reales en el panel antes de subirlo.
    - pv
    - playervault
    - playervaults
    - vault
    - ah
    - auction
    - subasta
    - trade
    - kit
    - kits
    - gkit
    - sell
    - pay
    - shop
    - auctionhouse
    - pa
    - playerauction
    - pauction

  # ===========================================================================
  # CALAMITY 1.1.0: PARCA, Eco, Aduana, Esencias, Reliquias y lo demas.
  # 1.1.1 (tras la primera prueba): la PARCA con cuerpo de NPC (parca.cuerpo), mini withers
  # en el Cortejo (parca.planideras), avisos mas largos y legibles, la Huella cuenta las
  # interacciones variadas y el vuelo (parca.interacciones...), y las exenciones van a mano
  # con /lw hardcore exento (ya no por permiso). Los colores de los mensajes, en Paleta.java.
  # Bloque de DISENO-CALAMITY, seccion 4. Las mecanicas P1 van apagadas de serie
  # (activo: false) hasta probarlas; las P2 estan escritas pero no programadas.
  # Lo que el plugin escribe solo va a hardcore-datos.yml, nunca aqui.
  # ===========================================================================

  # Zona horaria de los "dias" y "semanas" de Calamity (Aduana, contratos, encuesta, eclipse,
  # ranking). Vacio = la del sistema del servidor. Ejemplo: "Europe/Madrid".
  zona: ""

  # ------------------------------------------------------------------ 1. LA PARCA
  parca:
    activa: true
    # huella = celdas distintas pisadas moviendote tu (caza circuitos y vaivenes).
    # bloque = la regla literal: se reinicia al alejarse "radio" bloques. Solo para pruebas.
    modo: huella
    minutos: 10                   # tiempo quieto que la llama
    muestra-segundos: 5           # cada cuanto se apunta una celda
    celda-horizontal: 2           # lado X/Z de una celda, en bloques
    celda-vertical: 3             # alto de una celda
    max-celdas: 24                # mas celdas distintas que esto = ya no estas quieto
                                  # (nunca mas de 1 por cada 5 muestras de la ventana: con minutos
                                  # por debajo de 10, como el 1 del Test, baja solo; 1 min = 2 celdas)
    radio: 1                      # solo modo bloque
    vehiculo-porcentaje: 0.80     # senal de vehiculo: fraccion de muestras montado...
    vehiculo-lado: 128            # ...y caja maxima del recorrido, en bloques
    vehiculo-muestras-minimas: 60 # muestras necesarias antes de mirar el vehiculo (5 min)
    congelar-segundos: 10         # pausa tras un golpe de amenaza o de un rival valido
    congelar-dano-minimo: 4       # dano final minimo para que un golpe pause
    pausa-maxima-segundos: 180    # presupuesto de pausa...
    pausa-ventana-minutos: 10     # ...por esta ventana (cierra a los alts que se pegan)
    reconexion-minutos: 30        # la huella se guarda en memoria tras desconectarse
    gracia-minutos: 5             # sin contar tras acabar una Parca
    # 1.1.1: tambien es moverse interactuar de forma VARIADA: romper, poner o picar bloques,
    # golpear y abrir contenedores en sitios distintos, con la camara girando sin patron. Un
    # autoclicker repite objetivo y angulo, y eso sigue sin contar. Y volando (creativo, /fly,
    # elitros) cuenta desplazarse aunque no lleguen las teclas.
    interacciones: true           # false = solo teclas, como en 1.1.0
    interacciones-minimas: 2      # interacciones variadas en una muestra para que cuente
    giro-minimo: 1.5              # grados que tiene que girar la camara entre dos de ellas
    vuelo-minimo: 1.0             # bloques desplazados volando entre muestras
    # Exentos de la Huella y la PARCA: ya no por permiso (el comodin de LuckPerms se lo daba
    # a todo el staff), sino a mano con /lw hardcore exento <jugador> parca on.
    avisos: [300, 420, 510, 540, 570]   # segundos de quietud de cada aviso
    radio-campana-ajena: 48       # a cuanto oyen los demas la campana del aviso de 540
    radio-marca-grupo: 24         # quien este a esto...
    quieto-marca-grupo: 420       # ...y lleve esto quieto, queda marcado tambien
    maximo-simultaneas: 3         # Parcas vivas a la vez en todo el servidor
    extra-nivel: 10               # N = nivelCalamity + esto (el de los minijefes)
    vida-base: 400                # vida logica = base x (1 + por-nivel x (N-1)) x ...
    vida-por-nivel: 0.10
    vida-por-repeticion: 0.25     # +25 % por cada Parca de ese jugador en 24 h
    vida-por-marcado: 0.5         # +50 % por marcado extra
    golpe-base: 8                 # attack_damage = base x (1 + por-nivel x (N-1)) x R
    golpe-por-nivel: 0.04
    dano-por-repeticion: 0.5      # R = 1 + esto x repeticiones: +50 % cada una
    tope-repeticion: 3.0          # R maximo
    repeticiones-maximo: 4        # repeticiones que se cuentan como mucho
    ventana-repeticion-horas: 24
    tope-golpe-fraccion: 0.08     # ningun golpe le quita mas que esto de su vida logica
    escala: 1.35                  # escala del esqueleto wither cuando NO lleva cuerpo de NPC
    velocidad: 0.28
    # Cuerpo de NPC (1.1.1): un Mannequin con la skin de una cuenta real encima del esqueleto,
    # que se vuelve invisible y sigue peleando debajo (como Rabby en EDM). La skin se pide a
    # Mojang al invocarla (fuera del hilo principal) y se guarda en memoria: la primera PARCA
    # tras el arranque sale un instante con la skin de serie. Nunca se guarda en el mundo.
    cuerpo:
      activo: true                # false = el esqueleto wither vestido de siempre
      skin: Leonsaurusrex         # cuenta de Minecraft cuya skin lleva (3-16 letras, numeros o _)
      escala: 1.68                # tamano del cuerpo; 1 = un jugador. El esqueleto (su caja) se ajusta solo
    # aviso-ticks: lo que dura el aviso de cada habilidad antes del golpe (20 ticks = 1 s).
    # 1.1.1 los alarga (Siega 24 -> 30, Paso Umbral y Tiron 20 -> 24): se ven mejor y dan el
    # mismo tiempo de reaccion o mas; bajarlos hace la pelea mas injusta, no mas dificil.
    siega: {espera: 6, espera-fase3: 5, angulo: 100, radio: 5, aviso-ticks: 30, vida: 0.20, tope: 0.60, cordura: 8}
    umbral: {espera: 8, distancia: 12, sin-vision-segundos: 4, sin-golpear-segundos: 5, aviso-ticks: 24}
    tiron: {espera: 12, distancia-minima: 6, distancia-maxima: 18, aviso-ticks: 24, rompe: 0.03, fuerza: 1.6}
    # Cortejo (fase II). Desde 1.1.1 las planideras son mini withers que orbitan a la PARCA:
    # sin IA ni barra de jefe, no pegan ni disparan; lloran (lamento: -cordura). Mientras
    # quede una, la PARCA recibe x reduccion; si caen todas antes de 40 s, queda aturdida.
    planideras:
      base: 3                     # planideras = base + marcados extra...
      tope: 6                     # ...con este tope
      vida: 12                    # vida = vida x (1 + vida-por-nivel x (N-1))
      vida-por-nivel: 0.05
      escala: 0.35                # tamano del mini wither (1 = un wither normal)
      radio: 3.0                  # radio de la orbita alrededor de la PARCA, en bloques
      altura: 1.8                 # altura de la orbita sobre sus pies
      lamento-segundos: 4         # cada cuanto llora cada una hacia su objetivo...
      lamento-radio: 12           # ...si esta a esta distancia...
      cordura: 3                  # ...y le quita esta cordura (nunca vida)
      vida-ticks: 800             # se deshacen solas a los 40 s
      reduccion: 0.5              # dano que recibe la PARCA mientras quede alguna
      espera: 30                  # segundos entre cortejos
      aturdir-segundos: 3         # aturdida si caen todas antes de vida-ticks...
      aturdida-extra: 0.25        # ...y recibe +25 % mientras
    # La Ultima campanada (fase III): cinco toques y, en el ultimo, la Sentencia (dano
    # verdadero, -cordura y Oscuridad 1,5 s a quien siga dentro del anillo).
    campanada: {espera: 30, toques: 5, cada-ticks: 24, radio: 10, vida: 0.50, tope: 0.90, cordura: 25, dano-extra-recibido: 0.25}
    furia-minutos: 5              # a partir de aqui esperas x0.7 y velocidad x1.2
    duracion-maxima-minutos: 12   # se va sin botin
    atasco-segundos: 20           # sin golpear ni saltar: aparece encima de la presa
    presencia-radio: 16           # la cordura baja mas rapido cerca de ella...
    presencia-factor: 2.0         # ...por esto
    radio-cosecha: 48             # los mobs que mueren aqui no sueltan nada
    radio-cosecha-bloques: 16     # los bloques que rompe un marcado aqui no sueltan nada
    tierra-segada-minutos: 30     # si mata a su presa, ese sitio no suelta nada...
    tierra-segada-radio: 24       # ...en este radio
    marca-fuera-minutos: 30       # tras salir por la puerta, te espera si vuelves antes
    pendiente-horas: 24           # tras desconectarse sin combate, vuelve al volver
    espera-desconexion-segundos: 60
    reaparece-segundos: 5
    cristal-segundos-marcado: 10  # el Cristal tarda esto con ella cerca...
    cristal-radio-marcado: 24     # ...a esta distancia
    cabeza-textura: ""            # base64 o hash de una cabeza; vacio = la calavera
    botin:
      horas-entre-cobros: 24
      participacion-minima: 0.10  # fraccion de su vida logica para cobrar
      participacion-presa: 0.25   # la presa necesita esto (y ser su primera del dia)
      esencias-base: 4            # presa: base + floor(N / cada-niveles)
      esencias-cada-niveles: 10
      ayudante-esencias-base: 2   # ayudante: base + floor(N / cada-niveles)
      ayudante-esencias-cada-niveles: 20
      reliquia-grados: [25, 50]   # N por debajo de cada umbral -> grado II, III; si no, IV
      mobcoins: 0                 # una sola via de MobCoins (lectura-jefes 4)
      raro: {probabilidad: 0.0, comandos: []}   # hueco del plan de recompensas
    # [alineado] PLAN 3.2: Campana solo al top-3 de dano; +25 % por participante desde el 2.o
    campana: {solo-top: 3}
    grupo: {extra-por-participante: 0.25, maximo-extra: 4}
    # 1.1.0 · La PARCA es tambien una anomalia DIOS de EDM (/anomaly: menu, start parca, here
    # parca, test pa_...). Cuando la Huella la llama y EDM esta libre, viene esa: cuatro fases,
    # quince tecnicas, cambios de fase con escena. Si EDM ya tiene otra anomalia abierta (o no
    # esta su modulo, o se apaga aqui o en su menu) viene la de reserva, la de 1.1.1.
    # Vida y golpe salen de las formulas de arriba (N, r, M), no del ajuste de vida de EDM.
    # El botin es el de arriba, por la Aduana: la experiencia y las MobCoins que EDM daria
    # por 'parca' se dejan a 0 solas (su tabla de botin tiene que quedarse vacia).
    anomalia:
      activa: true                # false = siempre la de reserva
      nivel-sin-presa: 50         # N de la que se abre a mano sin nadie cerca (con gente: la de ellos + extra-nivel)
      ambiente: true              # lluvia en la fase III y noche en la IV, solo para quien este a 48
      anuncio-global: false       # true = la de un AFK se anuncia a todo el servidor como las demas anomalias
                                  # (titulo y coordenadas a todos); false = solo la campana a 128 bloques
      dano: 1.0                   # multiplica el dano de sus tecnicas (se suma al "dano" de /anomaly menu)
      apagadas: []                # tecnicas que no usa: pa_siega, pa_tajos, pa_acecho, pa_acometida, pa_umbral,
                                  # pa_tiron, pa_cortejo, pa_guadanas, pa_salto, pa_embestida, pa_umbrales,
                                  # pa_lluvia, pa_muros, pa_anillo, pa_sentencia
      esperas: {}                 # segundos entre usos por tecnica, p. ej. {pa_lluvia: 20, pa_muros: 30}
    # 1.1.0 · La GRIETA: quieto en la zona spawn (hardcore.spawn) no se espera a los
    # 10 minutos: a los "minutos" se abre una grieta, se lo traga y lo escupe en un sitio
    # seguro al azar a distancia-min..distancia-max del spawn, y alli le aparece la PARCA.
    # Los avisos previos salen igual, a la misma proporcion, con su propio texto.
    spawn:
      activa: true
      minutos: 5                  # no puede pasar de "minutos" (la Huella no mide mas)
      distancia-min: 600
      distancia-max: 1500
      intentos: 12                # puntos al azar que prueba antes de rendirse (1.2: entonces vuelve a abrirse al minuto;
                                  # la PARCA no viene nunca a la zona spawn)
      # 1.6.1 · Pescar en la zona spawn no abre la Grieta. Cada pez (o cosa) que sacas con la
      # caña pone a cero el reloj de la Grieta y lo tiene parado "pesca-gracia-segundos". Lanzar
      # la caña, que pique o recogerla también lo alargan, pero solo si has sacado algo en los
      # últimos "pesca-captura-minutos": quien lanza y recoge sin parar sin pescar nada (un
      # autoclicker) acaba igual en la Grieta.
      # Solo vale en la zona spawn: fuera, pescar sin moverse sigue llamando a la PARCA, porque
      # una granja de pesca AFK sigue siendo estar AFK.
      pesca-cuenta: true          # false = pescar en el spawn no frena la Grieta
      pesca-gracia-segundos: 90
      pesca-captura-minutos: 3

