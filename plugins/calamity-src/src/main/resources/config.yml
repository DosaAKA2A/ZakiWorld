  # ------------------------------------------------------------------ EL CRONISTA (1.2.0)
  # Los NPCs de la antesala los pone el staff a mano con Citizens; Calamity no los crea. Cada
  # uno lleva un clic que Citizens ejecuta como CONSOLA (sin -p) y en el que cambia <p> por
  # quien hace clic; -l -r = los dos botones. Cada uno tiene nombre propio (1.5.2), sin
  # articulo: se crea con "/npc create <Nombre>" y, con el NPC seleccionado (/npc select):
  #   Sael  /npc command add -l -r calamidad abrir <p> umbral     Altar, pagina Umbral
  #   Vael  /npc command add -l -r calamidad abrir <p> forja      Altar, pagina Forja
  #   Oren  /npc command add -l -r calamidad abrir <p> mercader   dinero, ventas y contratos de hoy
  #                                                             ("tasador", su id de antes, sigue valiendo)
  #   Ilen  /npc command add -l -r calamidad abrir <p> cronista   los capitulos de abajo
  #   Rhen  /npc command add -l -r calamidad abrir <p> cazador    tablas de la semana y el Tablero
  #   Lior  /npc command add -l -r calamidad abrir <p> engarzador pone y quita las Gemas de Calamidad (1.4)
  # /calamidad engarzador repite la receta de Lior. Engarzar es gratis y quitar una gema la
  # rompe. Admite las gemas del tipo de entregas.mmo.gema (CALAMITY_GEMAS) en las piezas de los
  # tipos de forja.piezas que tengan hueco.
  # El jugador no necesita permiso (/calamidad es de staff y consola) y el Altar solo se abre
  # desde el NPC o su bloque, nunca a distancia ni dentro de Calamity.
  cronista:
    # Los capitulos de /calamity cronista, en este orden (el id tambien vale: /calamity
    # cronista parca). {ruta} se cambia al leerlo por ese valor de hardcore:, asi las cifras
    # siguen a la config: {parca.minutos} -> 5. En una lista se entra por el id de sus
    # elementos ({altar.trueques.cristal.esencias}) o por posicion, desde 0
    # ({aduana.tramos-mc.0.hasta}). Una ruta que no exista sale tal cual, entre llaves, y
    # /calamidad autotest npcs la senala. Lineas cortas: cada una tiene que caber en el chat.
    capitulos:
      calamity:
        titulo: "Qué es Calamity"
        texto:
          - "Calamity es un mundo hardcore: entras, consigues botín y solo te lo quedas si sales vivo."
          - "Si mueres en Calamity, pierdes todo lo que llevas encima y también la experiencia."
          - "Para salir vivo, cruza la puerta de salida o usa un Cristal de Regreso y quédate quieto {cristal.segundos} s."
          - "Al salir vivo, tus Reliquias se venden solas y tus Esencias pasan a tu saldo."
      cordura:
        titulo: "La cordura"
        texto:
          - "Desde que entras, tu cordura baja {cordura.por-minuto} por minuto. La noche multiplica ese ritmo por {cordura.factor-noche}, y la oscuridad, por {cordura.factor-oscuridad}."
          - "Un golpe que te quite al menos un cuarto de la vida que tienes te cuesta {cordura.por-golpe} de cordura."
          - "Por debajo de la mitad salen más mobs y más fuertes. Si llega a cero, viene por ti el minijefe del bioma donde estás."
          - "El Frasco de Calma te devuelve {frasco.cordura} de cordura por trago y tiene {frasco.usos} tragos. Se recarga en el Altar."
          - "En el spawn de Calamity la cordura no baja."
      parca:
        titulo: "La Parca"
        texto:
          - "Si te quedas quieto {parca.minutos} min en Calamity, viene la Parca: una anomalía de nivel Dios con cuatro fases."
          - "Antes oirás avisos y una campana. Si te mueves de verdad (exploras, picas o peleas), no viene; con un autoclicker, sí."
          - "En el spawn de Calamity no aparece: a los {parca.spawn.minutos} min quieto se abre una Grieta que te traga y te deja lejos."
          - "Allí te encuentra. Derrotarla paga Esencias, y los {parca.campana.solo-top} que más daño le hagan (salvo su presa) se llevan una Campana de la Parca."
      eco:
        titulo: "El Eco"
        texto:
          - "Si mueres en Calamity, nace tu Eco donde caíste: pelea con una copia de tu equipo y guarda tus Reliquias y parte de tus Esencias."
          - "Dura {eco.horas} h. Si lo derrotas tú, recuperas tus Reliquias y esas Esencias, y {eco.cordura-dueno} de cordura. El equipo no vuelve."
          - "Si lo derrota otro jugador, se queda con todo eso y a veces también con una Lágrima de Eco."
          - "Rhen sabe qué Ecos guardan más botín, pero no te da coordenadas: hay que buscarlos."
      esencias:
        titulo: "Esencias, Reliquias y ventas"
        texto:
          - "Las Esencias caen de los mobs de Calamity. Si sales vivo, pasan a tu saldo, y con él pagas en el Altar y la Forja."
          - "Tu saldo es permanente: no caduca ni se reinicia cada día. Si mueres en Calamity, solo pierdes las Esencias que llevabas encima."
          - "Cada Reliquia que sacas vivo se vende por Esencias y MobCoins."
          - "La Astilla vale {reliquias.grados.1.esencias} Esencias; el Fragmento, {reliquias.grados.2.esencias}; el Ámbar, {reliquias.grados.3.esencias}; y el Ámbar Mayor, {reliquias.grados.4.esencias}."
          - "La primera vez que sales vivo cada día cobras {esencias.primera-extraccion-dia.base} Esencias más. Las Reliquias de grado III y IV caducan a los {reliquias.caduca-dias} días."
          - "La Aduana te paga las MobCoins, con un tope de {aduana.tramos-mc.0.hasta} al día."
      altar:
        titulo: "El Altar y la Forja"
        texto:
          - "En el Altar, Sael te cambia Esencias por Frascos, Tinturas, Cristales de Regreso ({altar.trueques.cristal.esencias} Esencias) y la Llave del Caos."
          - "Con un Reclamo llamas al minijefe del bioma donde estás, sin esperar a la cordura."
          - "En la Forja, Vael hace el Manto de Calamidad: cada pieza pide Esencias, MobCoins y el Sello de su minijefe."
          - "El Vestigio del Eco pide Marcas de Eco, y la Guadaña, {altar.trueques.guadana.creditos} Fragmentos de Guadaña. Todo lo forjado queda ligado a ti."
          - "Si pierdes en Calamity una pieza del Manto y la repones antes de {forja.reposicion-dias} días, te cuesta la mitad de Esencias."
          - "Lior te engarza gratis las Gemas de Calamidad en las piezas que tienen hueco. Si quitas una gema, se rompe."

