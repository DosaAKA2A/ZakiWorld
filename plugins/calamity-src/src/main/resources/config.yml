          vistas: [semana, historico]
          textura: "f8cb7bbe640b297280a833b8bda5d1626bfb04265c780898d256c830a3aaea35"     # Red Reaper
          material: NETHERITE_HOE
        expedicion:
          clave: expedicion-max-seg
          nombre: "Expedición"
          mide: "Lo que duró tu expedición más larga."
          vistas: [semana, historico]
          textura: "fb80a871e9939eb1de3b40c9c1f05ccca89dc96547c6e66c65a51bae7a355f89"     # Red Backpack
          material: TOTEM_OF_UNDYING
        esencias:
          clave: tasado-esencias
          nombre: "Esencias"
          mide: "Esencias que te pagan al vender lo que sacas."
          vistas: [semana, historico]
          textura: "e672959028f274b379d430f068f0f15a4f793eac12afb94ae0b4e50cf895df0f"     # Fine Ruby Gemstone
          material: GHAST_TEAR
        reliquias:
          clave: reliquias
          nombre: "Reliquias"
          mide: "Reliquias que has sacado vivo y vendido."
          vistas: [semana, historico]
          textura: "b1f868761a5c9139da1fec6726e1655929429a43ab972c8118ba26b9255e7c"       # Red Chest (hierro)
          material: RESIN_CLUMP
        salidas:
