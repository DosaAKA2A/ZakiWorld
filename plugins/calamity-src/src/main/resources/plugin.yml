name: Calamity
version: '1.13.1'
main: net.ederus.calamity.CalamityPlugin
api-version: '1.20'
author: Iris Studio
description: "Calamity: la Parca, el Eco, la Aduana y las reglas hardcore de los mundos de Lethal World"
# Los esbirros, las MobCoins y Compat salen de EDM; los mundos y la bitacora, de LethalWorld.
# Sin cualquiera de los dos, esto no arranca.
# Desde la 1.7.6 hace falta EDM 1.74.0 o superior: los mobs de Calamity pagan con el boost de
# MobCoins (MobCoins.pagarPorBaja y conBoost, que no existen antes). plugin.yml no deja pedir
# una version minima: con un EDM anterior Calamity arranca, pero falla al pagar los mobs.
depend: [EDM, LethalWorld]
# MMOItems se lee por reflexion (PuenteMmo, que tambien mira MythicLib pero MythicLib
# no va en esta lista a proposito: MMOItems ya lo trae como dependencia suya), y MythicMobs
# igual (PuenteMythicMobs); estar aqui asegura que cargan antes y que Paper deja ver sus clases.
# El Engarzador (1.4) usa la API de MMOItems directamente, pero solo desde EngarceMmo y solo si
# MMOItems esta: sin el, Calamity arranca igual y el Engarzador dice que no puede trabajar.
softdepend: [PlaceholderAPI, AuraSkills, UltimateMobCoins, WorldGuard, MMOItems, LibsDisguises, MythicMobs]

commands:
  # 1.12: un solo comando, solo de staff y en ingles. Los jugadores no escriben nada: todo lo que
  # consultaban (saldo, Ecos, contratos, historias...) lo abren los NPCs de la antesala con
  # "calamity open <player> <id>" por consola (Citizens). Sin calamity.admin no sale en el tab y
  # contesta como un comando que no existe. La forma vieja de staff (en espanol) la atiende un
  # comando oculto, solo de consola y temporal, que monta el plugin (RedireccionComandos).
  calamity:
    description: Calamity para el staff
    usage: /calamity <subcommand>
    aliases: [cal]
    permission: calamity.admin

permissions:
  # El nodo de staff de /calamity y de todos sus subcomandos. default: op; en LuckPerms lo llevan
  # los grupos admin, owner y dev. Es propio de Calamity: ederus.mundos lo declara LethalWorld y
  # Bukkit no admite el mismo nodo en dos plugin.yml.
  calamity.admin:
    description: /calamity y todos sus subcomandos (staff)
    default: op
    # El staff de Calamity tambien se salta los sellos de almacen (Sellos lo mira igualmente).
    children:
      calamity.bypass.storage: true
  # lethalworld.calamity (default true, el /calamity de los jugadores hasta la 1.11) ya no abre
  # nada y no se declara: los grupos de LuckPerms que lo tengan puesto no ganan ningun comando.
  # lethalworld.parca.exento y lethalworld.aduana.exento ya no existen (LethalWorld 1.1.1):
  # con el comodin "*" de LuckPerms todo el staff los heredaba. Las exenciones van a mano,
  # una a una: /calamity exempt <player> <reaper|customs|all> <on|off> (se guardan en
  # hardcore-datos.yml).
  # Rama venta-oren: el staff que puede usar /ec y /pv dentro de Calamity y guardar Reliquias y
  # Esencias fuera (Sellos). calamity.admin lo lleva de hijo.
  calamity.bypass.storage:
    description: Saltarse los sellos de almacen de Calamity (/ec y /pv dentro; guardar Reliquias y Esencias fuera)
    default: op
