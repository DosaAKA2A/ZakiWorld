# =============================================================================
#  Calamity · objetos-calamity.yml (generado por gen_config.py: NO editar a mano)
#  Lo que cada objeto y set de MMOItems de Calamity tiene que llevar DE VERDAD.
#  Lo usan /calamity selftest real-items y /calamity items stats <player>.
#  stats: IDs de MMOItems (MythicLib los guarda en custom_data como MMOITEMS_<ID>).
#  bonos: por nivel del set, sin acumular (MMOItems suma [2]..[n]).
#  pieza: la clave de forja.piezas / entregas.mmo; si la config lleva otro TIPO.ID, manda la config.
#  padre: el tipo de MMOItems cuyo comportamiento hereda su tipo (atacar, engastar, consumir).
#  1.12.3 (lote de gemas, a mano): hueco Calamidad en las diez piezas, la Masamune y la Crimson
#  Masamune, y las seis gemas nuevas (docs/lote-gemas). Pasarlo a gen_config.py al regenerar.
#  1.13.0 (a mano): el Manto baja a la escala de proteccion de Ederus, ~102 (Veyra 100, anomalias
#  110, Dios 120): armadura 2.5/6/4/2.5, dureza 3, vida 4/9/9/4; bonos [2] +1 corazon, [3] -1 %, [4] sin vida.
# =============================================================================

