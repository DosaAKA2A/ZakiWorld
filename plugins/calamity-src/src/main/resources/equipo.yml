# Calamity - lo que hace el equipo DENTRO de Calamity (equipo.yml)
#
# El reparto: en MMOItems vive el objeto y sus stats normales (armadura, vida, dano,
# bonos de set de stats, habilidades de MythicLib). Aqui viven las funciones propias de
# Calamity, ligadas al identificador del item, TIPO.ID (lo mismo que /mi give TIPO ID).
# Cambiar algo aqui y hacer /calamidad reload vale al momento, tambien para los items que
# ya tienen los jugadores: no hay que tocar ni regenerar el item de MMOItems.
#
# Que cuenta: la armadura PUESTA y lo que se lleve en las DOS MANOS. Cada pieza cuenta una
# vez aunque se lleve repetida, y una pieza de armadura en la mano no cuenta (solo puesta).
# Un set suma su "bono" cuando se llevan al menos "necesita" de sus "piezas" (sin
# "necesita", todas). Para dos escalones de un mismo set (2 piezas y 4 piezas) se ponen dos
# sets con las mismas piezas y distinto "necesita": los dos bonos se suman.
#
# Efectos (todo en FRACCION: 0.10 = un 10 %). Todo lo del jugador se suma y se topa por
# efecto con "topes" (abajo), para que el equipo no apague el modo hardcore:
#
#   cordura-drenaje        fraccion MENOS de drenaje de cordura por segundo (0.20 = baja un 20 % mas despacio)
#   cordura-alucinaciones  fraccion MENOS de probabilidad de alucinar en cada tirada
#   parca-dano-recibido    fraccion MENOS del dano que hace la PARCA (sus golpes, sus tecnicas y el dano
#                          verdadero de la Siega y la Sentencia), en la de EDM y en la de reserva
#   eco-dano               fraccion MAS de dano a los Ecos (el tope por golpe de las amenazas sigue mandando)
#   esencias-bonus         fraccion MAS de Esencias de mobs, minijefes y cofres dentro de Calamity. Se suma
#                          antes de la Aduana, que las topa igual: NUNCA en la Tasacion ni en otros pagos
#   hambre                 fraccion que se QUITA del castigo extra de hambre (0.5 con x2 = x1,5)
#   durabilidad            fraccion que se QUITA del castigo extra de durabilidad (0.5 con x2 = x1,5)
#   caidas                 fraccion que se QUITA del castigo extra de las caidas (0.5 con x2 = x1,5)
#   niebla                 fraccion MENOS de ceniza y de duracion de las rachas de oscuridad de la noche
#
# Un valor negativo empeora (una maldicion): cordura-drenaje: -0.2 = baja un 20 % mas deprisa.
# Nunca baja de -1.
#
# /calamidad equipo <jugador>  ensena que cuenta de su equipo, por donde se lee y lo que suma.
# /calamidad autotest equipo   prueba todo esto y genera un item real de cada pieza de aqui.

# Lo maximo que puede sumar el equipo de un jugador en cada efecto.
topes:
  cordura-drenaje: 0.50
  cordura-alucinaciones: 0.50
  parca-dano-recibido: 0.30
  eco-dano: 0.50
  esencias-bonus: 0.25
  hambre: 0.50
  durabilidad: 0.50
  caidas: 0.50
  niebla: 0.50

# Cada pieza por su TIPO.ID. OJO: los items de Calamity se estan moviendo a los tipos
# CALAMITY (armadura), CALAMITY_ARMAS, CALAMITY_GEMAS y CALAMITY_CONSUMIBLES; el TIPO de
# aqui tiene que ser el que tenga el item en MMOItems (si no, sale un aviso en consola y en
# /calamidad autotest equipo). Ejemplo (quitar las # para usarlo):
#
#   CALAMITY.YELMO_DE_CALAMIDAD:
#     cordura-drenaje: 0.05
#     niebla: 0.25
#   CALAMITY.CORAZA_DE_CALAMIDAD:
#     parca-dano-recibido: 0.05
#   CALAMITY.GREBAS_DE_CALAMIDAD:
#     hambre: 0.25
#   CALAMITY.SOLERETAS_DE_CALAMIDAD:
#     caidas: 0.25
#   CALAMITY_ARMAS.HACHA_DEL_HERALDO:
#     esencias-bonus: 0.10
#   CALAMITY.MASCARA_DEL_ECO:
#     cordura-alucinaciones: 0.20
#   CALAMITY_ARMAS.FILO_DEL_ECO:
#     eco-dano: 0.15
#   CALAMITY_ARMAS.GUADANA_DE_LA_PARCA:
#     parca-dano-recibido: 0.10
piezas: {}

# Los sets. Ejemplo (quitar las # para usarlo):
#
#   manto-de-calamidad:
#     piezas:
#       - CALAMITY.YELMO_DE_CALAMIDAD
#       - CALAMITY.CORAZA_DE_CALAMIDAD
#       - CALAMITY.GREBAS_DE_CALAMIDAD
#       - CALAMITY.SOLERETAS_DE_CALAMIDAD
#     necesita: 4
#     bono:
#       cordura-drenaje: 0.15
#       durabilidad: 0.25
#   vestigio-del-eco:
#     piezas:
#       - CALAMITY.MASCARA_DEL_ECO
#       - CALAMITY_ARMAS.FILO_DEL_ECO
#     necesita: 2
#     bono:
#       eco-dano: 0.10
sets: {}
