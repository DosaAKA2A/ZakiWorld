# EDO, Ederus OneBlock - el nucleo del servidor OneBlock (la build recortada de EDM)
#
# Estos son sus modulos, cada uno con su carpeta y su config en plugins/EDO/:
#   tienda/   la tienda propia (/shop), con precio por jugador
#   flex/     la vitrina de cada jugador (/flex)
#   biomas/   Lethal Biomes, climas por zona (/lbiomes)
#   boost/    boosts temporales de exp, drops y minions (/boost)
#   anomaly/  jefes por fases (/anomaly) y esbirros con nivel (/esb). Desde
#             EDO 1.4.0: EderusDimensions puebla sus dimensiones con los esbirros.
#
# El resto de modulos de EDM no existen en EDO: no hay Rip, GodItems ni minas,
# y sus comandos no se registran.

modulos:
  tienda: true
  flex: true
  biomas: true
  boost: true
  anomaly: true
  # glow: el brillo, sustituye a FancyGlow (necesita TAB).
  glow: true

# Bitacoras de lectura: un fichero de texto por modulo y por dia en
# plugins/EDO/logs/, con una linea por suceso y la hora delante. Estan para
# LEERLAS cuando algo se tuerce y el log del servidor no dice lo suficiente.
logs:
  # En false no se escribe ninguna y no se toca el disco.
  activos: true

  # Se borran solos los ficheros con mas dias que esto. 0 = no borrar nada.
  dias: 14
