# Catalogo de la tienda de OneBlock. Generado por scripts/catalogo-oneblock.js.
#
# La tienda solo RECOMPRA materia prima: lo que suelta el bloque, los drops de
# mob y los cultivos. Los bloques decorativos y crafteados solo se compran, y
# asi no hay bucle de comprar-craftear-vender. Los precios de venta siguen la
# curva por fase medida en los JSON de SSBOneBlock (Llanuras ~550$ por cada
# 1.000 bloques picados, End ~2.900$).
#
#   compra:  lo que paga el jugador por una unidad. 0 = la tienda no lo vende.
#   venta:   lo que cobra el jugador por una unidad. 0 = la tienda no lo compra.
#   tope:    0 = sin tope (los topes por jugador estan apagados en config.yml).
