name: EDO
version: '1.4.0'
main: net.ederus.edm.EDMOneBlock
api-version: '1.20'
author: Iris Studio
description: 'EDO, Ederus OneBlock - el nucleo del servidor OneBlock: tienda propia, vitrina, biomas, boosts y esbirros'
softdepend: [Vault, WorldGuard, LibsDisguises, UltimateMobCoins, PlaceholderAPI, TAB]

commands:
  glow:
    description: 'Tu brillo: el contorno de color alrededor tuyo'
    usage: /glow [color|rainbow|flash|off|list]
    aliases: [glows]
  edo:
    description: Estado de EDO, el nucleo de Ederus OneBlock
    usage: /edo [reload]
  sellall:
    description: Vende todo lo vendible que lleves encima
    usage: /sellall
    aliases: [venderotodo]
  shop:
    description: 'La tienda de Ederus. Subcomandos en ingles por /shop, en espanol por /tienda'
    usage: /shop [search|sell|buy|price|limits|market|rotation]
    aliases: [tienda]
  flex:
    description: 'Tu vitrina: pon a la vista tus mejores objetos.'
    usage: /flex [jugador|showcase|power|top]
    aliases: [vitrina]
    permission: ederus.flex
  boost:
    description: 'Tus boosts temporales de experiencia, drops y minions'
    usage: /boost [give|clear|global|list]
    aliases: [boosts]
  anomaly:
    description: 'Panel de anomalias (jefes): iniciar, elegir, botin y ajustes.'
    usage: /anomaly <menu|start|here|at|stop|info|abilities|test|hurt|arena|biome|logros|reload>
    aliases: [anomalia, anom]
    permission: anomaly.gui
  esb:
    description: 'Los esbirros de mazmorra, por carpetas: crear, ajustar e invocar.'
    usage: /esb [lista|reload|<id> [nivel] [x y z]]
    aliases: [esbirros, esbirro]
    permission: anomaly.gui
  lbiomes:
    description: Lethal Biomes - climas por zona sin reiniciar
    usage: /lbiomes <list|zones|zone|paint|clear>
    aliases: [lethalbiomes]
    permission: ederus.biomas

permissions:
  fancyglow.admin:
    description: Todos los brillos y /glow set para otros (mismo nodo que FancyGlow)
    default: op
  fancyglow.all_colors:
    description: Los 16 colores de brillo
    default: false
  fancyglow.rainbow:
    description: El brillo arcoiris
    default: false
  fancyglow.flashing:
    description: El brillo que parpadea
    default: false
  ederus.boost.admin:
    description: Reparte, retira y pone boosts globales
    default: op
  ederus.flex:
    description: Permite montar una vitrina, verla y mostrarla en el chat
    default: true
  ederus.flex.admin:
    description: Recarga las vitrinas, salta el enfriamiento del anuncio y reinicia el top de Poder
    default: op
  ederus.biomas:
    description: Crea zonas de clima y las pinta con los biomas de Lethal Biomes
    default: op
  anomaly.gui:
    description: 'Abre el panel de Anomaly y usa todos sus subcomandos.'
    default: op
  anomaly.*:
    description: 'Todo Anomaly.'
    default: op
    children:
      anomaly.gui: true
  ederus.tienda.usar:
    description: Permite comprar y vender en la tienda
    default: true
  ederus.tienda.admin:
    description: Permite recargar el catalogo de la tienda
    default: op
