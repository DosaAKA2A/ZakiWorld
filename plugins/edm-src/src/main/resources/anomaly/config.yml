# ============================================================
#  ANOMALY  ·  Iris Studio
#
#  Todo esto se puede tocar desde el juego con /anomaly (el panel y su menu
#  Ajustes), y cada cambio hecho ahi se escribe aqui al momento.
#  Editar a mano tambien vale: despues, /anomaly reload.
#
#  Aqui solo van los ajustes GENERALES. Lo de cada jefe y cada esbirro vive
#  en su propio fichero, dentro de esta misma carpeta:
#
#    Anomalias/<id>.yml          ficha de cada anomalia: activa, rotacion, clase,
#                                nombre, vida, dano, textos del anuncio y clima.
#    Skills/Anomalias/<id>.yml   numeros de sus habilidades: activa, fase,
#                                enfriamiento, duracion, peso y dano de cada una.
#    Esbirros/<carpeta>/         los esbirros, una carpeta por mazmorra.
#    Skills/Esbirros/<id>.yml    los rasgos de cada esbirro.
#    Drops/Anomalias/<id>.yml    botin de cada anomalia.
#    Drops/Esbirros/<id>.yml     botin de cada esbirro.
#
#  Los ficheros que falten se crean solos con los valores de diseno.
# ============================================================

automatico:
  # Todas las anomalias salen en un solo sitio, el Coliseo (abajo). A mano (/anomaly
  # start o el boton Iniciar) y por turno; sin Coliseo marcado no sale ninguna.
  #
  # Encendido, el plugin abre UNA anomalia en cada turno del reloj.
  activo: false
  # Cada cuantas horas hay turno, de 1 a 12. Los turnos cuentan desde las 00:00 de
  # la zona horaria: con 4 salen a las 00, 04, 08, 12, 16 y 20. Un reinicio no los
  # corre. Si no divide 24 (5, 7...), a las 00:00 se vuelve a empezar.
  # Se cambia en el panel, boton "Cada cuanto sale".
  cada-horas: 4
  zona-horaria: America/Lima
  # Por debajo de esta gente conectada el turno espera.
  jugadores-minimos: 2
  # Si a la hora del turno habia otra abierta o faltaba gente, se sigue intentando
  # estos minutos. Pasado el margen, ese turno se pierde y se espera al siguiente.
  margen-minutos: 60
  # Sale una al azar entre las activas y en rotacion (clave 'rotacion' de cada ficha,
  # boton "Rotacion" del panel), sin repetir ninguna de las 3 ultimas que salieron.
  # Las ultimas se guardan en automatico.yml.
  #
  # El Coliseo: el bloque donde aparecen. Se marca desde el panel ("Punto del
  # Coliseo", golpeando el bloque) o de pie en el sitio con /anomaly coliseum.
  coliseo:
    mundo: ""
    x: 0.0
    y: 0.0
    z: 0.0

combate:
  # Quien este dentro de este radio ve las barras de jefe y cuenta para el botin.
  radio-participacion: 64

  # Si nadie la mata en este tiempo, se cierra sola y no reparte nada.
  minutos-limite: 15

  # Interruptor global del empuje. En false, ninguna habilidad movera a nadie
  # (misma regla que se pidio para las animaciones de Rip).
  permitir-empuje: true

  # Cuanto sube la vida del jefe por cada jugador de mas. 0.15 = +15% por jugador,
  # asi que cinco jugadores pelean contra un jefe con un 60% mas de vida.
  # En 0 el jefe pelea con la vida que diga el menu y nada mas.
  vida-extra-por-jugador: 0.15

  # Cada cuantos segundos el jefe se busca OTRO al que perseguir. La IA vanilla se
  # agarra al primero que ve y no lo suelta; contra un grupo eso regala la pelea.
  # Elige entre el que mas le ha pegado desde la ultima rotacion y otro al azar.
  # En 0 se apaga y el jefe vuelve a comportarse como un mob normal.
  rotar-objetivo-segundos: 6

  # Que parte del golpe a un jugador alcanza tambien a quien tenga al lado, y en que
  # radio. Sirve para que las habilidades de un solo objetivo castiguen igual al grupo
  # apinado sin tener que reescribirlas una por una. En 0 no salpica.
  salpicadura: 0.6
  radio-salpicadura: 4

  # Devuelve el golpe de un jugador a lo NUESTRO cuando una proteccion de terreno lo ha
  # cancelado. WorldGuard deja pegar a los monstruos, pero protege como si fueran
  # ganado o construccion a todo lo demas: un aldeano (el Piromante), un golem, una
  # cabra, un conejo, un soporte de armadura. Dentro de una region cerrada (el
  # coliseo, las mazmorras) a esos no se les podia pegar.
  # Vale para el jefe, su maniqui, sus esbirros, los objetivos destructibles y los
  # esbirros de /esb, haya o no una anomalia abierta. Nada mas de la region cambia.
  saltarse-protecciones: true

arena:
  # Zona de Lethal Biomes que hace de arena (/lbiomes zone create ...). Si una anomalia
  # abre DENTRO de esa zona, la zona entera toma el clima de la anomalia mientras dure
  # la pelea y vuelve a su bioma al cerrarse. Vacio = las anomalias no tocan el clima.
  # El clima de cada una se cambia con /anomaly biome <id> <biome|none>
  # (se guarda como 'bioma' en Anomalias/<id>.yml).
  zona: ''

  # La arena como REGION propia: se protege sola, con o sin WorldGuard encima.
  # Dentro nadie rompe, pone, quema, revienta ni inunda nada, y SOLO se puede romper lo
  # que levanta la anomalia (los pilares de la Quimera, la tela de Aragon, las llamas
  # del Piromante). Eso ultimo se rompe siempre, aunque otra proteccion diga que no, y
  # no suelta nada. Tampoco se abren cofres ni se tocan marcos, cuadros y soportes.
  # Construye con normalidad quien tenga el permiso anomaly.arena.build (los
  # operadores lo tienen). Puertas, palancas y demas clics de uso NO se tocan: eso
  # sigue siendo cosa de WorldGuard si la region se mantiene; las dos conviven.
  # Se cambia con /anomaly arena protect on|off.
  proteccion:
    activa: true
    # true = de arriba abajo, sin mirar la altura de la zona (que se creo pensando en
    # el clima y puede dejar fuera el techo o los cimientos). false = la altura justa.
    columna-entera: true

botin:
  # A que distancia del cuerpo cae cada monton al reventar la tabla. El botin sale
  # disparado en arco y nadie lo puede recoger hasta que toca el suelo.
  distancia-minima: 10
  distancia-maxima: 15

anuncio:
  activo: true
  sonido: true
  titulo: true
  # Como se le dice a la gente que llegue: "ve /warp coliseo". Sale en el titulo
  # y en el chat (pulsable). Vacio = el titulo lleva las coordenadas.
  warp: "/warp coliseo"
  # La columna de luz del color de la anomalia sobre el jefe. Se ve desde lejos y
  # marca donde esta peleando dentro del Coliseo. Apagalo solo si pesa.
  pilar-de-luz: true

# Los logros se escriben solos como datapack dentro del mundo y se conceden a todos
# los que participaron en la pelea, no solo a quien da el ultimo golpe.
logros:
  # activo: si se escriben y se conceden los logros. Si falta, depende de la build:
  # encendido en EDM y APAGADO en EDO (OneBlock). Apagado no se escribe el datapack,
  # no se concede nada y no suena nada; si ya habia un world/datapacks/anomaly_logros
  # no se borra solo, puede quitarse a mano. Se relee con /anomaly reload.
  # activo: true
  sonido: true

menu:
  # La anomalia que abre el boton Iniciar del panel.
  seleccion: caballero_sepulcral
