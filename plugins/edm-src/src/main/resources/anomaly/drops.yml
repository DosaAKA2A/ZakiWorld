# ============================================================
#  ANOMALY  ·  tablas de botin
#
#  Lo normal es editarlo desde el juego: /anomaly -> Botin.
#  Ahi se arrastra el objeto real (vale cualquiera, tambien los de MMOItems)
#  y se ajustan probabilidad, cantidad y a quien le toca.
#
#  A mano tambien se puede. Formato de cada entrada de botin:
#    item:          el objeto serializado por Bukkit (conserva NBT y nombre)
#    probabilidad:  0.1 a 100
#    cantidad-min / cantidad-max
#    para:          TODOS | MEJOR | ALEATORIO
#
#  comandos: los ejecuta la consola al caer el jefe.
#            %jugador% se sustituye por el nombre.
#            [mejor]  -> solo corre para quien mas daño hizo.
#            [35%]    -> probabilidad de ese comando, POR JUGADOR.
#            Se combinan: "[mejor] [25%] crates key give %jugador% legendary 1"
#
#  Este fichero viene PRECARGADO por bandas de clase (2026-08-31):
#    Esbirros  calderilla constante + llave de vote de vez en cuando
#    Generales MobCoins, llaves de rankup y el primer totem
#    Monarcas  llaves gordas + libro del nucleo; sus ITEMS custom los pone
#              el dueño desde el juego, aqui solo va lo generico
#    DIOS      Aurora: garantizados + la Regalia del Alba por tiradas
# ============================================================

