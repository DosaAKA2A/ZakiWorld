# ---------------------------------------------------------------------------
# Brillo (glow): el contorno de color alrededor del jugador.
#
# Sustituye a FancyGlow y usa sus mismos permisos:
#   fancyglow.<color>      un color (red, dark_red, gold, yellow, green, dark_green,
#                          aqua, dark_aqua, blue, dark_blue, light_purple,
#                          dark_purple, white, gray, dark_gray, black)
#   fancyglow.all_colors   los 16
#   fancyglow.rainbow      el arcoiris (va cambiando de color)
#   fancyglow.flashing     el parpadeo
#   fancyglow.admin        todo, y /glow set para otros
#
# El color se cambia en el paquete del equipo de TAB que va a cada cliente, sin
# tocar los equipos (TAB no lo permite). Necesita ProtocolLib.
# ---------------------------------------------------------------------------
version: 1

# Cada cuantos ticks cambia de color el arcoiris (20 = un segundo).
arcoiris-ticks: 10
# Cada cuantos ticks se enciende o apaga el parpadeo.
parpadeo-ticks: 10

