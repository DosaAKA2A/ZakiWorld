# EDM - modulo tooltip
#
# Como se dibujan los encantamientos de un item.
#
# Esto NO toca los items: se reescribe el paquete justo antes de que salga
# hacia el cliente. Apagar el modulo (modulos.tooltip: false en el config del
# nucleo) deja el juego exactamente como estaba, sin limpiezas ni migraciones.

# Como se escribe el paquete. NO tocar sin motivo.
#   clon     se duplica el paquete y se escribe sobre el duplicado. Es el bueno:
#            lo que ProtocolLib entrega esta pegado al item vivo del inventario,
#            y escribir ahi cambia el item de verdad (paso, y se comprobo).
#   directo  se escribe sobre el paquete tal cual. Solo para comparar.
#   lectura  se calcula todo y no se escribe nada. Para aislar averias.
modo: clon

# Que paquetes se enganchan. Quitar uno y recargar es la forma de aislar una
# averia en segundos, sin recompilar ni reiniciar. Lista vacia = todos.
#   SET_SLOT              un hueco suelto de un inventario abierto
#   WINDOW_ITEMS          el inventario entero al abrirlo
#   SET_CURSOR_ITEM       lo que llevas cogido con el raton
#   SET_PLAYER_INVENTORY  un hueco de tu propio inventario
#   ENTITY_EQUIPMENT      lo que lleva puesto o en la mano un jugador
#   SET_CREATIVE_SLOT     ENTRANTE: limpia el eco del modo creativo. Sin este,
#                         un admin en creativo guarda el bloque dentro del item
#                         con solo tocarlo. No quitarlo.
paquetes:
  - SET_SLOT
  - WINDOW_ITEMS
  - SET_CURSOR_ITEM
  - SET_PLAYER_INVENTORY
  - ENTITY_EQUIPMENT
  - SET_CREATIVE_SLOT

# Hasta que nivel se escribe en numeros romanos.
# Por encima de este numero se usa la cifra normal.
romanos-hasta: 100

# Si se pone en true, solo se reescriben los items con algun encantamiento por
# encima del 10, que son los unicos que salen rotos en vanilla. El resto del
# servidor se ve igual que siempre.
# En false (por defecto) todos los items encantados se ven ordenados y en romano.
solo-los-que-se-rompen: false

# Orden de las lineas:
#   nombre   alfabetico por el id del encantamiento (siempre el mismo orden)
#   nivel    primero los niveles mas altos
#   ninguno  como venga guardado, que es lo que hace vanilla
# Las maldiciones van al final en todos los casos.
orden: nombre

# La cabecera del bloque. Vacio para no poner ninguna.
encabezado: '&#FFA500▎ Encantamientos:'

# Lo que va delante de cada encantamiento.
vineta: ' · '

# Un renglon en blanco ENCIMA del bloque, para que no quede pegado al nombre
# del item. Cada bloque separado del siguiente, como en el resto de los items.
linea-en-blanco-antes: true

# Y otro DEBAJO, entre nuestro bloque y el lore que ya trajera el item
# (el de MMOItems, el de un cofre, el que sea).
linea-en-blanco: true

# Lineas del lore que ya escribe otro plugin y que tienen que entrar DENTRO del
# bloque en vez de quedarse sueltas por encima del encabezado. El caso real son
# los encantamientos de AdvancedEnchantments, que se guardan como lore normal
# ("🗡 Vampiro III") y se quedaban arriba del todo.
#
# Solo se miran las lineas de arriba del todo, hasta el primer renglon en
# blanco: ahi es donde escribe AE. La descripcion del item y las estadisticas
# de MMOItems, que van mas abajo, no se tocan.
# Lista vacia = no absorber nada.
absorber:
  - ' [IVXLCDM]+$'

# Los absorbidos van antes que los vanilla (son los especiales del item).
absorbidos-primero: true

colores:
  vineta: '#545454'
  nombre: '#C8C8C8'
  # Las maldiciones (Vinculacion, Desaparicion) van enteras en este color.
  maldicion: '#FF5555'

  # El color del numeral segun el nivel. Cada entrada dice "hasta que nivel" y
  # con que color; la ultima vale tambien para todo lo que se pase de ella.
  #
  # Diez tramos de diez, del verde al rojo, la misma idea que las estrellas de
  # MMOItems: sin leer el numero ya sabes en que decena anda el encantamiento.
  niveles:
    - hasta: 10
      color: '#55FF55'   # 1-10, verde
    - hasta: 20
      color: '#8CFF4F'   # 11-20, verde lima
    - hasta: 30
      color: '#C4FF4A'   # 21-30, lima
    - hasta: 40
      color: '#F2F545'   # 31-40, amarillo
    - hasta: 50
      color: '#FFD23F'   # 41-50, ambar
    - hasta: 60
      color: '#FFAE3A'   # 51-60, naranja
    - hasta: 70
      color: '#FF8C35'   # 61-70, naranja fuerte
    - hasta: 80
      color: '#FF6B30'   # 71-80, teja
    - hasta: 90
      color: '#FF4A2B'   # 81-90, rojo
    - hasta: 100
      color: '#FF2626'   # 91-100, rojo intenso
