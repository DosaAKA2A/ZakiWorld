name: EDM
version: '1.3.0'
main: net.ederus.edm.EDMPlugin
api-version: '1.20'
author: Iris Studio
description: Nucleo de Ederus - Rip, Anomaly, libros, avisos de tiendas y la tienda propia
softdepend: [Vault, WorldGuard, ProtectionStones, MMOItems, LibsDisguises, AdvancedEnchantments, UltimateMobCoins]

commands:
  edm:
    description: Estado del nucleo de Ederus
    usage: /edm [reload]
  sellall:
    description: Vende todo lo vendible que lleves encima
    usage: /sellall
    aliases: [venderotodo]
  shop:
    description: Abre la tienda de Ederus
    usage: /shop
    aliases: [tienda]
  rip:
    description: Menu y ajustes de efectos Rip
    usage: /rip <gui|kill|death|list|info|test|reload>
  anomaly:
    description: 'Panel de anomalias: iniciar, elegir, botin y ajustes.'
    usage: /anomaly <menu|start|here|at|stop|info|abilities|test|hurt|logros|reload>
    aliases: [anomalia, anom]
  main:
    description: Comando principal del nucleo de Ederus
    usage: /main <reload|aviso|libro>
    aliases: [ederus, edmain]
    permission: ederus.admin
  etienda:
    description: Tienda de Ederus
    usage: /etienda <vender|comprar|precio|topes|recargar>
    aliases: [etnd]
  ederuslibro:
    description: Entrega un libro encantado aleatorio de calidad baja
    usage: /ederuslibro <jugador>
    permission: ederus.libro

permissions:
  ederus.tienda.usar:
    description: Permite comprar y vender en la tienda
    default: true
  ederus.tienda.admin:
    description: Permite recargar el catalogo de la tienda
    default: op
  rip.use:
    description: Acceso basico al menu Rip
    default: true
  rip.admin:
    description: Comandos administrativos (test, reload) y ver los nodos de permiso en el menu
    default: op
  rip.kill.blastoff:
    description: Efecto INMORTAL de kill "Despegue Estelar"; no lo concede rip.*
    default: false
  rip.death.sixtyseven:
    description: Efecto INMORTAL de muerte "SESENTA Y SIETE"; no lo concede rip.*
    default: false
  rip.death.agony:
    description: Efecto INMORTAL de muerte "Agonia"; exclusivo, no lo concede rip.*
    default: false
  rip.*:
    description: Acceso a todos los efectos Rip
    default: op
    children:
      rip.kill.blood: true
      rip.kill.hearts: true
      rip.kill.spark: true
      rip.kill.coins: true
      rip.kill.poof: true
      rip.kill.firework: true
      rip.kill.notes: true
      rip.kill.slash: true
      rip.kill.confetti: true
      rip.kill.pierce: true
      rip.kill.explosion: true
      rip.kill.frost: true
      rip.kill.inferno: true
      rip.kill.shockwave: true
      rip.kill.meteor: true
      rip.kill.geyser: true
      rip.kill.souls: true
      rip.kill.dragon: true
      rip.kill.totem: true
      rip.kill.chains: true
      rip.kill.eclipse: true
      rip.kill.lightning: true
      rip.kill.blackhole: true
      rip.kill.laser: true
      rip.kill.swordfall: true
      rip.kill.orbital: true
      rip.death.smoke: true
      rip.death.bones: true
      rip.death.bloodpool: true
      rip.death.splat: true
      rip.death.dust: true
      rip.death.firework: true
      rip.death.cherry: true
      rip.death.rain: true
      rip.death.balloons: true
      rip.death.spores: true
      rip.death.grave: true
      rip.death.shatter: true
      rip.death.void: true
      rip.death.ender: true
      rip.death.statue: true
      rip.death.whirlpool: true
      rip.death.angel: true
      rip.death.souls: true
      rip.death.glitch: true
      rip.death.phoenix: true
      rip.death.specters: true
      rip.death.implosion: true
      rip.death.supernova: true
      rip.death.lightning: true
      rip.death.pufferfish: true
      rip.death.requiem: true
  anomaly.gui:
    description: 'Abre el panel de Anomaly y usa todos sus subcomandos.'
    default: op
  anomaly.*:
    description: 'Todo Anomaly.'
    default: op
    children:
      anomaly.gui: true
  ederus.admin:
    description: Permite usar /main (recargar el nucleo y probar los avisos)
    default: op
  ederus.libro:
    description: Permite usar /ederuslibro
    default: op
