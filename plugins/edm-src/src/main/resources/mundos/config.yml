# Lethal World - mundos con el generador de EDM (terreno y estructuras de Bracken, procesados)
#
# Los mundos se crean con /lw create <nombre> <generador> y existen tras reiniciar: Paper
# carga cada uno como la dimension lethal_world:<nombre>. Borrar uno con /lw delete deja
# de cargarlo, pero su carpeta queda en disco.
#
# OJO: todos los mundos comparten la semilla del servidor. Dos mundos con el MISMO
# generador salen con el terreno identico.

# Nombre que se enseña de cada generador (el id no se toca: es el del datapack).
generadores:
  panacea:
    nombre: "Panacea - junglas, pantanos y bosques"
  the_faewild:
    nombre: "Tierras Feéricas - bosques y castillos"
  pax:
    nombre: "Pax - jardines en el cielo"
  the_brine:
    nombre: "La Salmuera - océano, arrecifes y puertos"
  glacium:
    nombre: "Glacium - tierras heladas"
  sanctum:
    nombre: "Sanctum - tierra de nadie y ruinas"
  the_underdark:
    nombre: "Inframundo - cavernas y calderas"
  dormis:
    nombre: "Dormis - bajo un techo de roca"
  omnidrome:
    nombre: "Omnidromo - ciudad industrial"
  varskspace:
    nombre: "Varskspace - el espacio"
  void:
    nombre: "El Vacío"

# /lw pregen: pregenerar antes de abrir un mundo, para que explorar no genere en caliente.
pregen:
  # Sin radio en el comando se usa el borde del mundo si lo tiene; si no, este (bloques).
  radio-por-defecto: 4000
  # Cuantos chunks se generan a la vez como mucho. El numero real lo ajusta solo.
  en-paralelo-maximo: 48
  # Si el tick medio pasa de estos ms, frena. 50 ms = 20 TPS justos.
  ms-por-tick-objetivo: 40

# Mobs de Lethal World: tipos de esbirro (se editan en /esb, carpeta "Lethal World · Panacea")
# que aparecen alrededor de cada jugador segun el bioma donde caen.
mobs:
  activos: true
  # Cada cuanto se intenta hacer aparecer uno por jugador (20 ticks = 1 s).
  cada-ticks: 40
  # Mobs de Lethal World como mucho alrededor de cada jugador, contados en este radio.
  tope-por-jugador: 6
  radio-conteo: 48
  distancia-minima: 20
  distancia-maxima: 40
  # Los que quedan a mas de esto de cualquier jugador se retiran.
  retirar-a: 96
  probabilidad-destacado: 0.05

  # nivel = rango de rankup x por-rango + poder de AuraSkills / poder-por-nivel, +-variacion.
  # Minimo real: rango 1 sin habilidades = 2. Maximo: rango 20 y poder 1100 = 95 (+10% = 100).
  nivel:
    placeholder-rango: "%notranks_rank_number%"
    por-rango: 2.0
    poder-por-nivel: 20.0
    variacion: 0.10
    extra-destacado: 5
    maximo: 100

  # MobCoins = lo que ese mob paga en el Survival (UltimateMobCoins/mobcoins.yml)
  #            x (1 + nivel / nivel-divisor) x multiplicador-mundo (x destacado).
  # Las paga EDM al que lo mata: pon estos mundos en disabled_worlds de UltimateMobCoins.
  mobcoins:
    base-minima: 0.5
    nivel-divisor: 20
    multiplicador-mundo: 1.5
    multiplicador-destacado: 3.0

  # bioma -> tipos. Se escribe sola la primera vez; se puede editar.
  biomas: {}

# Mundos creados. Lo escribe /lw create; tocarlo a mano tambien vale.
mundos: {}
