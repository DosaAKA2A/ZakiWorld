# Calidades de las cajas de PhoenixCrates.
#
# Como sortea: al abrir una caja configurada aqui, EDM elige primero la CALIDAD
# segun su porcentaje y despues el PREMIO dentro de esa calidad segun su peso.
# PhoenixCrates sigue poniendo la llave, la animacion y el menu; el premio que
# muestra la animacion es el que eligio EDM.
#
# El peso solo compara premios de la MISMA calidad: dos premios de peso 10 se
# reparten su calidad a medias, y uno de peso 20 sale el doble que uno de 10.
# El peso que tenga el premio en el yml de PhoenixCrates ya no reparte nada, pero
# tiene que ser mayor que 0: con peso 0 PhoenixCrates no lo ofrece y no sale.
#
# Una caja que no este aqui sortea como siempre, con los pesos de PhoenixCrates.
# Un premio de una caja configurada que no este en su lista NO sale nunca (la
# consola avisa al arrancar y al recargar).
#
# Despues de tocar este fichero: /edm crates reload
# Para ver las probabilidades que salen: /edm crates info <caja>

version: 1

# De menor a mayor. El orden es el de esta lista.
#   una-vez: true -> cada jugador puede sacar cada premio de esta calidad una sola
#   vez. Si ya lo tiene, se sortea entre los que le faltan; si los tiene todos, esa
#   calidad no cuenta para el.
calidades:
  raro:
    nombre: Raro
    color: '#7CFF7C'
  epico:
    nombre: Épico
    color: '#FF77FF'
  mitico:
    nombre: Mítico
    color: '#C79BFF'
  legendario:
    nombre: Legendario
    color: '#FFB347'
  ancestral:
    nombre: Ancestral
    color: '#FF7A45'
  inmortal:
    nombre: Inmortal
    color: '#FF5C7A'
  unico:
    nombre: Único
    color: '#FFAA00'
    una-vez: true

# Lo que se pinta en la vista previa de la caja, debajo del lore de cada premio.
# %calidad% sale con el color de su calidad; %probabilidad% es la del premio.
lore:
  linea: '&#%color%◆ %calidad% &#8F8F8F· %probabilidad% %'
  una-vez: '&#8F8F8FSe obtiene una sola vez'
  ya-obtenido: '&#FF5C5CYa lo obtuviste'

cajas:
