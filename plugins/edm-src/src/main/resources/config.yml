# EDM - nucleo de Ederus
#
# Cada modulo tiene su propia carpeta y su propio config dentro de plugins/EDM/:
#   rip/      efectos de kill y muerte      (antes plugins/Rip)
#   anomaly/  jefes y botin                 (antes plugins/Anomaly)
#   core/     libros y avisos de tiendas    (antes plugins/EderusMain)
#   tienda/   la tienda propia (/shop)
#   coinflip/ apuestas entre jugadores (/cf)
#   troll/    bromas de admin (/troll)
#   tooltip/  como se ven los encantamientos de los items
#   goditems/ comportamiento de los items (/gi)
#   dungeonloot/ cajas y llaves de mazmorra (/dl)
#   flex/     la vitrina de cada jugador (/flex)
#   biomas/   Lethal Biomes, climas por zona (/lbiomes)
#
# Al arrancar por primera vez se copian solos desde las carpetas viejas,
# que se conservan intactas por si hay que volver atras.

modulos:
  rip: true
  anomaly: true
  core: true
  tienda: true
  coinflip: true
  troll: true
  goditems: true
  dungeonloot: true
  flex: true
  biomas: true
  minas: true
  # Estos tres solo arrancan si esta su plugin: ProtocolLib, Quests y BattlePass.
  tooltip: true
  misiones: true
  bp: true

# Bitacoras de lectura: un fichero de texto por modulo y por dia en
# plugins/EDM/logs/, con una linea por suceso y la hora delante. Estan para
# LEERLAS cuando algo se tuerce y el log del servidor no dice lo suficiente.
logs:
  # En false no se escribe ninguna y no se toca el disco.
  activos: true

  # Se borran solos los ficheros con mas dias que esto. 0 = no borrar nada.
  dias: 14
