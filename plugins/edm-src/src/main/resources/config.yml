# EDM - nucleo de Ederus
#
# Cada modulo tiene su propia carpeta y su propio config dentro de plugins/EDM/:
#   core/     libros y avisos de tiendas    (antes plugins/EderusMain)
#   tienda/   la tienda propia (/shop)
#   coinflip/ apuestas entre jugadores (/cf)
#   troll/    bromas de admin (/troll)
#   tooltip/  como se ven los encantamientos de los items
#   goditems/ comportamiento de los items (/gi)
#   flex/     la vitrina de cada jugador (/flex)
#   biomas/   Lethal Biomes, climas por zona (/lbiomes)
#   boost/    boosts temporales de exp, habilidades, pesca, MobCoins y minions (/boost)
#   superbeacon/ Super Beacons: balizas propias con efectos de area (/superbeacon)
#
# Las anomalias y las bovedas de mazmorra (/anomaly, /esb, /dl) son desde la 1.92.0 el
# plugin Anomaly, con sus datos en plugins/Anomaly/, y los efectos de kill y muerte (/rip)
# el plugin Rip, en plugins/Rip/. Se siguen encendiendo o apagando aqui abajo, con
# modulos.anomaly, modulos.dungeonloot y modulos.rip.
#
# Al arrancar por primera vez se copian solos desde las carpetas viejas,
# que se conservan intactas por si hay que volver atras.

modulos:
  rip: true
  anomaly: true
  core: true
  tienda: true
  coinflip: true
  troll: true
  goditems: true
  dungeonloot: true
  flex: true
  biomas: true
  minas: true
  # Super Beacons. Sus efectos de tipo boost necesitan ademas boost: true.
  superbeacon: true
  # Estos tres solo arrancan si esta su plugin: ProtocolLib, Quests y BattlePass.
  tooltip: true
  misiones: true
  bp: true
  # El brillo (glow), sustituye a FancyGlow. Necesita TAB.
  glow: true
  # Calidades de las cajas de PhoenixCrates: sortea primero la calidad y luego el
  # premio dentro de ella. Necesita PhoenixCrates; el lore de la vista previa, ProtocolLib.
  crates: true
  # Boosts temporales (/boost). Este es el unico que hay que encender a mano: si
  # falta la linea, queda apagado.
  boost: false

# Bitacoras de lectura: un fichero de texto por modulo y por dia en
# plugins/EDM/logs/, con una linea por suceso y la hora delante. Estan para
# LEERLAS cuando algo se tuerce y el log del servidor no dice lo suficiente.
logs:
  # En false no se escribe ninguna y no se toca el disco.
  activos: true

  # Se borran solos los ficheros con mas dias que esto. 0 = no borrar nada.
  dias: 14
