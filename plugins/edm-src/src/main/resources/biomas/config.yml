# ============================================================
#  LETHAL BIOMES  ·  climas por zona
#
#  Los biomas son un datapack que EDM instala solo en el mundo principal
#  (datapacks/lethal_biomes). Minecraft congela la lista de biomas al arrancar:
#  un bioma NUEVO necesita un reinicio para existir. Pintarlo, cambiarlo o
#  quitarlo de una zona ya no reinicia nada.
#
#  Biomas extra: cualquier .json que se deje en plugins/EDM/biomas/extra/ se
#  instala en el datapack en el siguiente arranque (id = nombre del fichero).
#
#  Zonas: se crean con /lbiomes zone create ... y se guardan en zonas.yml.
# ============================================================

# Lo que el cliente NO puede hacer solo con el bioma y manda el plugin a cada
# jugador que este dentro de una zona pintada con ese clima.
#
#   nombre:           como se ve en los mensajes y en la lista
#   hora:             hora fija que ve el jugador dentro (18000 = medianoche). -1 = la del mundo
#   lluvia:           true = dentro siempre llueve para el jugador
#   rayos:            segundos medios entre rayos (solo visuales, no hacen dano). 0 = sin rayos
#   cenizas:          SIEMPRE, LLUVIA (solo si el mundo tiene lluvia o tormenta) o NUNCA.
#                     Con cenizas el agua de la lluvia se quita: llueve ceniza.
#   gas:              cuantas fumarolas de gas salen del suelo de la zona. 0 = ninguna
#   ecos:             segundos medios entre ecos del warden que oye cada jugador. 0 = sin ecos
#   sonidos:          sonidos sueltos que cada jugador oye a 4-14 bloques, solo el:
#                       cada: segundos medios entre uno y otro
#                       lista: ids de sonido de Minecraft (sin minecraft: delante). Una
#                              entrada tambien puede ser {id: ..., volumen: ..., tono: [..]}
#                              para que ese sonido lleve los suyos
#                       tono: [minimo, maximo] del tono (1 = normal)
#                       volumen: 0 a 1
#                       minimo, silencio, rango: opcionales, los de ritmo para este clima
#
#  Con lluvia: true en un clima frio (temperatura bajo 0.15 en su .json) lo que cae es nieve.

# Ritmo de los sonidos sueltos (sonidos, ecos y el chasquido del gas). Son ambiente
# de fondo: nunca suena dos veces seguidas el mismo (con 4 o mas en la lista, ninguno
# de los dos ultimos).
#   minimo:    segundos que pasan como poco entre dos sonidos que oye un jugador
#   rango:     la espera es 'cada' por un numero al azar entre estos dos (0.5 a 1.5 = 'cada' de media)
#   silencio:  probabilidad (0 a 1) de que una espera dure el doble
ritmo:
  minimo: 12
  rango: [0.5, 1.5]
  silencio: 0.2

# En los mundos de Calamity el clima es de Calamity, sin la lluvia de Minecraft:
# ahi lluvia: true no moja al jugador (y la ceniza no le despeja el cielo). Las
# particulas, los rayos, el gas, los ecos y los sonidos del clima si salen.
#   activo:            false = tratar los mundos de Calamity como cualquier otro
#   mundos:            mundos que se tratan como de Calamity ademas de los que
#                      Calamity tiene en hardcore.mundos (esos se leen solos)
#   cenizas-sin-dato:  la ceniza en modo LLUVIA sale con la lluvia de Calamity
#                      (lo pregunta por %lethalworld_clima%). Si no se puede
#                      preguntar (sin PlaceholderAPI o sin Calamity): SIEMPRE o NUNCA
calamity:
  activo: true
  mundos: []
  cenizas-sin-dato: NUNCA
biomas:
