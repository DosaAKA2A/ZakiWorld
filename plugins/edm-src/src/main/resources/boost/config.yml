# ---------------------------------------------------------------------------
# Boosts temporales de Ederus: experiencia, drops y minions.
#
# Los reparten las cajas con un comando, por ejemplo desde ExcellentCrates:
#     boost give %player_name% exp 60
#     boost give %player_name% all 120
#
# Dos cosas que conviene saber antes de tocar numeros:
#   - el multiplicador que se aplica es el MAYOR entre el personal y el global,
#     nunca el producto: un evento global no dispara la economia;
#   - dos boosts del mismo tipo SUMAN tiempo, no se pisan.
# ---------------------------------------------------------------------------

# Lo que multiplica un boost cuando el comando no dice otra cosa.
multiplicador-por-defecto: 2.0

# Segundos antes del final en que se avisa por el chat. 0 lo apaga.
aviso-antes-de-acabar: 60

# La linea encima del hotbar con los boosts activos y su cuenta atras.
barra-de-accion: true

# Anunciar en el chat cuando empieza y cuando acaba un boost global.
anunciar-globales: true

# Mundos donde el boost no hace nada (lobbys, arenas, mazmorras con botin fijo).
mundos-excluidos: []

exp:
  activado: true

drops:
  activado: true
  # Bloques que no se multiplican nunca. Los spawners y los minerales de la mina
  # se dejan fuera para que un boost no convierta una mina de prision en una
  # fabrica de dinero.
  bloques-excluidos:
    - SPAWNER

minions:
  activado: true
  # LitMinions tiene un unico punto por donde pasa TODO lo que produce cualquier
  # minion antes de entrar al cofre. Enganchando ese evento valen todos los tipos
  # (granjero, minero, pescador, lenador, matarife...) sin duplicar nada: los
  # eventos por tipo multiplicarian otra vez lo ya multiplicado.
  eventos:
    - me.waterarchery.litminions.api.events.MinionAsyncAddItemToChestEvent
