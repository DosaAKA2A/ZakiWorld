# ---------------------------------------------------------------------------
# Todo lo que los Super Beacons le dicen al jugador: chat, holograma, objeto y
# menu.
#
# Codigos de color: &7, &#RRGGBB y el &x&R&R&G&G&B&B de Spigot, los tres. La
# negrita va SOLO en la palabra del prefijo. Para que una linea de chat salga
# SIN prefijo, empiezala con {sin-prefijo}. Las lineas de holograma, objeto y
# menu nunca llevan prefijo.
# ---------------------------------------------------------------------------
version: 3

prefijo: '&x&0&0&8&3&F&D&lBEACON &8» &f'

# --- colocar ---
# %nombre% %radio% %elegibles% %max% %tipo% %dueno% %fecha% %mundos%
colocado: '&fColocaste %nombre%&f. &7Alcance de &f%radio% &7bloques.'
colocado-elige: '&7Úsalo para elegir sus &f%elegibles% &7efectos.'
colocar-mundo: '&#FF5C5CEn este mundo no se pueden colocar Super Beacons.'
colocar-mundo-permitido: '&#FF5C5CEn este mundo no se pueden colocar Super Beacons. &7Solo en: &f%mundos%&7.'
colocar-mina: '&#FF5C5CNo se pueden colocar Super Beacons dentro de una mina.'
colocar-maximo: '&#FF5C5CYa tienes &f%max% &#FF5C5CSuper Beacons colocados. &7Recoge uno antes de poner otro.'
colocar-tipo: '&#FF5C5CEste Super Beacon es de un tipo que ya no existe (&f%tipo%&#FF5C5C). &7Avisa al staff.'
colocar-repetido: '&#FF5C5CEste Super Beacon ya está colocado en otro lugar.'
colocar-ajeno: '&#FF5C5CEste Super Beacon es de &f%dueno%&#FF5C5C: solo su dueño puede colocarlo.'
colocar-reservado: '&#FF5C5CEste Super Beacon está reservado para otro jugador.'
colocar-vencido: '&#FF5C5CEste Super Beacon venció el &f%fecha%&#FF5C5C.'

# --- usarlo, picarlo y recogerlo ---
# %dueno% %clan% %nombre% %radio%
ajeno: '&7Este Super Beacon es de &f%dueno%&7.'
ajeno-clan: '&7Este Super Beacon es de &f%dueno% &7y beneficia al clan &f%clan%&7.'
romper-ajeno: '&#FF5C5CEste Super Beacon es de &f%dueno%&#FF5C5C: solo su dueño puede recogerlo.'
# Al staff que pica uno ajeno (no se lo lleva). %dueno% %id%
romper-staff: '&#FFB627Este Super Beacon es de &f%dueno%&#FFB627: picarlo no lo recoge. &7Para devolvérselo, úsalo y elige Recoger, o escribe &f/superbeacon remove %id%&7.'
recogido: '&fRecogiste %nombre%&f. &7Conserva sus efectos, su dueño y su vencimiento.'
sin-espacio: '&#FF5C5CNo tienes espacio en el inventario. &7Libera una casilla e inténtalo de nuevo.'
ya-no-esta: '&#FF5C5CEse Super Beacon ya no está ahí.'
alcance: '&7Este es su alcance: &f%radio% &7bloques. Lo verás durante 10 segundos.'

# --- elegir efectos desde el menu ---
# %efecto% %elegidos% %elegibles% %motivo%
efecto-activado: '&fActivaste &#5CFF7A%efecto%&f. &7(%elegidos% de %elegibles%)'
efecto-desactivado: '&7Desactivaste &f%efecto%&7. (%elegidos% de %elegibles%)'
efecto-tope: '&#FFB627Ya tienes &f%elegibles% &#FFB627efectos activos. &7Desactiva uno para elegir otro.'
efecto-fijo: '&7Este Super Beacon lleva todos sus efectos activos siempre.'
efecto-no-disponible: '&#FF5C5C%efecto% no está disponible: &7%motivo%.'

# --- vuelo ---
vuelo-saliendo: '&#FFB627Saliste del alcance del Super Beacon: &fen 5 segundos &#FFB627dejas de volar.'
vuelo-perdido: '&7Ya no puedes volar.'
vuelo-perdido-aire: '&7Ya no puedes volar. &fCaes despacio &7durante unos segundos.'
# Al pegar o recibir un golpe de otro jugador (vuelo.sin-vuelo-en-combate-segundos). %segundos%
vuelo-combate: '&#FFB627En combate: &fsin vuelo del Super Beacon &#FFB627durante %segundos% segundos.'

# --- vencimiento ---
# %nombre%
vencido-apagado: '&7Tu %nombre% &7venció: se queda apagado, como recuerdo.'
vencido-destruido: '&7Tu %nombre% &7venció y desapareció.'

# --- entregas ---
# %nombre% %n%
entregado: '&fRecibiste %nombre%&f.'
pendientes: '&7Tienes &f%n% &7Super Beacon(s) esperándote. Libera espacio en el inventario para recibirlos.'
devuelto: '&7Tu %nombre% &7volvió a tu inventario.'
devuelto-pendiente: '&7Tu %nombre% &7te espera: te llega cuando tengas una casilla libre.'
# Se perdio tirado en el suelo (cayo al vacio...) y vuelve como pendiente.
perdido-devuelto: '&7Tu %nombre% &7se perdió en el suelo: &fvuelve a ti &7en unos segundos.'

# --- /superbeacon ---
# %n% %nombre% %donde% %estado%
lista-cabecera: '&7Tus Super Beacons colocados: &f%n%'
lista-linea: '{sin-prefijo} &#545454▸ %nombre% &#8A8A8A%donde% &8· &f%estado%'
lista-vacia: '&7No tienes Super Beacons colocados.'
sin-permiso: '&#FF5C5CNo puedes usar eso.'
solo-en-juego: '&7Eso se usa dentro del juego.'

# --- el tiempo (holograma, menu y listas) ---
# %tiempo%: "12 d 4 h", "4 h 12 min"...
restante: 'Quedan %tiempo%'
permanente: 'Permanente'
apagado: 'Apagado'

# --- a quien beneficia ---
beneficia-dueno: 'solo a su dueño'
beneficia-clan: 'a su clan'
beneficia-todos: 'a todos'

# --- colores ---
# El color de cada tipo (el primero de su nombre en config.yml) es el UNICO acento:
# va en %acento% y se usa para el nombre, los simbolos y las cifras clave. Etiquetas
# en gris (&#8A8A8A), texto en blanco o gris claro (&#C4C4C4), rayas en gris oscuro
# (&#4E4E4E). Mejor no meter colores nuevos: el conjunto se ve ordenado por eso.

# --- el holograma ---
# Una linea por elemento; una linea que se queda vacia no sale.
# Marcadores: %nombre% %acento% %dueno% %clan% %de% %restante% %efectos%
#   %de%        "de <dueño>"; en los de clan, "Clan [X] · líder <dueño>"
#   %restante%  "Quedan 12 d 4 h", "Permanente" o "Apagado"
#   %efectos%   los efectos activos, separados por coma
# El tamaño, la altura y la cabeza que gira van en config.yml (holograma).
holograma:
  - '%nombre%'
  - '%de%'
  - '&#C4C4C4%restante%'
holograma-de-dueno: '&#8A8A8Ade &f%dueno%'
holograma-de-clan: '&#8A8A8AClan &f[%clan%] &#8A8A8A· líder &f%dueno%'
# De clan, pero su dueño no tiene clan ahora mismo.
holograma-de-lider: '&#8A8A8Alíder &f%dueno%'

# --- el objeto (nombre y lore) ---
# Un solo color por objeto, el de su tipo (el primero de su nombre en config.yml),
# en tres tonos que pone el plugin:
#   %fuerte%  el color del tipo: la categoria, "◆ Efectos..." y los ✦
#   %palido%  el mismo, aclarado: la frase y las etiquetas (Líder:, Vence el...)
#   el nombre va en degradado del tono claro al fuerte, sin negrita.
# El resto en blanco (&#F4F4F4) o gris (&#7A7A7A). Bloques separados por una
# linea en blanco, sin rayas. Las lineas de mas de 38 caracteres se parten solas.
#
# Bajo el nombre: "<categoria> · <para quien>".
lore-cabecera: '%fuerte%%categoria%&#7A7A7A · %palido%%para%'
lore-cabecera-sola: '%fuerte%%categoria%'
lore-categoria: 'Super Beacon'
# Los semanales (el trofeo). Sin clan fijado sale solo esto.
lore-categoria-trofeo: 'Campeón de la semana'
lore-de-dueno: 'Personal'
lore-de-clan: 'De clan'
lore-de-clan-fijo: 'Clan %clan%'
lore-de-todos: 'Para todos'
# La frase de cada tipo, entre comillas y en palido (frase-<tipo>). Sin la suya,
# un tipo usa su descripcion de config.yml.
frase-hogar: 'Cuida tu base mientras trabajas.'
frase-granja: 'La tierra rinde más bajo su luz.'
frase-guerra: 'Tu clan pelea mejor bajo su luz, en la base o en el frente.'
frase-fortuna: 'Siete días en que todo rinde más.'
frase-trofeo: 'Un solo clan lo gana cada semana. Esta vez, el tuyo.'
# Los efectos. Si ya se eligieron algunos, los no elegidos salen apagados.
lore-efectos-dueno: '%fuerte%◆ Efectos para ti'
lore-efectos-clan: '%fuerte%◆ Efectos para tu clan'
lore-efectos-todos: '%fuerte%◆ Efectos para todos'
lore-efecto: ' %fuerte%✦ &#F4F4F4%efecto%'
lore-efecto-libre: ' &#4E4E4E✦ &#7A7A7A%efecto%'
# %elige% sale solo en los que se eligen.
lore-alcance: '&#7A7A7AA %radio% bloques a la redonda.%elige%'
lore-elige: ' Elige %elegibles%.'
# De quien y hasta cuando. %fecha%: "domingo 11/10 a las 22:55" (con el año si
# no es el actual).
lore-dueno: '%palido%Dueño: &#F4F4F4%dueno%'
lore-lider: '%palido%Líder: &#F4F4F4%dueno%'
lore-dueno-libre: '%palido%Dueño: &#F4F4F4quien lo coloque primero'
lore-lider-libre: '%palido%Líder: &#F4F4F4quien lo coloque primero'
