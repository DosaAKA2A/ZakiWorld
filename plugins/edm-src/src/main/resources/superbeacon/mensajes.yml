# ---------------------------------------------------------------------------
# Todo lo que los Super Beacons le dicen al jugador: chat, holograma, objeto y
# menu.
#
# Codigos de color: &7, &#RRGGBB y el &x&R&R&G&G&B&B de Spigot, los tres. La
# negrita va SOLO en la palabra del prefijo. Para que una linea de chat salga
# SIN prefijo, empiezala con {sin-prefijo}. Las lineas de holograma, objeto y
# menu nunca llevan prefijo.
# ---------------------------------------------------------------------------
version: 1

prefijo: '&x&0&0&8&3&F&D&lBEACON &8» &f'

# --- colocar ---
# %nombre% %radio% %elegibles% %max% %tipo% %dueno% %fecha%
colocado: '&fColocaste %nombre%&f. &7Alcance de &f%radio% &7bloques.'
colocado-elige: '&7Úsalo para elegir sus &f%elegibles% &7efectos.'
colocar-mundo: '&#FF5C5CEn este mundo no se pueden colocar Super Beacons.'
colocar-mina: '&#FF5C5CNo se pueden colocar Super Beacons dentro de una mina.'
colocar-maximo: '&#FF5C5CYa tienes &f%max% &#FF5C5CSuper Beacons colocados. &7Recoge uno antes de poner otro.'
colocar-tipo: '&#FF5C5CEste Super Beacon es de un tipo que ya no existe (&f%tipo%&#FF5C5C). &7Avisa al staff.'
colocar-repetido: '&#FF5C5CEste Super Beacon ya está colocado en otro lugar.'
colocar-ajeno: '&#FF5C5CEste Super Beacon es de &f%dueno%&#FF5C5C: solo su dueño puede colocarlo.'
colocar-reservado: '&#FF5C5CEste Super Beacon está reservado para otro jugador.'
colocar-vencido: '&#FF5C5CEste Super Beacon venció el &f%fecha%&#FF5C5C.'

# --- usarlo, picarlo y recogerlo ---
# %dueno% %clan% %nombre% %radio%
ajeno: '&7Este Super Beacon es de &f%dueno%&7.'
ajeno-clan: '&7Este Super Beacon es de &f%dueno% &7y beneficia al clan &f%clan%&7.'
romper-ajeno: '&#FF5C5CEste Super Beacon es de &f%dueno%&#FF5C5C: solo su dueño puede recogerlo.'
recogido: '&fRecogiste %nombre%&f. &7Conserva sus efectos, su dueño y su vencimiento.'
sin-espacio: '&#FF5C5CNo tienes espacio en el inventario. &7Libera una casilla e inténtalo de nuevo.'
ya-no-esta: '&#FF5C5CEse Super Beacon ya no está ahí.'
alcance: '&7Este es su alcance: &f%radio% &7bloques. Lo verás durante 10 segundos.'

# --- elegir efectos desde el menu ---
# %efecto% %elegidos% %elegibles% %motivo%
efecto-activado: '&fActivaste &#5CFF7A%efecto%&f. &7(%elegidos% de %elegibles%)'
efecto-desactivado: '&7Desactivaste &f%efecto%&7. (%elegidos% de %elegibles%)'
efecto-tope: '&#FFB627Ya tienes &f%elegibles% &#FFB627efectos activos. &7Desactiva uno para elegir otro.'
efecto-fijo: '&7Este Super Beacon lleva todos sus efectos activos siempre.'
efecto-no-disponible: '&#FF5C5C%efecto% no está disponible: &7%motivo%.'

# --- vuelo ---
vuelo-saliendo: '&#FFB627Saliste del alcance del Super Beacon: &fen 5 segundos &#FFB627dejas de volar.'
vuelo-perdido: '&7Ya no puedes volar.'
vuelo-perdido-aire: '&7Ya no puedes volar. &fCaes despacio &7durante unos segundos.'

# --- vencimiento ---
# %nombre%
vencido-apagado: '&7Tu %nombre% &7venció: se queda apagado, como recuerdo.'
vencido-destruido: '&7Tu %nombre% &7venció y desapareció.'

# --- entregas ---
# %nombre% %n%
entregado: '&fRecibiste %nombre%&f.'
pendientes: '&7Tienes &f%n% &7Super Beacon(s) esperándote. Libera espacio en el inventario para recibirlos.'
devuelto: '&7Tu %nombre% &7volvió a tu inventario.'
devuelto-pendiente: '&7Tu %nombre% &7te espera: te llega cuando tengas una casilla libre.'

# --- /superbeacon ---
# %n% %nombre% %donde% %estado%
lista-cabecera: '&7Tus Super Beacons colocados: &f%n%'
lista-linea: '{sin-prefijo} &#545454▸ %nombre% &#8A8A8A%donde% &8· &f%estado%'
lista-vacia: '&7No tienes Super Beacons colocados.'
sin-permiso: '&#FF5C5CNo puedes usar eso.'
solo-en-juego: '&7Eso se usa dentro del juego.'

# --- el tiempo (holograma, menu y listas) ---
# %tiempo%: "12 d 4 h", "4 h 12 min"...
restante: 'Quedan %tiempo%'
permanente: 'Permanente'
apagado: 'Apagado'

# --- a quien beneficia ---
beneficia-dueno: 'solo a su dueño'
beneficia-clan: 'a su clan'
beneficia-todos: 'a todos'
sin-clan: 'sin clan'

# --- el holograma ---
# Una linea por elemento. Marcadores: %nombre% %dueno% %clan% %de% %restante% %efectos%
#   %de%        "del clan X" si beneficia a un clan y lo tiene; si no, "de <dueño>"
#   %restante%  "Quedan 12 d 4 h", "Permanente" o "Apagado"
#   %efectos%   los efectos activos, separados por coma
# Una linea con %restante% solo sale si el Super Beacon caduca (o ya se apagó);
# una linea que se queda vacia no sale.
holograma:
  - '%nombre%'
  - '&#8A8A8A%de%'
  - '&#D7F3FF%restante%'
holograma-de-dueno: 'de %dueno%'
holograma-de-clan: 'del clan %clan%'

# --- el objeto (lore) ---
# %radio% %beneficia% %dueno% %clan% %fecha% %efecto% %elegibles% %tipo%
objeto-efectos: '&#D7F3FFEfectos'
objeto-efecto-activo: '&#5CFF7A✦ &f%efecto%'
objeto-efecto-inactivo: '&#545454✦ &#8A8A8A%efecto%'
objeto-alcance: '&#545454▸ &#D7F3FFAlcance  &f%radio% bloques'
objeto-beneficia: '&#545454▸ &#D7F3FFBeneficia  &f%beneficia%'
objeto-dueno: '&#545454▸ &#D7F3FFDueño  &f%dueno%'
objeto-clan: '&#545454▸ &#D7F3FFClan  &f%clan%'
objeto-vence: '&#545454▸ &#D7F3FFVence  &f%fecha%'
objeto-vencio: '&#545454▸ &#D7F3FFVenció  &#FF5C5C%fecha%'
objeto-permanente: '&#545454▸ &#D7F3FFDuración  &fpermanente'
objeto-sin-dueno: '&#8A8A8ASe vuelve tuyo al colocarlo por primera vez.'
