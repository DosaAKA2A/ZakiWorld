# NO borres la linea version: el plugin la usa para poner al dia tu fichero
# cuando cambia el formato, guardando el tuyo al lado.
version: 2

# Cada cuanto se vuelcan los topes y el mercado a disco (segundos, minimo 30).
guardado-segundos: 120

# ---------------------------------------------------------------------------
# Topes por jugador. APAGADOS: se vende sin limite de horas ni de dia.
#
# El freno de la economia es el precio dinamico de mas abajo: si el servidor
# vende mucho de algo, ese algo pierde valor y hay que rotar a otra cosa. Un
# tope, ademas, es un muro; el precio que baja no bloquea a nadie.
#
# Los valores por item siguen en precios.yml, asi que encender esto los
# recupera tal cual estaban.
# ---------------------------------------------------------------------------
topes:
  activos: false

# ---------------------------------------------------------------------------
# Precio dinamico GLOBAL: lo que vende todo el servidor hunde el precio para
# todos. Es lo que obliga a rotar la economia en vez de exprimir un solo item.
#
#   precio = base x (suelo + (1 - suelo) x 2^(-V/H))
#
# V es lo vendido en el servidor y H cuanto hay que vender para quedarse a mitad
# de camino del suelo. La recuperacion es la misma operacion al reves: V se
# olvida solo con la vida media de abajo.
# ---------------------------------------------------------------------------
mercado:
  activo: true

  # El precio de venta MAS BAJO al que puede llegar, en tanto por uno sobre el
  # precio base. 0.25 = puede caer hasta un 75%.
  suelo: 0.25

  # Cada cuanto se olvida la mitad de lo vendido. Mas corto = se recupera antes.
  recuperacion: 6h

  # LA PERILLA PRINCIPAL: cuanto dinero tiene que sacar el servidor de un item
  # para que su precio caiga a mitad de camino del suelo.
  #
  # Mas bajo = se devalua antes = hay que rotar mas. Con 20.000, unas 2.000
  # cañas de azucar ya bajan el precio un 26%; con 300.000 hacian falta 30.000.
  # Vale para los 968 articulos a la vez y en proporcion: como se mide en
  # dinero, un item caro aguanta pocas unidades y uno barato muchas.
  presupuesto: 20000

  # LA RED DE SEGURIDAD. La venta nunca puede pasar de este porcentaje de la
  # compra efectiva del mismo item, pase lo que pase con los multiplicadores.
  # Si se acercaran, comprar y vender el mismo item daria beneficio: dinero
  # infinito. Hoy el peor caso natural del catalogo es 50%, asi que con 0.60
  # esto no se activa nunca; solo salta si algo se va de rango, y queda anotado
  # en el registro como RECORTE.
  margen-venta-compra: 0.60

# ---------------------------------------------------------------------------
# Ofertas y Demandas: las dos secciones que cambian solas cada dia.
#
# NO PUEDEN SOLAPARSE, y no depende de una comprobacion que se pueda olvidar:
# Ofertas solo elige items que la tienda NO recompra, y Demandas solo items que
# si se venden. Los dos conjuntos son disjuntos por construccion. Hace falta:
# en el catalogo hay cacao a compra 30 / venta 15, y un -65% lo dejaria a 10,50
# comprando y 15 vendiendo, que es dinero infinito.
#
# El sorteo es determinista por fecha: reiniciar no vuelve a sortear.
# ---------------------------------------------------------------------------
rotacion:
  activo: true
  cuantas-ofertas: 14
  cuantas-demandas: 14

  # Cuanto baja el precio de COMPRA en Ofertas.
  descuento-min: 0.15
  descuento-max: 0.65

  # Cuanto sube el precio de VENTA en Demandas.
  bonus-min: 0.25
  bonus-max: 0.75

  # Tope de TODO EL SERVIDOR por dia y por item. Sin esto, cuatro jugadores
  # agotarian el precio inflado en la primera hora.
  tope-diario-oferta: 512
  tope-diario-demanda: 512

  # 0 = la semilla sale solo de la fecha. Ponle un numero si quieres otra serie.
  semilla: 0
