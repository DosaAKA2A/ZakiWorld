# ---------------------------------------------------------------------------
# Todo lo que la tienda le dice al jugador por el chat.
#
# Codigos de color: &7, &#RRGGBB y el &x&R&R&G&G&B&B de Spigot, los tres.
#
# El prefijo sigue el convenio del resto del servidor (EDERUS », LAG »...).
# Se pega delante de cada linea; si dejas 'prefijo' vacio, no se pone nada.
# Para que una linea suelta salga SIN prefijo, empiezala con {sin-prefijo}.
# ---------------------------------------------------------------------------
version: 4

prefijo: '&x&0&0&8&3&F&D&lMARKET &8» &f'

# --- compra y venta ---
# %cantidad% %item% %total% %unidad% %saldo%
compra-hecha: '&fCompraste &x&D&7&F&3&F&F%cantidad% &fx &x&D&7&F&3&F&F%item% &fpor &#4FFF55%total%'
venta-hecha: '&fVendiste &x&D&7&F&3&F&F%cantidad% &fx &x&D&7&F&3&F&F%item% &fpor &#FDFF66%total%'
venta-hecha-todo: '&fVendiste &x&D&7&F&3&F&F%cantidad% &fx &x&D&7&F&3&F&F%item% &fpor &#FDFF66%total% &7(era todo lo que tenías)'
sellall-hecho: '&fVendiste &x&D&7&F&3&F&F%cantidad% &fobjetos de &x&D&7&F&3&F&F%tipos% &ftipos por &#FDFF66%total%'

# --- la pantalla de cantidad y el buscador ---
cantidad-pide: '&fEscribe la cantidad en el chat. &7Escribe cancelar para dejarlo.'
cantidad-mala: '&#FF5C5CEso no es un número&8: &7%texto%'
buscar-pide: '&fEscribe en el chat lo que buscas. &7Escribe cancelar para dejarlo.'
buscar-resultados: '&f%cuantos% resultados para &x&D&7&F&3&F&F%texto%'
buscar-sin-resultados: '&#FF5C5CNo encontré nada con &7%texto%'

# --- cuando no se puede ---
sin-dinero: '&#FF5C5CTe faltan %falta%&#FF5C5C.'
sin-espacio: '&#FF5C5CNo te cabe nada más en el inventario.'
no-se-vende: '&#FF5C5CLa tienda no compra %item%&#FF5C5C.'
no-se-compra: '&#FF5C5CLa tienda no vende %item%&#FF5C5C.'
no-esta: '&#FF5C5CEse objeto no está en la tienda.'
nada-que-vender: '&#FF5C5CNo tienes %item% &#FF5C5Cque la tienda acepte. &7Los objetos con nombre, encantados o de MMOItems no valen.'
nada-que-vender-todo: '&#FF5C5CNo tienes nada que la tienda compre.'
sin-permiso: '&#FF5C5CNo tienes permiso para comprar %item%&#FF5C5C.'
maximo-alcanzado: '&#FF5C5CYa tienes el máximo de %item% &7(%limite%)&#FF5C5C.'
oferta-agotada: '&#FF5C5CLa oferta de %item% &#FF5C5Cse agotó hoy. &7Mañana rota.'
demanda-cubierta: '&#FF5C5CLa demanda de %item% &#FF5C5Cya se cubrió hoy. &7Mañana rota.'
banco-fallo: '&#FF5C5CEl banco rechazó la operación&8: &7%motivo%'
tienda-no-lista: '&#FF5C5CLa tienda todavía está arrancando. Prueba en un momento.'

# ---------------------------------------------------------------------------
# AVISO DE ROTACION DEL MERCADO
#
# Se anuncia cuando cambian las Ofertas y la Demanda del dia. Mismo formato que
# el aviso de las tiendas de MobCoins del modulo core: bloque de chat con su
# raya, su titulo centrado y un boton pinchable.
#
# OJO al centrar: la fuente de Minecraft es proporcional, asi que el relleno de
# delante esta calculado en pixeles (centro del chat = 154 px, espacio = 4 px).
# Si cambias un texto hay que recalcular el relleno o quedara descentrado.
# ---------------------------------------------------------------------------
rotacion:
  activo: true

  # ---------------------------------------------------------------------------
  # AVISO A DISCORD (opcional).
  #
  # Pega aqui la URL del webhook del canal y el Mercado avisara ahi cada vez que
  # rote, con la lista de ofertas y demandas del dia. Vacio = apagado.
  #
  # La URL es una CREDENCIAL: quien la tenga puede publicar en ese canal. No se
  # escribe nunca en la consola ni en los logs, y este fichero no deberia acabar
  # en un repositorio publico.
  #
  # El aviso NUNCA frena al servidor: se manda por su cuenta y si Discord no
  # responde, se pierde ese aviso y ya. Para probarlo sin esperar a medianoche:
  # /etienda webhook
  # ---------------------------------------------------------------------------
  webhook: ''
  webhook-titulo: 'El Mercado se renovó'
  webhook-texto: 'Las ofertas y la demanda del día han cambiado.'
  webhook-pie: 'Vuelve a cambiar a medianoche · /shop'
  # Cuantos articulos se listan de cada seccion antes de resumir con "y N mas".
  webhook-cuantos: 10
  sonido: 'block.note_block.pling'
  boton-texto: '&x&0&0&8&3&F&D&lA&x&2&2&9&5&F&D&lB&x&4&4&A&7&F&D&lR&x&6&6&B&9&F&D&lI&x&8&8&C&B&F&D&lR &x&A&A&D&D&F&D&lT&x&C&C&E&F&F&D&lI&x&D&7&F&3&F&F&lE&x&D&7&F&3&F&F&lN&x&D&7&F&3&F&F&lD&x&D&7&F&3&F&F&lA'
  boton-comando: '/shop'
  boton-hover: '&7Clic para abrir la tienda'
  chat:
    - '      &8&m                                                                '
    - ''
    - '                        &x&0&0&8&3&F&D&lM&x&2&2&9&5&F&D&lE&x&4&4&A&7&F&D&lR&x&6&6&B&9&F&D&lC&x&8&8&C&B&F&D&lA&x&A&A&D&D&F&D&lD&x&C&C&E&F&F&D&lO &x&D&7&F&3&F&F&lR&x&D&7&F&3&F&F&lE&x&D&7&F&3&F&F&lN&x&D&7&F&3&F&F&lO&x&D&7&F&3&F&F&lV&x&D&7&F&3&F&F&lA&x&D&7&F&3&F&F&lD&x&D&7&F&3&F&F&lO'
    - '                  &7Las ofertas y la demanda han cambiado'
    - ''
    - '             &b* &fOfertas del día &7hasta un 65% más baratas'
    - '             &b* &fDemanda del día &7se paga hasta un 75% más'
    - '             &b* &fVuelve a cambiar &7a medianoche'
    - ''
    - '                        &8[ %boton% &8]'
    - '      &8&m                                                                '
