# ---------------------------------------------------------------------------
# GodItems: items con activadores, acciones y condiciones.
#
# Los items NO se definen aqui. Cada uno es un YAML suelto en
#   plugins/EDM/goditems/items/<loquesea>.yml
# y se recargan todos con /gi reload (o /edm goditems reload).
#
# Este fichero solo lleva los ajustes del modulo.
# ---------------------------------------------------------------------------

# Cada cuantos ticks se repasan los activadores de tick (EN_MANO, PUESTO,
# EN_INVENTARIO). No es el intervalo de cada item: es el SUELO. El "cada" que
# ponga un item se redondea hacia arriba a un multiplo de esto, asi que con 10
# aqui un "cada: 3" se comporta como "cada: 10".
#
# Se hace asi porque repasar el inventario entero de todos los conectados sesenta
# veces por segundo cuesta caro y no se nota en nada.
ticks-de-revision: 10

# Vuelca la traza completa cuando una accion falla. Solo para depurar: en marcha
# normal basta con la linea de aviso.
detalle-en-el-log: false

# Los avisos que da el modulo por su cuenta. Aceptan codigos & y los mismos
# %placeholders% que las acciones. Dejar uno vacio lo apaga.
mensajes:
  # %tiempo% es lo que falta, ya escrito ("12.5s", "2m 10s").
  cooldown: '&7Aun no. Te quedan &f%tiempo%&7.'
  sin-usos: '&cEste objeto ya no tiene usos.'
  sin-usos-hoy: '&cPor hoy no te quedan usos de este objeto.'
  no-es-tuyo: '&cEste objeto no responde en tus manos.'

# Efectos de equipo (plugins/EDM/goditems/equipo/*.yml): como se escribe su lore.
# Las piezas, los sets y las claves NO van aqui, van en esa carpeta.
equipo:
  lore:
    # Cabecera de los efectos que no son de ningun grupo (pociones, atributos).
    cabecera-efectos: '&3Efectos'
    # Cabecera de cada escalon de set. {nombre}, {n} (piezas del escalon) y {total}.
    # Un set puede traer la suya con "cabecera:".
    cabecera-set: '<#5FB8FF>Set {nombre} ({n}/{total})'
    # {nombre} y {nivel} (en romanos).
    pocion: '&7· &f{nombre} {nivel}'
    # {valor} (con signo; "10%" si se escribio en porcentaje) y {nombre}.
    atributo: '&7· &f{valor} &7{nombre}'
  # Nombres en español de pociones y atributos que no traiga el modulo de serie.
  # nombres-pociones:
  #   night_vision: Visión nocturna
  # nombres-atributos:
  #   max_health: vida máxima
