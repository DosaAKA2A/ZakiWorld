# Jugadores distintos del Survival en el periodo (para la Participacion). null = sin dato.
jugadores_survival: null

# PROPUESTA de MED sec. 6.6; se puede afinar sin tocar el script.
pesos: {pedido: 0.30, comprado: 0.30, frustrado: 0.20, abierto: 0.10, arriesgado: 0.10}
