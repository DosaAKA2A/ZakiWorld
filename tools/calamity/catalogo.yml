      trueque: [frasco, recargar]
      recompensa: [frasco, frasco-1]
  cristal-regreso:
    nombre: Cristal de Regreso
    ids:
      trueque: [cristal]
      recompensa: [cristal]
  esencia-calamidad:
    nombre: Esencia de Calamidad
    ids:
      recompensa: [esencia]
      tienda: [GHAST_TEAR]
  tintura-ceniza:
    nombre: Tintura de Ceniza
    ids:
      trueque: [tintura]
      recompensa: [tintura]
      mmo: [CONSUMABLE.TINTURA_DE_CENIZA]
  gema-calamidad:
    nombre: Gema de Calamidad
    ids:
      trueque: [gema]
      recompensa: [gema]
      mmo: [GEM_STONE.GEMA_DE_CALAMIDAD]
  ascua-calamidad:
    nombre: Ascua de Calamidad
