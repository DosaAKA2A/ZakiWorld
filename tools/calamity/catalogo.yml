# Catalogo comun de recompensas para analizar_demanda.py (MEDICION-INTERES.md sec. 6.4).
#
# Cada recompensa canonica junta los ids con los que aparece en cada fuente:
#   trueque     id del trueque del Altar (suceso trueque / trueque-fallido)
#   forja       pieza del suceso forja (yelmo, coraza...)
#   mmo         TIPO.ID de MMOItems (censo de entra/muere, userdata, vitrinas) o VANILLA:<MATERIAL>
#   deseo       id de la lista de deseos (hardcore.deseos.candidatas o las de serie del plugin)
#   voto        opcion del Voto del Botin (pregunta "botin")
#   encuesta    "<pregunta>:<opcion>" de una encuesta que la nombra
#   umc         articulo de UltimateMobCoins (mobcoins.log y data/*-data.yml)
#   caja        "<caja>:<premio>" de ExcellentCrates (openings.log); admite comodines * ?
#   tienda      clave de la tienda de EDM (casi siempre el material)
#   recompensa  objeto de /lw hardcore dar (suceso recompensa)
#
# Los 50 del ranking de calc/ranking.py mas las de Calamity. Los ids de UMC son los de
# shops/rotating_shop.yml y shop_with_timer.yml (lectura-mobcoins.md sec. 3); las cajas, las
# 7 de ExcellentCrates mas "caos". El script avisa en alertas.md de todo id visto en los datos
# que no este aqui: se anade y se vuelve a pasar.

recompensas:
  # ----------------------------------------------------------------- Calamity
  manto-calamidad:
    nombre: Manto de Calamidad
    ids:
      trueque: [yelmo-manto, coraza-manto, grebas-manto, soleretas-manto]
      forja: [yelmo, coraza, grebas, soleretas]
      mmo: [ARMOR.YELMO_DE_CALAMIDAD, ARMOR.CORAZA_DE_CALAMIDAD, ARMOR.GREBAS_DE_CALAMIDAD, ARMOR.SOLERETAS_DE_CALAMIDAD]
      deseo: [manto]
      voto: [piezas-manto]
  hacha-heraldo:
