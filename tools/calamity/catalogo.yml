# Patrones de los logs que aun NO se han leido en produccion ([VERIFICAR] en la Fase 0:
# leer 20 lineas reales con --muestra y reescribirlos). Grupos obligatorios: fecha, jugador y
# articulo/precio (mobcoins) o caja/premio (openings). Los de abajo son los del ejemplo
# sintetico de tests/prod-ejemplo.
patrones:
  mobcoins: '^\[(?P<fecha>[\d.\-/]{8,10})[ T][\d:]+\]\s+(?P<jugador>\S+)\s+(?:bought|purchased|compr[oó])\s+(?:\d+\s*x\s*)?(?P<articulo>\S+).*?(?:for|por)\s+(?P<precio>[\d.,]+)'
  openings: '^\[(?P<fecha>[\d.\-/]{8,10})[ T][\d:]+\]\s+(?P<jugador>\S+)\s+(?:opened|abri[oó])\s+(?:crate\s+)?''?(?P<caja>[\w\-]+)''?.*?(?:won|got|gan[oó]|reward)\s+''?(?P<premio>[^'']+?)''?\s*$'

